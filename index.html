":[["IM","29–30"]]},{"h":"Typ I: Sensibilisierung und Auslösung","fl":{"s":[["B-Zelle nimmt das Allergen auf","über ihren B-Zell-Rezeptor"],["Präsentation auf MHC II"],["Aktivierung durch T-Helferzellen"],["B-Zelle wird Plasmazelle","bildet **IgE**"],["IgE bindet mit Fc an Mastzellen","Sensibilisierung abgeschlossen"],["Erneuter Kontakt","Allergen verbindet zwei IgE (**Crosslinking**) → Histamin"]]},"li":["**Mastzellen** stammen aus der myeloischen Vorläuferzelle und sitzen unter der Schleimhaut von Darm und Atemwegen sowie in der Haut; Granula mit **Histamin und Heparin**"],"tc":[["Histamin an …","Wirkung"],["Bronchien","Spasmus → Atemnot, Stridor"],["Haut","juckende Quaddeln (Urtikaria)"],["Gefäßen","Erweiterung → Kreislaufkollaps"],["Darm","Durchfall, Erbrechen, Bauchschmerzen"]],"m":"Vor jeder Allergie muss eine **Sensibilisierung** stattgefunden haben – beim ersten Kontakt gibt es noch kein passendes IgE.","q":[["IM","30–31"]]},{"h":"Fallbeispiele aus dem Skript","tb":[["Fall","Typ","Erklärung"],["Fußballer mit Wespenallergie kollabiert 5 min nach dem Stich","I","anaphylaktischer Schock → Schocklage, Notruf"],["Quaddeln 30 min nach erster Penicillin-Tablette","I","Arzneimittelallergie"],["Kind auf dem Pony: Tränen, Schnupfen, dann Asthmaanfall","I","Tierhaarallergie"],["Bedside-Test: Spender- und Empfängerblut verklumpen im Feld A","II","Blutgruppen passen – Transfusion möglich"],["Schwindel und große Milz eine Woche nach Penicillin","II","autoimmunhämolytische Anämie"],["Rhesus-negative Mutter, zweites Rhesus-positives Kind","II","IgG gehen über die Plazenta → Morbus haemolyticus neonatorum"],["3 Wochen nach Scharlach: Gelenkschmerzen, Blut im Urin","III","rheumatisches Fieber mit Glomerulonephritis"],["Anstieg der Leberwerte nach Lebertransplantation","IV","Abstoßung → mehr Immunsuppressiva"],["Juckende, nässende Stelle unter dem Jeansknopf","IV","Nickel-Kontaktekzem"],["Wochenlanger Durchfall, Geschwüre im Duodenum","IV","Zöliakie (Gluten auf HLA-II, T-Zellen greifen den Darm an)"]],"q":[["IM","31–37"]]},{"h":"Typ II und III unterscheiden","tb":[["","Typ II","Typ III"],["Antigen","an Zellmembran gebunden","löslich, bildet Immunkomplexe"],["Betroffen","die Zelle mit dem Antigen (z. B. Erythrozyt)","je nach Ablagerungsort: Gelenke, Nieren, Herzklappen"]],"q":[["IM","32–34"]]},{"h":"Transplantation und Immunsuppression","li":["Abstoßung entsteht v. a. durch unterschiedliche **MHC-(HLA-)Moleküle**: zytotoxische T-Zellen töten Zellen mit fremdem MHC","Medikamente greifen an Signal 1, 2 oder der Zellteilung an, z. B. **Ciclosporin, Tacrolimus** (Calcineurin), **Everolimus** (mTOR), **Mycophenolsäure**, **Belatacept** (Ko-Stimulation)"],"q":[["IM","38–39"]]}]},{"id":"haemostase","titel":"Blutgerinnung: primäre und sekundäre Hämostase","bereich":"Blut und Immunsystem","kurz":"Thrombozyten, vaskuläre und thrombozytäre Blutstillung, von Willebrand, Kaskadenmodell und zellbasiertes Modell","lern":[{"h":"Die Hauptakteure","li":["**Thrombozyten:** 1–3 µm, kernlos, 150.000–300.000/µl, leben 8–10 Tage, aus Megakaryozyten im Knochenmark","**Gefäßwand:** Intima (Endothel + Bindegewebe), Media (glatte Muskulatur; Aorta ca. 50 Schichten mit elastischem Gewebe), Adventitia (Bindegewebe mit Vasa und Nervi vasorum)","Im Blut fließen große Zellen in der Mitte, **Thrombozyten am Rand** (laminare Strömung, Scherkräfte) – immer in Tuchfühlung mit dem Endothel"],"q":[["GE","2–3"]]},{"h":"Übersicht: Ein Schauspiel in drei Akten","tb":[["Akt","Was passiert","Ergebnis"],["1. Primäre Hämostase","vaskuläre Blutstillung + Thrombozytenadhäsion, -aktivierung, -aggregation","**weißer Thrombus** (instabil)"],["2. Sekundäre Hämostase","plasmatische Gerinnung: Fibrinogen → Fibrin, Quervernetzung","**roter Thrombus** (Erythrozyten im Fibrinnetz)"],["3. Fibrinolyse","Plasmin spaltet das Fibrin, wenn das Endothel geheilt ist","Thrombus löst sich (D-Dimere)"]],"q":[["GE","1, 17"]]},{"h":"Primäre Hämostase","fl":{"s":[["Vaskuläre Blutstillung","glatte Muskeln ziehen sich innerhalb von Sekunden zusammen (ca. 60 s), verstärkt durch Serotonin und Thromboxan A₂"],["Adhäsion","vWF bindet am freiliegenden Kollagen (Typ I, IV); Thrombozyten binden mit dem **vWF-Rezeptor (GP Ib)** und dem **Kollagenrezeptor (GP Ia/IIa)**"],["Aktivierung","Formänderung mit Fortsätzen; Freisetzung von **ADP, Serotonin, Thromboxan A₂** → weitere Thrombozyten werden aktiviert"],["Aggregation","**Fibrinogen** bindet an den Fibrinogenrezeptor (**GP IIb/IIIa**) und verbindet die Thrombozyten → weißer Thrombus"]]},"li":["Der **vWF** stammt aus dem Endothel und trägt im Blut den Faktor VIII","Das Enzym **ADAMTS13** (v. a. aus der Leber) schneidet die langen vWF-Fäden klein. Fehlt es (meist durch Antikörper) → Thrombozyten verklumpen auch ohne Verletzung: **TTP** (thrombotisch-thrombozytopenische Purpura)"],"q":[["GE","3–6"]]},{"h":"Störungen der primären Hämostase","tb":[["Störung","Ursache","Zeichen"],["**Von-Willebrand-Jürgens-Syndrom** – häufigste angeborene Gerinnungsstörung","vWF fehlt oder funktioniert nicht","Nasenbluten, starke Monatsblutung, blaue Flecken, Nachblutungen, Hämarthros"],["Thrombozytopenie (unter 150.000/µl)","meist Antikörper: spontan (M. Werlhof), nach Infekten, nach Heparin","schwere Blutungen erst unter 15.000–20.000/µl"]],"q":[["GE",5]]},{"h":"Arteriosklerose und arterielle Thrombose","fl":{"s":[["Endothelschaden","mechanisch (Bluthochdruck), chemisch (Rauchen), Sauerstoffradikale (LDL, Fettstoffwechselstörung), Zuckerbindung (Diabetes mellitus)"],["Lipoproteine lagern sich in der Intima ein","Makrophagen schaffen es nicht → Entzündung"],["Glatte Muskelzellen wandern ein, die Wand verkalkt"],["Plaque bricht auf","Thrombozyten aggregieren → Verschluss"]]},"li":["Gut **90 %** aller Herzinfarkte entstehen so; bei Schlaganfällen ist es etwa ein Drittel"],"q":[["GE","6–7"]]},{"h":"Sekundäre Hämostase: Kaskadenmodell","tb":[["Weg","Start","Ablauf"],["Extrinsisch (exogen)","Verletzung legt **Gewebefaktor (III)** frei","III + VII → aktiviert X"],["Intrinsisch (endogen)","**XII** an negativen Oberflächen (z. B. Glas im Röhrchen)","XII → XI → IX (+ VIII) → aktiviert X"],["Gemeinsame Endstrecke","Xa + Va","Prothrombin (II) → **Thrombin (IIa)** → Fibrinogen (I) → **Fibrin**; XIIIa vernetzt"]],"li":["12 Faktoren, gezählt bis 13 (VI ist in Wirklichkeit Va). Alle außer III (Gewebefaktor) und IV (Ca²⁺) stammen aus der **Leber**; fast alle sind Proteasen","**Vitamin-K-abhängig:** II, VII, IX, X – Merke **1972** (Olympia-Attentat in München)"],"q":[["GE","8–9, 15"]]},{"h":"Warum das Kaskadenmodell nicht reicht","li":["Bei **Hämophilie A** (Faktor VIII fehlt) oder **B** (IX fehlt) dürfte nach dem Modell nichts passieren – der extrinsische Weg wäre ja da","Tatsächlich liefert der extrinsische Weg nur ca. **5 %** des Thrombins – einen „**Thrombinfunken**“"],"fl":{"s":[["III + VIIa auf subendothelialen Zellen","aktivieren X → etwas Thrombin"],["Thrombin gelangt zu den Thrombozyten"],["Thrombin aktiviert XI, VIII, V, XIII und Thrombozyten","XIa aktiviert IX"],["VIIIa + IXa (intrinsische Tenase)","50-mal effektiver als III/VIIa"],["Xa + Va","Va verstärkt Xa 250–1000-fach → massive Thrombinbildung"],["Fibrinnetz, roter Thrombus"]]},"m":"Das Kaskadenmodell beschreibt das **Reagenzglas**, das **zellbasierte Modell** den Körper: die Faktoren reagieren auf Zelloberflächen, beide Wege sind verwoben (VIIa aktiviert auch direkt XI bzw. IX – **Josso-Schleife**).","q":[["GE","9–11"],["VK","1–2"]]}]},{"id":"thrombose","titel":"Thrombose, Gerinnungshemmung und Fibrinolyse","bereich":"Blut und Immunsystem","kurz":"Virchow-Trias, arteriell oder venös, endotheliale Antikoagulation, ASS, Heparin, Marcumar, NOAK, D-Dimere","lern":[{"h":"Virchow-Trias","li":["Rudolf Virchow prägte die Begriffe Thrombose, Embolie und Leukämie"],"tc":[["Komponente","Steht im Vordergrund bei …"],["1. veränderter Blutfluss","Venen (Immobilisation, lange Reisen)"],["2. veränderte Gefäßwand","Arterien (Arteriosklerose, aufgebrochener Plaque)"],["3. veränderte Blutzusammensetzung (Thrombophilie)","Venen: Flüssigkeitsmangel, Tumoren (z. B. Pankreaskarzinom), Faktor-V-Leiden, APC-Resistenz, Protein-C/S-Mangel"]],"q":[["GE","12–13"]]},{"h":"Arteriell oder venös?","tb":[["","Arteriell","Venös"],["Strömung","schnell, hohe Scherkräfte","langsam, Stase"],["Entstehung","Plaque reißt → **Thrombozyten** lagern sich an","**plasmatische Gerinnung** auch ohne Verletzung"],["Folge","Herzinfarkt, Schlaganfall","tiefe Venenthrombose → **Lungenembolie** (Embolus über das rechte Herz in die Lunge: Druck aufs rechte Herz, belüftete, aber nicht durchblutete Abschnitte = Totraum)"],["Medikamente","**Thrombozytenaggregationshemmer**","**Antikoagulantien**"]],"m":"Arterielles System → Thrombozytenaggregationshemmer (ASS, Clopidogrel). Venöses System → Antikoagulantien (Heparin, Marcumar, NOAK).","q":[["GE","12–13"]]},{"h":"Antikoagulation durch das Endothel","li":["Gesundes Endothel verhindert, dass der Thrombus über die Verletzung hinaus wächst","Antithrombin III, Protein C und Protein S stammen aus der Leber"],"tb":[["Substanz","Wirkung"],["NO, Prostazyklin (PGI₂)","verhindern die Aktivierung ruhender Thrombozyten"],["Heparansulfat","Co-Faktor für **Antithrombin III** → hemmt IIa, IXa, Xa, XIa, XIIa"],["TFPI","hemmt den extrinsischen Weg (Gewebefaktor + VII)"],["Thrombomodulin","bindet Thrombin; aktiviert mit **Protein S** das **Protein C** → inaktiviert Va und VIIIa"]],"q":[["GE",13]]},{"h":"Thrombozytenaggregationshemmer","tb":[["Wirkstoff","Angriffspunkt","Dauer"],["**ASS** (Aspirin, meistverkauftes Medikament)","hemmt **irreversibel** die Cyclooxygenase → kein Thromboxan A₂","8–10 Tage (Lebensdauer des Thrombozyten)"],["**Clopidogrel**, Prasugrel","**ADP-Rezeptor** irreversibel blockiert (Ticagrelor: reversibel)","Lebensdauer des Thrombozyten"],["Abciximab, Eptifibatid, Tirofiban","Fibrinogenrezeptor (GP IIb/IIIa)","–"]],"m":"**ASS + Ibuprofen:** Ibuprofen hemmt die COX nur reversibel (24–48 h) und blockiert ASS den Zugang. Für den Herzschutz müssen über 95 % gehemmt sein → **ASS ½ h vor oder frühestens 8 h nach Ibuprofen**.","q":[["GE","7–8"]]},{"h":"Antikoagulantien","tb":[["Wirkstoff","Wirkung","Wichtig"],["**Hirudin**","hemmt Thrombin","aus dem Speichel des Blutegels"],["**Heparin**","verstärkt Antithrombin III 1000-fach (hemmt Xa, IIa)","muss gespritzt werden; **HIT I** (früh, harmlos) und **HIT II** (nach ca. 2 Wochen, Antikörper gegen PF4 → Thrombosen und Thrombozytopenie, ca. 5 %; Heparin sofort absetzen). Fraktioniertes Heparin: weniger HIT, aber Vorsicht bei Niereninsuffizienz"],["**Vitamin-K-Antagonisten** (Marcumar)","verhindern das Vitamin-K-Recycling → weniger II, VII, IX, X","sehr wirksam, aber aufwendige Kontrolle, Blutungsgefahr"],["**NOAK** (Rivaroxaban, Apixaban, Edoxaban)","hemmen direkt **Faktor Xa**","1 Tablette täglich, weniger spontane Blutungen, wenig Kontrolle – aber teuer"]],"li":["**Vitamin K** entdeckte Henrik Dam (Nobelpreis 1943): Küken mit fettfreiem Futter bluteten; „K“ für Koagulation"],"q":[["GE","14–15"]]},{"h":"Fibrinolyse","fl":{"s":[["Endothel bildet tPA"],["tPA wandelt Plasminogen in **Plasmin**"],["Plasmin spaltet die Fibrinfäden"],["Spaltprodukte: **D-Dimere**"]]},"li":["**D-Dimere im Blut** → irgendwo läuft Gerinnung und gleichzeitig Fibrinolyse → Hinweis auf Thrombose","Bei Lungenembolie reicht die eigene Fibrinolyse nicht → **Fibrinolytika** (Streptokinase, Urokinase) aktivieren mehr Plasmin; auch bei Schlaganfall oder Herzinfarkt, wenn kein Katheter möglich ist"],"m":"Unter Fibrinolytika steigt die **Blutungsgefahr** erheblich.","q":[["GE","15–16"]]}]},{"id":"energie","titel":"Energiestoffwechsel und Leistungsphysiologie","bereich":"Stoffwechsel","razzia":2,"kurz":"Spiroergometrie, RQ, Energiespeicher, Glykolyse, Citratzyklus, Atmungskette, Laktat","lern":[{"h":"Warum der Sprinter nicht so lange und der Marathonläufer nicht so schnell läuft","li":["Hohe Intensität geht nur kurz, hohe Ausdauer nur bei geringerer Intensität","Bei hoher Intensität begrenzen **Glykogenspeicher** und **O₂-Angebot** (anaerobe Glykolyse nur kurz möglich)","Bei Ausdauerleistung werden **Fette** verbrannt – das braucht viel O₂, also muss die Intensität sinken"],"tb":[["Disziplin","Woher die Energie kommt"],["100 m (Weltrekord 9,58 s)","nur 5–6 s ATP, dann Kreatinphosphat, anaerobe und aerobe Glykolyse; es gewinnt, wer am wenigsten langsamer wird"],["1000 m (131,96 s)","Mix aus aerober und anaerober Glykolyse"],["Marathon (2 h 3 min)","aerobe Glykolyse und Fettoxidation; leere Glykogenspeicher = „Mann mit dem Hammer“. Taktik: knapp unter der Laktatschwelle laufen, im Ziel-Sprint „Gas geben“ (anaerob)"]],"q":[["MT1","1–4"]]},{"h":"Spiroergometrie","li":["**Definition:** fortlaufende Messung von **O₂-Aufnahme (V'O₂)** und **CO₂-Abgabe (V'CO₂)** pro Minute unter steigender Last (Watt bzw. km/h)","**Laufband** wird bevorzugt: beim Laufen trägt die Muskulatur das Körpergewicht allein; auf dem Fahrrad trägt der Rahmen mit → V'O₂max auf dem Laufband höher","Protokolle: **Rampe** (neuer) oder **Stufen**, danach eine Nachlastphase","V'O₂ und V'CO₂ hängen von den beanspruchten Muskelgruppen und ihrem Trainingszustand ab; sie korrelieren mit Herzfrequenz und Atemminutenvolumen"],"m":["**Respiratorischer Quotient RQ = V'CO₂ ÷ V'O₂**","RQ **0,7** = Fettverbrennung · RQ **1,0** = Kohlenhydratverbrennung · über 1 = zusätzliches CO₂ aus der Pufferung von H⁺","Fettverbrennung braucht mehr O₂ als Kohlenhydratverbrennung"],"q":[["MT1",2],["MT1",12]]},{"h":"Was die V'O₂max begrenzt (Zahnradmodell nach Wasserman)","fl":{"s":[["Lunge","Ventilation und Diffusion"],["Herz und Kreislauf","Herzminutenvolumen (HMV)"],["Muskel","Kapillarisierung, Mitochondrien, Transkriptionsfaktoren"]]},"li":["Die **V'O₂max** gilt als Hauptkriterium der Ausdauerleistungsfähigkeit","Beim **trainierten** Breitensportler begrenzt vor allem das **HMV**: das Sportlerherz schafft unter Belastung fast 50 % mehr HMV","Das **Schlagvolumen** erreicht bei etwa **50 % der V'O₂max** ein Plateau – danach steigt das HMV nur noch über die Herzfrequenz","Der Muskel könnte 2–3-mal mehr Blut verarbeiten, als das Herz maximal liefert","Für Breitensportler sind **mitochondriale Verbesserungen** entscheidend für den Trainingsfortschritt"],"q":[["MT1",3]]},{"h":"Energiebereitstellung unter Belastung","fl":{"s":[["ATP","maximale Energie, nach etwa 6 s verbraucht"],["Kreatinphosphat","überträgt sein Phosphat auf ADP, reicht knapp 1 min"],["Anaerobe Glykolyse","schneller als die aerobe, begrenzt durch H⁺ und Schmerz"],["Aerobe Glykolyse","liefert überlappend ab 1–2 min reichlich Energie"],["Fettsäureoxidation","läuft nach knapp 60 min an"]]},"q":[["MT1",3]]},{"h":"Energiespeicher","br":{"s":[["Triglyceride (11 kg)",420000,"420.000 kJ"],["Protein",100000,"100.000 kJ"],["Glykogen",2500,"2.500 kJ"],["Blutglukose",170,"170 kJ"]],"c":"Energiespeicher eines 70 kg schweren Menschen"},"li":["Glykogen: ⅓ in der Leber, ⅔ in der Muskulatur; 1 g Glykogen bindet etwa **2,7 g Wasser** (hydrophil) → schwer","Fette sind wasserfrei (hydrophob) → als Speicher viel leichter","ATP-Umsatz: in Ruhe etwa **40 kg pro Tag** (35 % durch die Skelettmuskulatur), 2 h Dauerlauf: 60 kg"],"q":[["MT1",4]]},{"h":"Stoffwechsel und seine Regulation","li":["**Stoffwechsel** = Abfolge miteinander gekoppelter Reaktionen","Energie entsteht durch **Oxidation** (Abgabe von Elektronen auf Sauerstoff) von Kohlenstoffverbindungen und wird als **ATP** gespeichert","**Wozu Energie?** Muskelkontraktion · Transport durch die Zellmembran (Na⁺/K⁺-ATPase) · Synthese von Makromolekülen"],"tb":[["Stellschraube","Beispiel"],["1. Menge an Substrat","Glukose und O₂ müssen da sein; Glukose muss in die Zelle (Glukosetransporter, gesteuert über den Insulinrezeptor)"],["2. Menge an Enzymen","über die Transkription (DNA → RNA)"],["3. Aktivität der Enzyme","Phosphorylierung (Phosphat aus ATP); Hemmung durch das Produkt („Feedback“)"]],"q":[["MT1","5–6"]]},{"h":"Drei Stufen der Energiegewinnung","tb":[["Stufe","Was passiert","Energie"],["1. Verdauung","Speichel (Mund), Magensäure (Magen), Galle und Pankreassaft (Zwölffingerdarm) spalten die Nahrung","keine"],["2. Umwandlung in Acetylgruppen","Glykolyse (Kohlenhydrate, Zytosol), β-Oxidation (Fette, Mitochondrium) → Acetyl-CoA","gering"],["3. Citratzyklus und Atmungskette","Acetyl-CoA → CO₂; Elektronen aus NADH+H⁺ und FADH₂ gehen in der Atmungskette auf O₂ → Wasser","aerob 32 ATP je Glukose"]],"li":["**Citratzyklus** (Hans Adolf Krebs, Nobelpreis 1953): im Mitochondrium, 8 Schritte. Teil 1: Acetyl-CoA wird auf Oxalacetat übertragen und zu 2 CO₂ abgebaut. Teil 2: Oxalacetat wird regeneriert"],"fl":{"s":[["Acetyl-CoA + Oxalacetat"],["Citrat"],["Abbau, 2 CO₂ werden frei"],["Oxalacetat"]],"loop":true},"q":[["MT1","6–7"]]},{"h":"Die Nährstoffe","tb":[["Nährstoff","Bau","Aufgaben"],["Kohlenhydrate","meist 6er- oder 5er-Kohlenstoffkette mit OH-Gruppen, hydrophil (Glukose, Fruktose)","Energiequelle · AB0-/D-Blutgruppen · Rückgrat der DNA (Desoxyribose) · Schleime · Knorpel"],["Fette","Triglyceride = Glycerin + 3 Fettsäuren; Lipase aus dem Pankreas spaltet sie","größter Energiespeicher · Lipogenese (Fettzellen bis 1000-fach größer) · Biomembranen (Phospholipide) · Steroidhormone (Testosteron, Cortisol)"],["Proteine","Aminosäureketten, komplex gefaltet","Aktin/Myosin, Hämoglobin · Antikörper · Na⁺/K⁺-ATPase · Hormone"]],"li":["**Gesättigt** (alle C-Atome mit H besetzt): fest bei Raumtemperatur (Butter, Schmalz) · **ungesättigt** (Doppelbindung): flüssig (Olivenöl, Fisch, Avocado, Nüsse)",["**Proteinstruktur:**","**Primär:** Abfolge der Aminosäuren (3 Basen der DNA kodieren eine Aminosäure, Aufbau im rER)","**Sekundär:** Wasserstoffbrücken zwischen nicht benachbarten Aminosäuren falten die Kette","**Tertiär:** Disulfidbrücken (S–S) zwischen entfernten Aminosäuren","**Quartär:** hydrophile und hydrophobe Abschnitte ergeben die endgültige Form"]],"q":[["MT1","8–9"]]},{"h":"Stoffwechselwege","tc":[["Fachwort","Bedeutung"],["Glykogenese","Glukose → Glykogen"],["Glykogenolyse","Glykogen → Glukose"],["Lipogenese","Glukose bzw. Fettsäuren → Fettspeicher"],["Lipolyse","Fettspeicher → Energie"],["Gluconeogenese","Aminosäuren (und Laktat) → Glukose, kostet Energie"]],"li":["**Gehirn:** nur Glukose (und Ketonkörper) – Fettsäuren passieren die Blut-Hirn-Schranke nicht. Ein minimaler Glukosevorrat muss immer da sein, sonst droht Bewusstlosigkeit","**Fasten:** Lipolyse; für den Glukosevorrat Glykogenolyse und Gluconeogenese aus Aminosäuren","**Überschuss:** Glukose füllt die Glykogenspeicher, danach die Fettspeicher; überschüssige Aminosäuren gehen als Harnstoff in den Urin"],"q":[["MT1",10]]},{"h":"Atmungskette","li":["**Oxidation** = ein Stoff (Elektronendonator, Reduktionsmittel) gibt Elektronen an Sauerstoff ab (Elektronenakzeptor, Oxidationsmittel). Der Donator wird oxidiert, O₂ wird reduziert, es entsteht Wasser","Ort: **innere Mitochondrienmembran** – viele Einstülpungen, viel Platz für die Komplexe („Kraftwerk der Zelle“)","Elektronen aus NADH+H⁺ und FADH₂ (aus Glykolyse, β-Oxidation, Citratzyklus) wandern von Komplex zu Komplex (Elektronentransportkette) → Protonengradient → treibt die **ATP-Synthase** an („Turbine“: ADP + P → ATP)","Ohne O₂ steht die Atmungskette still. Das Gehirn stirbt nach etwa **8 min** ohne O₂ irreversibel ab","**Cyanid** blockiert die Atmungskette (Cytochrom) → „inneres Ersticken“ trotz Sauerstoff"],"tc":[["Brennstoff","Gleichung","RQ"],["Glukose","C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O","6 ÷ 6 = 1,0"],["Palmitat (Fettsäure)","C₁₆H₃₂O₂ + 23 O₂ → 16 CO₂ + 16 H₂O","16 ÷ 23 ≈ 0,7"]],"q":[["MT1","12–13"]]},{"h":"Glykolyse","li":["Im **Zytoplasma jeder Körperzelle**: Glukose (C₆) wird in **10 Schritten** in 2 Pyruvat (C₃) zerlegt","Verbraucht 2 ATP, bildet 4 → netto **2 ATP** + 2 NADH+H⁺","Pyruvat → **Acetyl-CoA** (Pyruvat-Dehydrogenase, CO₂ wird frei) → Citratzyklus im Mitochondrium","Glukose stammt aus der Nahrung, dem Glykogenspeicher oder der Gluconeogenese","Gesteigert durch **Insulin** (mehr Hexokinase), gehemmt durch **Glukagon** und durch einen **niedrigen pH** (hemmt die Phosphofruktokinase 1)"],"m":"Nicht verwechseln: **Glukagon** (Hormon) ≠ **Glykogen** (Speicher).","q":[["MT1","13–14"]]},{"h":"Fettsäurestoffwechsel (β-Oxidation)","fl":{"s":[["Nahrungsfett → Fettsäuren + Glycerin"],["Aktivierung im Zytoplasma","in Leber- und Muskelzellen"],["Transport ins Mitochondrium","mit Hilfe von Carnitin"],["β-Oxidation in 4 Schritten","liefert FADH₂ und NADH+H⁺"],["Acetyl-CoA → Citratzyklus"]]},"li":["Die β-Oxidation selbst bildet **kein ATP** – das entsteht erst in der Atmungskette"],"q":[["MT1",14]]},{"h":"Anaerobe Energiegewinnung","tb":[["Art","Reaktion","Merkmal"],["Alaktazid","Myokinase: ADP + ADP → AMP + ATP · Kreatinkinase: Kreatinphosphat + ADP → Kreatin + ATP","sofort, aber kleiner ATP-Speicher (Organismus ca. 100 g)"],["Laktazid (anaerobe Glykolyse)","Glukose → 2 Pyruvat → 2 **Laktat**","nur 2 ATP statt 32 je Glukose; überbrückt den Start, Erythrozyten (ohne Mitochondrien) leben davon"]],"m":"Die anaerobe Glykolyse führt zur Übersäuerung – aber nicht durch Milchsäure! Gebildet wird **Laktat**, das Anion der Milchsäure.","li":["Bei O₂-Mangel staut sich NADH+H⁺ → Citratzyklus, β-Oxidation und Glykolyse werden gehemmt"],"q":[["MT1",15]]},{"h":"Laktatabbau im Cori-Zyklus","fl":{"s":[["Muskel bildet Laktat","anaerobe Glykolyse, gibt es ins Blut ab"],["Herz und Leber nehmen Laktat auf","viel NAD⁺ → Laktat wird wieder zu Pyruvat (Laktatdehydrogenase)"],["Leber bildet Glukose","Gluconeogenese, oder speichert sie als Glykogen"],["Glukose zurück ins Blut","für den Muskel"]],"loop":true},"li":["Das Vorkommen oder Fehlen von **NAD⁺** entscheidet über die Richtung der Laktatdehydrogenase","Unter extremer Belastung gewinnt das **Herz über 50 %** seiner Energie aus Laktat"],"q":[["MT1","15–16"]]},{"h":"Ketonkörper","li":["Bei Fasten oder Glukosemangel in der Zelle (z. B. insulinpflichtiger Diabetes) werden vermehrt Fettsäuren abgebaut","Überschuss an Acetyl-CoA → die **Leber** bildet wasserlösliche Ketonkörper: **Acetacetat, β-Hydroxybutyrat, Aceton**","Gehirn, Herz, Skelettmuskel und Nierenrinde wandeln sie zu Acetyl-CoA um und nutzen sie im Citratzyklus","Aceton kann nicht verwertet werden → wird über Atemluft und Urin ausgeschieden"],"q":[["MT2",1]]}]},{"id":"muskel","titel":"Muskel: Aufbau, Kontraktion und Kraft","bereich":"Muskel","razzia":2,"kurz":"Sarkomer, Querbrückenzyklus, Fasertypen, motorische Einheit, Kraft-Längen- und Kraft-Geschwindigkeits-Relation","lern":[{"h":"Das Sarkomer","li":["Unter dem Mikroskop zeigt der Skelettmuskel die **Querstreifung**: dunkle **A-Streifen** (anisotrop), helle **I-Streifen** (isotrop), darin schmale **Z-Streifen**","**Sarkomer** = Abschnitt zwischen zwei Z-Streifen, Länge ca. **2–2,5 µm**, Durchmesser ca. 1 µm; bei einer Kontraktion verkürzt es sich um ca. **0,4 µm**","Die Z-Scheiben sind der Ausgangspunkt für alle anderen Filamente"],"tc":[["Gruppe","Proteine"],["Kontraktil","Aktin, Myosin"],["Verankerung","Nebulin, Titin; in der Z-Scheibe u. a. Telethonin, Aktinin"],["Regulation","Troponin, Tropomyosin"]],"q":[["MT2","1–2"]]},{"h":"Aufbau eines Skelettmuskels","ly":{"s":[["Muskel","umhüllt von Muskelfaszie / Epimysium"],["Sekundärbündel","Perimysium"],["Primärbündel","mehrere Muskelfasern"],["Muskelfaser = Muskelzelle","Endomysium, Sarkolemm, bis zu 500 Zellkerne"],["Myofibrille","hintereinander geschaltete Sarkomere"],["Sarkomer","Aktin und Myosin"]],"c":"Von außen nach innen"},"li":["Neben den Muskelfasern liegen **Satellitenzellen** = muskuläre Stammzellen, wichtig für die Regeneration","Blutkapillaren liegen zwischen den Fasern im Endomysium"],"m":"Ein „Muskelfaserriss“ ist streng genommen ein **Muskelbündelriss**: es reißt ein Sekundärbündel, nicht eine einzelne Zelle.","q":[["MT2",2]]},{"h":"Aktin und Myosin","li":["Ein Myosinfilament besteht aus ca. **300 Myosinmolekülen**; jedes hat Schwanz, Hals und Kopf",["Der **Myosinkopf** hat:","eine Bindungsstelle für ATP","eine Bindungsstelle für Aktin","eine ATPase-Aktivität"],"Das **Aktinfilament** ist eine Doppelhelix aus kugeligen Aktinmolekülen; dazwischen liegen Tropomyosin und Troponin","Auslöser der Bindung: Anstieg des **Ca²⁺** in der Zelle und Bindung an **Troponin** (im glatten Muskel: Calmodulin)"],"m":["Entscheidend: unter ATP-Verbrauch spannt sich der Myosinkopf von **45° auf 90°** vor.","Die Myosin-Bindungsstelle am Aktin ist entweder mit Tropomyosin oder mit Myosin besetzt – „Myosin mit -myosin“."],"q":[["MT2",3]]},{"h":"Querbrückenzyklus","fl":{"s":[["Ca²⁺ wird frei","aus dem sarkoplasmatischen Retikulum, bindet an Troponin"],["Tropomyosin wird verschoben","die Bindungsstellen am Aktin werden frei"],["Bindung","gespannter Myosinkopf (90°) bindet an Aktin"],["Kraftschlag","Kopf geht in 45° zurück, Aktin und Myosin verschieben sich → Sarkomer verkürzt sich"],["Lösen","ATP bindet am Myosinkopf → er gibt das Aktin frei"],["Spannen","ATP-Spaltung spannt den Kopf wieder auf 90°"]],"loop":true},"li":["Ca²⁺ wird unter **Energieverbrauch** ins sarkoplasmatische Retikulum zurückgepumpt, Tropomyosin deckt das Aktin wieder ab – außer ein neues Aktionspotenzial setzt wieder Ca²⁺ frei","Ein Myosinkopf macht etwa **5 Kraftschläge pro Sekunde**; die Köpfe sind in unterschiedlichen Phasen",["**ATP verbrauchen:**","1. das Spannen des Myosinkopfes","2. das Zurückpumpen von Ca²⁺","3. an der Endplatte die Wiederaufnahme von ACh"]],"m":"**Totenstarre:** ohne ATP löst sich der Myosinkopf nicht mehr vom Aktin. Beginn nach 1–2 h an Lidern, Kaumuskeln (2–4 h) und kleinen Gelenken, dann Hals und weiter abwärts (Nysten-Regel), voll nach 6–12 h, löst sich nach 24–48 h.","q":[["MT2","4–5"]]},{"h":"Muskelfasertypen","tb":[["Merkmal","Typ I (slow twitch)","Typ IIb (fast twitch)"],["Anteil","ca. 50 %","10–20 % (Typ IIa intermediär: ca. 30 %)"],["Myosinkette","leicht","schwer"],["Leistung","sehr ausdauernd; exakt kontrollierte Bewegungen mit wenig Kraft (Feinarbeit)","rasche Ermüdung, hohe Kraft"],["Mitochondrien, Myoglobin","hoch („rot“)","niedrig („weiß“)"],["ATP-Gewinnung","v. a. β-Oxidation","v. a. Glykolyse"],["ATPase-Aktivität","moderat, ca. 10 Querbrückenzyklen pro Kopf und Sekunde","hoch, ca. 100 pro Sekunde"],["Ansteuerung","kleine Motoneurone, geringe Reizstärke genügt","große Motoneurone, hohe Reizstärke („eiserner Wille“), erst bei über 75 % der V'O₂max"]],"li":["Verteilung teils genetisch festgelegt, variiert zwischen Menschen, Abnahme im Alter","Vermutlich bestimmt das zeitliche Muster der Aktionspotenziale über Ca²⁺-empfindliche Transkriptionsfaktoren, welche Myosinkette gebildet wird"],"q":[["MT2","5–6"]]},{"h":"Motorische Einheit und Endplatte","li":["**Motorische Einheit** = α-Motoneuron im **Vorderhorn** des Rückenmarks + alle von ihm innervierten Muskelfasern","Ein Motoneuron versorgt bis zu 100 Fasern (Skript); jede Faser hat nur **ein** Motoneuron; die Fasern einer Einheit liegen mosaikartig verteilt"],"fl":{"s":[["ACh wird in den Spalt freigesetzt"],["ACh bindet an Rezeptoren des Sarkolemms"],["Kationenkanal öffnet","Aktionspotenzial in der Muskelfaser"],["Ca²⁺ aus dem sarkoplasmatischen Retikulum"],["Kontraktion"]]},"m":"**Myasthenia gravis:** Antikörper gegen ACh-Rezeptoren (Typ-II-Reaktion) → weniger Rezeptoren, weniger Ca²⁺, weniger Kraft. Therapie: ACh-Esterase-Hemmer, Kortison, Plasmapherese.","q":[["MT2","10–12"]]},{"h":"Wovon die Muskelkraft abhängt","li":["Die Kraft hängt von der **Zahl der Aktin-Myosin-Bindungen** ab. Diese wird bestimmt durch:",["**Impulsfrequenz** (Superposition): mehr Aktionspotenziale pro Zeit","Typ I arbeitet bei allen Intensitäten, Typ IIa bei hohen, Typ IIb bei besonders hoher Kraft"],["**Rekrutierung** motorischer Einheiten","kleine Motoneurone springen schon bei geringem ZNS-Reiz an (v. a. Typ I, fein dosiert)","starke Reize aktivieren große Motoneurone mit mehr und v. a. Typ-II-Fasern"],"**Sarkomerlänge** (Kraft-Längen-Relation)","**Kontraktionsgeschwindigkeit** (Kraft-Geschwindigkeits-Relation)"],"q":[["MT2",12]]},{"h":"Kraft-Längen-Relation","li":["Bei einer Sarkomerlänge von etwa **2,8 µm** können die meisten Myosinköpfe an Aktin binden → höchste Kraft","Kürzeres Sarkomer: die Filamente stoßen an, kein Platz für Bewegung · längeres Sarkomer: zu wenige Köpfe erreichen das Aktin","Dazu kommt die **passive Spannung** von Sehnen, Faszien und Bindegewebe – sie wird umso größer, je mehr der Muskel gedehnt wird"],"q":[["MT2",13]]},{"h":"Kraft-Geschwindigkeits-Relation (Hill)","li":["Leistung **P = F · v** (Kraft mal Geschwindigkeit) – eine Übung geht mit hohem Gewicht oder schneller Bewegung","Hill-Gleichung: **(F + a) · (v + b) = konstant** → je schneller, desto weniger Kraft","Schnellkraft und Maximalkraft sind beide trainierbar, der inverse Zusammenhang bleibt"],"br":{"s":[["exzentrisch (bremsend, Muskel wird gedehnt)",90,"≈ 90 %"],["isometrisch (keine Längenänderung)",80,"≈ 80 %"],["konzentrisch (Muskel verkürzt sich)",60,"≈ 60 %"]],"c":"Erreichbarer Anteil der Maximalkraft. 100 % nur bei Todesangst oder unter Drogen."},"q":[["MT2","13–14"]]}]},{"id":"training","titel":"Training und Anpassung","bereich":"Training","razzia":2,"kurz":"Sportlerherz, Hämatokrit und Höhentraining, Transkriptionsfaktoren, Überkompensation, Insulinresistenz","lern":[{"h":"Idealbedingungen für hohe Leistung (und hohe V'O₂max)","li":["Hohe Glykogenspeicher","Hohe O₂-Anlieferung","Hohe Mitochondriendichte","Gutes Verhältnis Muskelmasse zu Körpergewicht","Bessere Glukoseaufnahme in die Zelle","Bessere Glykolyse und β-Oxidation","Besserer Abtransport von Abfallstoffen, auch CO₂"],"m":"These: Mit Training kommen wir diesem Ideal auf verschiedenen Ebenen näher.","q":[["MT2",6]]},{"h":"Das Sportlerherz","tb":[["Wert","Untrainiert","Ausdauertrainiert"],["Herzgewicht","200–300 g","350–500 g"],["Herzvolumen","600–800 ml","900–1300 ml"],["Herzfrequenz Ruhe · Belastung","60–80 · ca. 200 /min","40–60 · ca. 200 /min"],["Schlagvolumen Ruhe · Belastung","60–90 · 75–105 ml","95–115 · 170–200 ml"],["Herzminutenvolumen Ruhe · Belastung","ca. 5 · ca. 18 l","ca. 5 · ca. 39 l"]],"li":["Ausdauertraining vergrößert das Herz; es kann unter Belastung sein **Schlagvolumen verdoppeln**","Das maximale HMV ist beim Ausdauertrainierten **fast verdoppelt** → mehr O₂ in die Muskeln, mehr CO₂ zur Lunge","Ruhe-HMV bleibt gleich (ca. 5 l) – der Trainierte schafft es mit niedrigerer Frequenz"],"q":[["MT2",6],["MTG",15]]},{"h":"Hämatokrit","m":["**Hämatokrit = Erythrozytenvolumen ÷ Blutvolumen**","Blutvolumen = Erythrozytenvolumen + Plasmavolumen"],"tc":[["Gruppe","Blut (ml/kg)","Erythrozyten","Plasma","Hk (%)"],["Untrainiert","77","30","47","45,0"],["Semitrainiert","91","36","55","45,5"],["Ski alpin","88","36","52","44,8"],["Schwimmen","97","37","60","43,5"],["Leichtathletik","105","40","65","43,4"],["Radrennsport","107","46","61","47,2"],["Triathlon","107","40","67","43,2"]],"li":["Trainierte haben **mehr Blut**; das Plasmavolumen nimmt etwas stärker zu als das Erythrozytenvolumen → Hk sinkt leicht („**Sportleranämie**“) – mehr Plasma bedeutet bessere Durchblutung der Kapillaren","Triathleten haben etwa 100 g mehr Eiweiß im Plasma (bindet Wasser)","Direkt nach dem Wettkampf ist der Hk durch Flüssigkeitsverlust hoch (je nach Intensität und Temperatur); die Hypovolämie lässt die Niere mehr Na⁺ zurückhalten","Flüssigkeitsverlust beim Sport normal 1–2 l pro Stunde, beim Hawaii-Triathlon bis 17 l geschätzt","Die Hk-Werte der Tabelle sind im Venenblut gemessen; mit der Formel aus den ml/kg-Werten kommt etwas weniger heraus"],"q":[["MTG",15],["MT2","6–7"]]},{"h":"Sonderfall Höhentraining","fl":{"s":[["In großer Höhe sinkt der pO₂"],["Die Niere schüttet Erythropoietin (EPO) aus"],["Mehr Erythrozyten aus dem Knochenmark"],["Hämatokrit steigt","mehr O₂-Transportkapazität"]]},"tb":[["Phase","Erythrozytenvolumen","Plasmavolumen","Hämatokrit"],["Akut (Stunden bis Tage)","gleich","sinkt","steigt"],["Langfristig (Wochen)","steigt","normalisiert sich","bleibt erhöht"]],"li":["Nachteil: mit steigendem Hk **steigt die Viskosität** → Gefahr von „Verstopfungen“ in kleinen Kapillaren","Hinweise, dass EPO das Wachstum von Tumorzellen anregt"],"q":[["MT2",7]]},{"h":"Wie Training Gene anschaltet","li":["**Transkription:** Transkriptionsfaktoren lassen bestimmte DNA-Abschnitte in mRNA umschreiben (im Zellkern)","**Translation:** am rER verbinden tRNA-Moleküle unter ATP-Verbrauch die passenden Aminosäuren zur Kette → Protein","Je drei Basen der DNA kodieren eine Aminosäure"],"tb":[["Training","Signalweg","Ergebnis"],["Widerstands- bzw. Krafttraining","Phospholipase D → Phosphatidsäure aus dem Sarkolemm → **mTOR**","mehr mRNA und rER-Protein → **Hypertrophie** (myofibrilläre Proteine, schwere Myosinketten, Typ IIb)"],["Intensives Ausdauertraining (bis über die anaerobe Schwelle)","pO₂ im Muskel sinkt → **HIF** → VEGF","**Angiogenese** (neue Gefäße, bessere Durchblutung); mehr Glykolyse-Enzyme und Glukosetransporter"],["Ausdauer, v. a. HIIT","ATP-Abbau → AMP → **AMPK**","mehr Enzyme der β-Oxidation; nach ~6 Wochen **+50–100 % Mitochondrien**"]],"m":"Die höchsten AMP-Werte entstehen bei kurzen, sehr intensiven Phasen mit kurzen Pausen (**HIIT**).","q":[["MT2","7–9"]]},{"h":"Regenerative Überkompensation","fl":{"s":[["Trainingsreiz","Belastung, Stoffwechselkapazität sinkt"],["Erholung","Transkriptionsfaktoren werden aktiv"],["Überkompensation","mehr Muskelprotein und mitochondriale Enzyme als vorher"],["Nächster Reiz zur richtigen Zeit"]]},"li":["**Pause zu kurz:** keine Zeit für die Überkompensation („Abtraining“)","**Pause zu lang:** der Zugewinn geht schon wieder zurück"],"m":"Belastung löst die Anpassung aus – besser wird man in den Ruhepausen.","q":[["MT2",9]]},{"h":"Use it or lose it","li":["Studie mit isometrischem Quadrizepstraining (4× pro Woche): Muskelquerschnitt steigt bis Trainingsende auf ca. +6 %","Nach dem Stopp ist der Zuwachs nach 1 Monat größtenteils, nach 2–3 Monaten ganz weg","Folge für die Praxis: kontinuierlich trainieren, nach Pausen niedriger einsteigen"],"q":[["R2","9–10"]]},{"h":"Sport und Diabetes mellitus","li":["Glukose aus der Nahrung füllt erst die Glykogenspeicher (reichen in Ruhe etwa einen Tag), dann die Fettspeicher",["**Diabetes mellitus** ist gekennzeichnet durch:","Überproduktion von Glukose in der Leber","vermehrte Gluconeogenese (Muskelabbau)","schlechtere Glukoseaufnahme in die Zelle (Insulinresistenz)"],"**Typ 1** (meist vor dem 20. Lebensjahr): autoimmune Zerstörung der β-Zellen → kein Insulin","**Typ 2** (bei uns ~90 %): Insulin anfangs sogar erhöht, aber der Rezeptor führt nicht mehr zum Einbau von Glukosetransportern","Die **Skelettmuskulatur** verbraucht etwa **85 %** der aufgenommenen Glukose"],"fl":{"s":[["Adipositas","Triglyceride übersteigen die Speicherkapazität der Fettzellen"],["Fett in Leber- und Muskelzellen"],["DAG und Ceramide","β-Oxidation schafft den Abbau nicht"],["Insulinrezeptor wirkt nicht mehr","weniger Glukosekanäle in der Membran"],["Blutzucker steigt","Glukose bindet an Endothelproteine und schädigt die Gefäße"]]},"m":"Training aktiviert die **AMPK** → bessere β-Oxidation → die Ursache der Insulinresistenz verschwindet: der Muskel baut wieder mehr Glukosekanäle ein, der Blutzucker sinkt.","q":[["MT2","9–10"]]}]},{"id":"muskelkater","titel":"Ermüdung, Muskelkater und Muskelverletzung","bereich":"Muskel","razzia":2,"kurz":"Warum Ermüdung im Gehirn entsteht, wie Muskelkater abläuft, Wärme oder Kälte, PECH-Regel","lern":[{"h":"Ermüdung entsteht im Gehirn","fl":{"s":[["Muskel unter Anstrengung","es häufen sich H⁺, Laktat und extrazelluläres ATP"],["Sensoren an afferenten Nervenendigungen","ASIC (H⁺), TRPV1, P2X (ATP) – dicht unter den Faszien, nahe den Gefäßen"],["Weiterleitung","frequenzkodiert: mehr Metaboliten → mehr Aktionspotenziale → Rückenmark → Gehirn"],["Empfindung im Gehirn","Ermüdung oder Schmerz"]]},"tc":[["H⁺","ATP","Laktat","Empfindung"],["erhöht","–","–","keine"],["–","erhöht","–","keine"],["–","–","erhöht","keine"],["mäßig erhöht","mäßig erhöht","mäßig erhöht","**Ermüdung**"],["hoch","hoch","hoch","**Schmerz**"]],"li":["**Nur die Kombination** der drei Metaboliten erzeugt eine Empfindung – einzeln erzeugen sie keinerlei Sinneseindruck","Ermüdung ist eine **Schutzfunktion des ZNS**: würde man die Signale blockieren, könnte der Muskel weiterarbeiten – bis zu ernsthaften Schäden"],"q":[["MTG","19–20"]]},{"h":"Woher kommen die Protonen?","li":["Aus der **ATP-Spaltung** bei den Querbrückenzyklen (ATP → ADP + Phosphat + H⁺)","Gebildet wird **Laktat**, nicht Milchsäure. Laktat + H⁺ = Milchsäure","Übersäuerung hemmt Enzyme (z. B. die Phosphofruktokinase der Glykolyse)"],"m":"„Milchsäure macht Muskelkater“ ist falsch: Laktat ist schnell verwertet, Muskelkater kommt erst nach 24–72 h und ist eine Verletzung mit Entzündung.","q":[["MTG",19],["MT1","14–15"]]},{"h":"Muskelkater (DOMS)","li":["**Beschwerden:** Schmerzen, Muskelverspannung, Bewegungseinschränkung","**Verlauf:** Höhepunkt nach **24–72 h**, Erholung nach **5–7 Tagen**","**Ursache:** Mikrotraumen, Zellschaden (Myoglobin, Kreatinkinase u. a. treten ins Blut über), Entzündungszellen wandern ein, Entzündungsmediatoren werden frei","Vor allem nach **exzentrischem** Training"],"fl":{"s":[["Exzentrische (bremsende) Belastung","Mikrotraumen im Muskelgewebe"],["Strukturschaden","Z-Streifen verbreitert, verschmiert oder aufgelöst"],["Membranschaden","Ca²⁺ strömt ein, ATP-Produktion gestört, Myoglobin tritt ins Blut aus"],["Entzündung (Tag 1–3)","Makrophagen und Neutrophile räumen ab, leichtes Ödem"],["Mediatoren","K⁺, Bradykinin, Prostaglandin E₂ sensibilisieren Aδ- und C-Fasern"],["Bewegung verstärkt den Schmerz","mechanische Reizung der sensibilisierten Nervenenden"],["Spontane Besserung","nach einigen Tagen – mit oder ohne Behandlung"]]},"q":[["MTG",20],["MTG",24]]},{"h":"Was hilft gegen Muskelkater?","li":["Ausprobiert wurde vieles: Massage, Wärme, Kälte, Dehnen, Medikamente, Elektrolyte (Mg²⁺, Ca²⁺), Sport, Ultraschall, Aminosäuren (BCAA), Koffein, Antioxidantien, Arnika, Sauerkirschsaft …","Behandlungen haben nur **begrenzte Wirkung**; leichte Aktivität lindert vorübergehend – hört man auf, kommt der Schmerz zurück","**Metaanalyse** (J Rehabil Med 2022, 59 Studien, 1367 Teilnehmende): in den **ersten 48 h** linderte **Wärme** (Wärmekissen) am besten, **nach 48 h** eher **Kälte**","Laut Skript kann Wärme auch die **Kraftverluste** besser lindern als Eis; länger dauernde Wärme (Auflagen über Stunden) ist kurzen Eisanwendungen überlegen","Kritik an den Studien: oft klein, schlecht verblindet, sehr unterschiedliche Verfahren"],"q":[["MTG","20–25"]]},{"h":"Wärme und Kälte im Vergleich","tb":[["","Wärme","Kälte (Kryotherapie)"],["Gefäße","Durchblutung ↑, Abfluss von Entzündungsmarkern","Vasokonstriktion, danach reaktive Hyperämie"],["Stoffwechsel","↑ – mehr Energie für die Proteinsynthese, Erholung der Übersäuerung","↓ – weniger Energiebedarf, weniger Sauerstoffradikale"],["Nerven","Entspannung, Schmerzlinderung","langsamere Nervenleitung, neuronale Hemmung, Sympathikus aktiviert"],["Gut für","Muskelkater, Verspannung","frische Verletzung: weniger Schwellung, Ödem, Schmerz und Schaden"]],"li":["20 min Kälte senken die Temperatur in 1 cm Tiefe um ca. 15 °C, in 3 cm um ca. 9 °C (Myrer)","**Van-’t-Hoff-Regel:** pro 10 °C Abkühlung wird der sekundäre (hypoxische und enzymatische) Schaden 2- bis 3-mal kleiner","Kälte steigert zuerst den Muskeltonus, dann senkt sie ihn"],"q":[["MTG","28–29"]]},{"h":"Muskelverletzungen","li":["Häufigste Sportverletzungen: im Fußball ⅓ aller Verletzungen, in Leichtathletik und Spielsportarten über 50 %","Über **90 %** sind Überdehnungen bzw. Zerrungen, der Rest v. a. Prellungen","Spitzenreiter: **M. rectus femoris, M. semitendinosus, M. gastrocnemius**","Meist **exzentrischer** Mechanismus (Kraft von außen trifft einen angespannten Muskel); Risse meist nahe dem Übergang Muskel–Sehne","**Diagnostik:** Schmerz, Schwellung, Funktionsverlust, Hämatom, tastbare Lücke, Dehnen und Anspannen gegen Widerstand – keine schmerzhaften Untersuchungen (Einblutung); ggf. Ultraschall, MRT"],"q":[["MTG","25–26"]]},{"h":"PECH-Regel – warum sie wirkt","tb":[["Maßnahme","Wirkung"],["**P**ause","Ruhigstellung verhindert weitere Einblutung"],["**E**is","Schmerzlinderung, Vasokonstriktion (kleineres Hämatom), Entzündungshemmung"],["**C**ompression","weniger Hämatom, vermutlich weniger Entzündung"],["**H**ochlagern","weniger Hämatom, weniger Ödem"]],"li":["Weitere Therapie: Physiotherapie, manuelle Therapie, Elektrotherapie, Ultraschall, Stoßwelle, Dehnung, Kinesiotaping, NSAR, Injektionen","Kortison hemmt auch die Regeneration","**Zurück zum Sport**, wenn der Muskel so weit dehnbar ist wie auf der gesunden Seite und einfache Bewegungen nicht mehr wehtun – in den ersten Wochen ist die Gefahr eines erneuten Risses deutlich erhöht"],"q":[["MTG","26–27"]]}]},{"id":"lunge","titel":"Lungenphysiologie","bereich":"Atmung","razzia":2,"kurz":"Atemwege, Abwehr, Atempumpe, Compliance, Lungenvolumina, V/Q-Quotient, Luft-Blut-Schranke, V'O₂max","lern":[{"h":"Überblick","tb":[["Abschnitt","Teile","Aufgabe"],["Obere Atemwege","Mund, Nase, Nasen-Rachen-Raum","**Konduktion:** Luft leiten, reinigen, befeuchten (mukoziliäre Clearance)"],["Untere Atemwege","Kehlkopf, Luftröhre, Bronchien und Bronchiolen (bis 22 Teilungen), Alveolen (ab der 17. Teilung)","**Gasaustausch:** O₂ in den Körper, CO₂ aus dem Energiestoffwechsel hinaus"]],"fl":{"s":[["1. Ventilation","Belüftung der Alveolen; Atemzentrum in der Medulla oblongata, Chemorezeptoren; Zwerchfell (80 %) + Atemhilfsmuskeln"],["2. Perfusion","Durchblutung der Lunge (Herzzeitvolumen, Shunt)"],["3. Alveoläre Diffusion","„äußere Atmung“: O₂-Aufnahme, CO₂-Abgabe, verstärkt durch den Haldane-Effekt"],["4. Konvektion","Transport von O₂ und CO₂ im Blut"],["5. Kapilläre Diffusion","„innere Atmung“: O₂ ins Gewebe (verstärkt durch den Bohr-Effekt), CO₂ aus dem Gewebe"]],"c":"Diese 5 Prozesse müssen aufeinander abgestimmt sein"},"q":[["LP","1–2"]]},{"h":"Wie O₂ und CO₂ im Blut reisen","tc":[["Gas","Form","Anteil"],["O₂","an Hämoglobin gebunden (Oxyhämoglobin)","98 %"],["O₂","physikalisch gelöst","2 %"],["CO₂","als Bicarbonat (HCO₃⁻)","70 %"],["CO₂","an Hämoglobin (Carbaminohämoglobin)","30 % (Lehrbücher: ~20 %)"],["CO₂","physikalisch gelöst","10 %"]],"li":["Die CO₂-Werte im Skript ergeben zusammen mehr als 100 %; Lehrbücher nennen etwa 70 / 20 / 10 %","Der Begriff „innere Atmung“ wird zweifach benutzt: Gasabgabe ans Gewebe (S. 2) und die ATP-Bildung in der Atmungskette (S. 11)"],"q":[["LP",2],["LP",11]]},{"h":"Aufbau der Atemwege","li":["**Tunica mucosa** (Schleimhaut): respiratorisches Flimmerepithel + Lamina propria","**Tunica fibromusculocartilaginea**: Bindegewebe, vegetativ innervierte glatte Muskulatur, Knorpel – Knorpel und Stützgewebe halten Trachea und Bronchien auch bei Unterdruck offen","**Tunica adventitia**: äußere Bindegewebsschicht","Von der Trachea bis zu den Alveolen wird das Epithel immer niedriger; in den Alveolen ist es nur noch **einschichtig** (Luft-Blut-Schranke)"],"q":[["LP","3–4"]]},{"h":"Abwehr im Atmungssystem","li":["Nasenhaare und Nasenschleimhaut filtern grobe Partikel; im Nasen-Rachen-Raum wird die Luft langsamer und körperwarm","Der Bronchialschleim bindet Partikel von **5–20 µm**, das Flimmerepithel transportiert sie Richtung Rachen (ca. **1 cm/min**)"],"tb":[["Zellen bzw. Struktur","Abwehr"],["Flimmerzellen, Becherzellen, Drüsen (Glandulae tracheales)","mukoziliärer Transport"],["Plasmazellen (Lamina propria, BALT)","IgA"],["Drüsen, Keulenzellen (Club-Zellen, früher Clara-Zellen)","antimikrobielle Proteine, z. B. Lysozym"],["Keulenzellen","Opsonisierung (CCSP-A, CCSP-D)"],["Alveolarmakrophagen","Phagozytose, Entzündung"],["Basalzellen","Regeneration der Schleimhaut"]],"m":["Mukoziliäre Clearance gestört durch: Kälte, trockene Luft, Allergien, **Rauchen**; angeboren beim **Kartagener-Syndrom** (Zilien-Defekt) und bei **Mukoviszidose** (defekter Chloridkanal → zu wenig Wasser im Schleim → zäh)","Neuroendokrine Zellen (**PNEC**) an den Bronchialteilungen messen Atemgase, sind mit Hirnstamm und Parasympathikus verbunden (Serotonin) → wohl verantwortlich für **Niesen und Husten**"],"q":[["LP","3–5"]]},{"h":"Glatte Muskulatur, Asthma und COPD","li":["Die glatte Muskulatur regelt die Weite der Atemwege und damit den Totraum: **Parasympathikus** verengt in Ruhe, **Sympathikus** erweitert bei forcierter Atmung","Bei Allergie setzen Mastzellen **Histamin** frei → Bronchospasmus; Bronchospasmen auch bei Infekten und obstruktiven Erkrankungen"],"tb":[["","COPD","Asthma bronchiale"],["Auslöser","Rauchen, Industriegase, offenes Feuer → Makrophagen aktiviert","Allergene → dendritische Zellen starten eine Entzündungsreaktion"],["Schleimhaut","weniger Flimmer- und Keulenzellen, mehr Becher- und Basalzellen; Flimmerepithel baut sich ab","mehr Becherzellen (zäher Schleim), Ödem, Bronchokonstriktion"],["Verlauf","Lungenfunktion wird **immer schlechter**","zwischen den Anfällen **normal**"]],"q":[["LP","5–6"]]},{"h":"Die Atempumpe","tb":[["","Inspiration","Exspiration"],["In Ruhe","Zwerchfell kontrahiert, Kuppel senkt sich; Mm. intercostales externi heben die schräg stehenden Rippen → Thorax weitet sich → Sog im Pleuraspalt → Lunge dehnt sich, Luft strömt ein","**passiv:** elastische Rückstellkräfte der Lunge, Druck aus dem Bauchraum, Haftung der Pleurablätter"],["Forciert","zusätzlich Atemhilfsmuskeln","Mm. intercostales interni senken den Thorax, Bauchmuskeln drücken"]],"li":["Das **Zwerchfell** leistet etwa **80 %** der Ruheatmung","**Inspiratorische Hilfsmuskeln:** M. sternocleidomastoideus, Mm. scaleni, M. serratus posterior superior, M. serratus anterior, Mm. pectorales minor und major","**Exspiratorische Hilfsmuskeln:** Mm. intercostales interni, gerade, quere und schräge Bauchmuskeln, M. latissimus dorsi","Hilfsmuskeln werden nötig bei Sport, bei Lähmungen, Muskelerkrankungen und wenn sich eine Lungenerkrankung verschlechtert"],"q":[["LP","6–7"]]},{"h":"Compliance, Surfactant und Pleura","li":["**Compliance** = Dehnbarkeit der Lunge = ΔV ÷ Δp, normal **0,13 l/cmH₂O** (pro 1 cmH₂O Druckanstieg 130 ml mehr Volumen)","In Ruhe herrscht Gleichgewicht zwischen Lunge und Brustwand. Rückstellkraft der Lunge: ca. **30 %** elastische und kollagene Fasern, **70 %** Oberflächenspannung in den Alveolen","**Surfactant** (aus **Typ-II-Pneumozyten**, phospholipidhaltig) senkt die Oberflächenspannung – trotzdem macht sie noch 70 % der Rückstellkraft aus","Im Pleuraspalt herrscht in Ruhe **Unterdruck** (Sog). Wird die Brustwand samt Pleura verletzt, strömt Luft ein → die Lunge kollabiert (**Pneumothorax**)"],"tc":[["Compliance","Ursachen"],["erniedrigt (Lunge „steifer“)","Thoraxdeformität, schwere Kyphoskoliose, Rippenserienfraktur, Lungenfibrose, kollabierte Lunge"],["erhöht","COPD mit Emphysem (weniger Alveolen und elastische Fasern)"]],"q":[["LP","7–8"]]},{"h":"Lungenvolumina","tb":[["Abkürzung","Bedeutung"],["AV (Atemzugvolumen, Tidalvolumen)","pro Atemzug in Ruhe: **400–600 ml** (ca. 6 ml/kg, ~10 % der TK)"],["IRV","zusätzlich zur Ruheatmung einatembar"],["ERV","zusätzlich zur Ruheatmung ausatembar"],["VK (Vitalkapazität)","größtmögliche bewegbare Luftmenge = IRV + AV + ERV"],["RV (Residualvolumen)","bleibt immer in der Lunge"],["FRK (funktionelle Residualkapazität)","nach normaler Ausatmung in der Lunge = ERV + RV; hält die Alveolen offen"],["TK (Totalkapazität)","VK + RV"],["Totraum","Luft in den Atemwegen ohne Gasaustausch (Nasopharynx, Trachea, Bronchien, nicht durchblutete Alveolen)"]],"li":["**Atemminutenvolumen** = Atemfrequenz × Atemzugvolumen · inspiratorische Kapazität = IRV + AV","Ventilation = alveoläre Ventilation + Totraumventilation. **Je tiefer die Atmung, desto größer der alveoläre Anteil**","**Spirometrie:** Fluss-Volumen-Kurve; höchster Fluss zu Beginn der Ausatmung (PEF = Weite von Trachea und Bronchien), FEV25 = mittlere, FEV50–75 = kleine Atemwege","**FEV1** = in 1 s maximal ausgeatmetes Volumen","**Bodyplethysmographie** misst auch RV und Atemwegswiderstand bei normaler Atmung (Kammer, Gesetz von Boyle-Mariotte)","Gasaustausch pro Tag: O₂ 400–600 l, CO₂ 350–700 l"],"q":[["LP","9–10"]]},{"h":"Restriktiv oder obstruktiv?","tb":[["","Restriktive Störung","Obstruktive Störung"],["Was ist los?","Lunge kann sich nicht ausdehnen","Atemwegswiderstand erhöht"],["Messwerte","VK, FRK, RV vermindert; FEV1 kann relativ sogar erhöht sein","FEV1 vermindert, Tiffeneau-Index (FEV1 ÷ FVK) vermindert"],["Ursachen","Rippenserienfraktur, Skoliose, Pneumonie, Pleuraverwachsungen, neuromuskuläre Erkrankungen (Myasthenia gravis, MS, ALS)","Bronchospasmus (Asthma, COPD), zäher Schleim (Asthma, Mukoviszidose)"]],"q":[["LP",11]]},{"h":"Ventilations-Perfusions-Verhältnis (V/Q)","li":["V/Q = alveoläre Ventilation ÷ Durchblutung: 4 l/min ÷ 5 l/min = **0,8**","Im Stehen nimmt die **Durchblutung nach unten stark zu** (Schwerkraft: oben 0,07 l/min, basal 1,3 l/min), die Belüftung weniger stark"],"br":{"s":[["Lungenspitze",3.3,"V/Q 3,3"],["gesamt",0.84,"0,84"],["Lungenbasis",0.6,"0,6"]],"c":"V/Q-Quotient im Stehen"},"tc":[["Extremfall","Beispiel","V/Q","Folge"],["keine Belüftung","verlegter Atemweg","→ 0","Rechts-links-**Shunt**"],["keine Durchblutung","Lungenembolie","→ ∞","mehr **Totraum**"]],"m":"**Euler-Liljestrand-Mechanismus:** schlecht belüftete Alveolen (Hypoxie) verengen ihre Gefäße → das Blut fließt dorthin, wo Luft ist.","q":[["LP","12–13"]]},{"h":"Die Luft-Blut-Schranke","li":["Alveolen v. a. aus **Typ-I-Pneumozyten**, umsponnen von einem dichten Kapillarnetz","Etwa **300 Millionen Alveolen**, Austauschfläche **70–100 m²** – etwa 50-mal die Hautoberfläche (ca. 2 m²)","Trennwand zwischen Luft und Blut nur **0,2 µm** dick","Kontaktzeit ca. **0,75 s**; schon nach **0,25 s** sind die Partialdrücke von O₂ und CO₂ ausgeglichen → Reserve für Belastung"],"ly":{"s":[["Alveolarluft"],["Flüssigkeitsfilm mit Surfactant"],["Typ-I-Pneumozyt"],["gemeinsame Basalmembran"],["Kapillarendothel"],["Blut"]]},"q":[["LP","11–13"]]},{"h":"V'O₂max und Spiroergometrie","li":["In Ruhe verbrauchen wir etwa **300 ml O₂ pro Minute** (je nach Muskelmasse)","**V'O₂max** = maximale Sauerstoffaufnahme (eingeatmetes minus ausgeatmetes O₂ pro Minute), seit 1968 Goldstandard der WHO für „Ausdauer“; meist auf das Körpergewicht bezogen (ml/min/kg)","Gemessen per **Spiroergometrie** (Ergometer + Spirometrie); korreliert mit der Laktatschwelle","Bei Gesunden begrenzt **nicht die Lunge** (sie arbeitet selbst bei Ausbelastung nicht am Limit), sondern Transport und Muskelstoffwechsel; beim Trainierten vor allem das Herzminutenvolumen"],"tb":[["Ebene","Einflussfaktoren"],["Lunge","Atemminutenvolumen, Diffusionskapazität, V/Q"],["Transport","Hämoglobin, Herzzeitvolumen"],["Muskel","mehr Typ-I-Fasern, Kapillarisierung, Myoglobin, Mitochondrien, Enzyme, Substrate, Pufferkapazität"]],"br":{"s":[["Untrainiert",40,"30–50 ml/min/kg"],["Spitzensport",90,"bis 90 ml/min/kg"]],"c":"Typische V'O₂max"},"m":["Moderates Ausdauertraining steigert die V'O₂max bei Einsteigern im Mittel um **16 %**.","Am besten wirkt **Intervalltraining**: 10 × 2 min bei 105 % der V'O₂max, 3 Tage pro Woche über 8 Wochen."],"q":[["LP","13–15"],["MT1",3]]}]},{"id":"muskeltypen","titel":"Skelett-, Herz- und glatte Muskulatur","bereich":"Muskel","kurz":"Unterschiede im Aufbau, in der Erregung und beim Calcium; Calcium-Antagonisten","lern":[{"h":"Die drei Muskeltypen im Vergleich","tb":[["","Skelettmuskulatur","Herzmuskulatur","Glatte Muskulatur"],["Zellen","„Muskelfasern“","„Kardiomyozyten“","„glatte Muskelzellen“"],["Querstreifung","ja, streng geordnete Sarkomere (A-, I-, Z-Streifen)","ja, Zellen über **Glanzstreifen** mit Gap Junctions verbunden","nein, Sarkomere unregelmäßig angeordnet"],["Vorkommen","willkürliche Muskulatur des Bewegungsapparats","Herz","Hohlorgane (Speiseröhre, Magen, Darm, Harnwege, Gebärmutter), Gefäße, Bronchien"],["Kerne","bis zu 500","1 in der Zellmitte","1 in der Zellmitte"],["Länge","20–30 cm","50–120 µm","ca. 200 µm"],["Calcium","T- und L-System des sarkoplasmatischen Retikulums","nur T-System; Ca²⁺ von innen und außen, auch über Gap Junctions","nur T-System; Ca²⁺ v. a. über Membrankanäle von außen"],["Ansteuerung","willkürlich, motorische Endplatte (ACh), motorische Einheit","unwillkürlich: Erregungsleitungssystem, Schrittmacherzellen („funny current“), Alles-oder-nichts","unwillkürlich: **Single Unit** (Darm, Gebärmutter; Erregung über Gap Junctions) oder **Multi Unit** (Gefäße, Bronchien; einzeln innerviert)"]],"q":[["HK",4]]},{"h":"Calcium in der glatten Muskulatur","li":["Skelettmuskel: Ca²⁺ aus dem sarkoplasmatischen Retikulum, freigesetzt durch ein fortgeleitetes Aktionspotenzial, bindet an **Troponin**","Glatter Muskel: Ca²⁺ strömt v. a. über **L-Typ-Calciumkanäle** in die Zelle und bindet an **Calmodulin**","Die Kanäle öffnen sich durch vegetatives Nervensystem, Darmnervensystem, Hormone (z. B. Oxytocin an Gebärmutter und Brustdrüse), lokale Stoffe (z. B. Histamin an Gefäßen und Bronchien) oder Dehnung","Glatte Muskulatur hat keine feste Zugrichtung – sie „fällt in sich zusammen“","ATP braucht der Muskel für den **Querbrückenzyklus** und für die Calciumpumpe (**SERCA**)"],"m":"**Calcium-Antagonisten** („-dipin“, z. B. Nifedipin, Amlodipin) blockieren die L-Typ-Kanäle der Gefäßmuskeln → weniger Kontraktion → der Blutdruck sinkt.","q":[["HK","4–5"]]},{"h":"Warum der Sympathikus Gefäße eng stellt","fl":{"s":[["Noradrenalin bindet an α₁-Rezeptoren"],["L-Typ-Ca²⁺-Kanal wird aktiviert","durch Anhängen eines energiereichen Phosphats"],["Ca²⁺ strömt ein, bindet Calmodulin"],["Myosin-Leichtketten werden aktiviert"],["Kontraktion → Vasokonstriktion"]]},"q":[["HK",5],["HK",29]]}]},{"id":"atemgase","titel":"Transport der Atemgase","bereich":"Atmung","kurz":"Gasgleichung, Partialdrücke, Totraum, CO₂-Transport, Kohlenmonoxid, Sauerstoffbindungskurve, Bohr- und Haldane-Effekt","lern":[{"h":"Physikalische Grundlagen","m":"**Allgemeine Gasgleichung: p · V ÷ T = konstant**","li":["Gase nehmen 1000–2000-mal mehr Raum ein als dieselbe Masse als Flüssigkeit","Erhitzen bei gleichem Druck → Volumen steigt; im geschlossenen Behälter steigt der Druck; Zusammendrücken bei gleicher Temperatur → Druck steigt","Luftdruck auf Meereshöhe ≈ **1013 hPa ≈ 1 bar ≈ 760 mmHg**; mit der Höhe wird die Luft „dünner“","mmHg = Torr (Torricelli); 1 mmHg ≈ 133 Pa"],"q":[["AG","2, 4"]]},{"h":"Partialdrücke berechnen","li":["Jedes Gas trägt entsprechend seinem Anteil zum Gesamtdruck bei (**Partialdruck**). Vorher den Wasserdampfdruck abziehen"],"tc":[["Gas","Anteil","Partialdruck (760 − 18 = 742 mmHg)"],["Stickstoff","78 %","579 mmHg"],["**Sauerstoff**","21 %","**156 mmHg**"],["Kohlendioxid","0,04 %","0,3 mmHg"],["Edelgase","1 %","7 mmHg"]],"q":[["AG",4]]},{"h":"Ein-, Aus- und Alveolarluft","tc":[["mmHg","Einatemluft","Ausatemluft","Alveolarluft"],["pO₂","156","115","100"],["pCO₂","0,3","33","40"],["pH₂O","18 (20 °C)","47 (37 °C)","47"]],"li":["In der **Alveole** ist pO₂ noch niedriger und pCO₂ höher als in der Ausatemluft","Grund ist der **Totraum**: von 500 ml Atemzug erreichen nur 350 ml die Alveolen; 150 ml in Nase, Rachen, Luftröhre und Bronchien nehmen nicht am Gasaustausch teil"],"q":[["AG",3]]},{"h":"Wie die Gase im Blut reisen","tb":[["","Sauerstoff","Kohlendioxid"],["an Hämoglobin","**98 %** (Oxyhämoglobin)","ca. **20 %** (Carbaminohämoglobin)"],["physikalisch gelöst","2 % (ca. 3 ml/dl)","ca. **10 %**"],["als Bicarbonat","–","ca. **70 %**"]],"fl":{"s":[["CO₂ diffundiert aus dem Gewebe in den Erythrozyten"],["Carboanhydrase","CO₂ + H₂O → H₂CO₃ (sehr schnell)"],["H₂CO₃ → HCO₃⁻ + H⁺","H⁺ bindet am Hb (senkt die O₂-Affinität, Bohr-Effekt)"],["HCO₃⁻ ins Plasma","im Austausch gegen Cl⁻"],["In der Lunge alles rückwärts","CO₂ wird abgeatmet"]]},"li":["Im Plasma läuft die Umwandlung ohne Enzym nur langsam","O₂ und 20 % des CO₂ binden am **zweiwertigen Eisen (Fe²⁺)** der Hämgruppe"],"q":[["AG","3, 5, 7–8"]]},{"h":"Kohlenmonoxid-Vergiftung","li":["CO entsteht bei Verbrennung mit wenig O₂ und bindet an dasselbe Fe²⁺ – mit **300-mal höherer Affinität** als O₂","Schon **0,1 % CO** in der Atemluft besetzt etwa die Hälfte des Hämoglobins"],"tc":[["CO-Hb-Anteil","Bedeutung"],["0,4–1,6 %","normal"],["3–10 %","bei Rauchern noch normal"],["ab ca. 15 %","Atemnot bei Anstrengung"],["höher","Schwindel, Kopfschmerz, Verwirrtheit, Krampfanfälle, Bewusstlosigkeit"],["über 50 %","akute Lebensgefahr"]],"m":"Niemals einen Kohlegrill in geschlossenen Räumen betreiben – CO riecht man nicht. Bei Hausbränden sterben die meisten an CO, nicht an der Hitze.","q":[["AG","5–6"]]},{"h":"Die Sauerstoffbindungskurve","li":["**Sauerstoffsättigung (SpO₂)** = Anteil der Hb-Moleküle (in %), die O₂ tragen","Trägt man SpO₂ gegen pO₂ auf, entsteht eine **S-förmige (sigmoidale)** Kurve","**Positive Kooperativität:** jedes gebundene O₂ verändert die Form des Hb und erleichtert die Bindung des nächsten","Steiler Anstieg zwischen etwa 20 und 60 % Sättigung, **Plateau ab ca. 90 %** (bei etwa 60 mmHg) – weitere O₂-Gabe bringt dort kaum noch etwas"],"tc":[["pO₂ (mmHg)","Sättigung normal (ca.)"],["27","50 %"],["40","75 %"],["60","90 %"],["100","97 %"]],"q":[["AG","8–9, 12"]]},{"h":"Bohr-Effekt und Haldane-Effekt","tb":[["","Bohr-Effekt","Haldane-Effekt"],["Was","**CO₂ und H⁺** (und 2,3-DPG) senken die **O₂-Affinität** des Hb","**O₂** senkt die **CO₂-Affinität** des Hb"],["Wo","im **Gewebe** (z. B. arbeitender Oberschenkel)","in der **Lunge**"],["Folge","O₂ wird leichter abgegeben → mehr O₂ für den Muskel; Kurve nach **rechts**","CO₂ wird leichter abgegeben → je mehr O₂ aufgenommen wird, desto mehr CO₂ geht raus"]],"li":["Bohr (1904; Vater von Niels Bohr): H⁺/CO₂ an Aminosäuren stabilisieren die **T-Form** des Hb mit geringer Affinität (statt der R-Form)","**2,3-DPG** aus einem Seitenweg der Glykolyse senkt die Affinität im Erythrozyten zusätzlich – gereinigtes Hb bindet O₂ stärker"],"q":[["AG","9–12"]]},{"h":"Rechts- und Linksverschiebung","tb":[["","Linksverschiebung","Rechtsverschiebung"],["Affinität","erhöht – O₂ wird festgehalten","erniedrigt – O₂ wird leichter abgegeben"],["Ursachen","akute Alkalose, niedriger pCO₂, niedrige Temperatur, wenig 2,3-DPG, CO-Hämoglobin, Met-Hämoglobin","akute Azidose, hoher pCO₂, hohe Temperatur, viel 2,3-DPG"]],"m":"Mit aktivem Bohr-Effekt braucht es für 90 % Sättigung etwa **75 mmHg** statt 60 mmHg (aus der Kurve abgelesen).","q":[["AG",12]]}]},{"id":"blutdruck","titel":"Blutdruck und Hämodynamik","bereich":"Herz und Kreislauf","kurz":"Normwerte, Herzzeitvolumen, Widerstand, Hagen-Poiseuille, Vorlast und Nachlast","lern":[{"h":"Was beim Blutdruck gemessen wird","li":["Gemessen wird der **arterielle** Blutdruck. Er pendelt zwischen **Systole** (Kontraktion des Herzens) und **Diastole** (Erschlaffung)","In der Diastole ist der Druck **nicht null** – die elastischen Arterien speichern Druck (**Windkesselfunktion**, elastische Fasern der Tunica media)","**Mittlerer arterieller Druck (MAP):** herzfern MAP = RRdia + ⅓ (RRsys − RRdia), herznah MAP = RRdia + ½ (RRsys − RRdia)"],"tc":[["Blutdruck (mmHg)","Einordnung (ESC-Leitlinie 2024)"],["unter 120/70","normal"],["120–139 / 70–89","erhöhter Blutdruck"],["ab 140 und/oder ab 90","arterielle Hypertonie"]],"q":[["HK",1],["HK",34],["HKG",3]]},{"h":"Normwerte der Herzfrequenz","tc":[["Alter","Schläge pro Minute"],["Neugeborenes","140"],["Kleinkind","120"],["Erwachsene","60–80"],["Senioren","70–90"]],"li":["Zu schnell = **Tachykardie**, zu langsam = **Bradykardie**"],"q":[["HK",1]]},{"h":"Die Grundformel: Ohmsches Gesetz des Kreislaufs","m":["**RR = TPR × HZV** bzw. **TPR = RR ÷ HZV**","**HZV = HF × SV**"],"li":["Physik: R = U ÷ I (Widerstand = Spannung ÷ Stromstärke). Im Kreislauf: totaler peripherer Widerstand (TPR) = Blutdruck ÷ Herzzeitvolumen","Beispiel: HF 60/min × SV 70 ml = **4,2 l/min**","Bezogen auf die Körperoberfläche (Herzindex): normal ca. **3 l/min/m²**"],"q":[["HK",1],["IMG",1]]},{"h":"Wovon der Blutdruck abhängt","tb":[["Größe","Beeinflusst durch"],["**Herzfrequenz**","Parasympathikus (ACh) senkt, Sympathikus (Noradrenalin, Adrenalin) steigert · Hormone: Adrenalin, Schilddrüsenhormone (T3, T4) steigern · Ionen (Ca²⁺, K⁺, Na⁺); sehr hohes Kalium stellt das Herz still (Kardioplegie)"],["**Schlagvolumen**","**Vorlast** (Preload = enddiastolisches Volumen, hängt vom Blutvolumen ab) · **Kontraktilität** (Inotropie: Sympathikus, Glukagon, T3/T4, Calcium; Frank-Starling: mehr Vorlast → mehr SV) · **Nachlast** (Afterload: erhöht bei Hypertonie, Arteriosklerose, Aortenklappenstenose)"],["**Totaler peripherer Widerstand**","Hämatokrit (Viskosität: hoch bei Polyglobulie und Dehydration, niedrig bei Anämie, z. B. Hb unter 8 g/dl) · Gefäßlänge (Körpergröße, Körpergewicht) · **Gefäßradius** (Vasokonstriktion/-dilatation)"]],"q":[["HK",2],["HKP",2]]},{"h":"Hagen-Poiseuille: warum der Radius alles entscheidet","m":"**R = 8 · η · l ÷ (π · r⁴)**","tb":[["Zeichen","Bedeutung","Was ihn ändert"],["η (Eta)","Viskosität","v. a. der Hämatokrit: Hk ↓ → Widerstand ↓"],["l","Gefäßlänge","je schwerer der Mensch, desto länger die Gefäße"],["r","Radius","glatte Muskulatur der Tunica media"]],"li":["Der Radius geht mit der **4. Potenz** ein: **verdoppelt sich der Radius, sinkt der Widerstand auf 1/16**","Deshalb ist die glatte Gefäßmuskulatur der Hauptregler des TPR – und der wichtigste Faktor beim Bluthochdruck","Achtung: Im Skript (S. 2) steht, der Widerstand „steigt um das 16-Fache“ – richtig ist, er **sinkt** auf 1/16 (so auch in deinen Notizen)","**Flussgeschwindigkeit v = Fluss ÷ Querschnitt:** je größer der Gesamtquerschnitt, desto langsamer fließt das Blut","Laminare Strömung = geordnet in Schichten; Wirbel (turbulente Strömung) begünstigen Thromben"],"q":[["HK","2–3"],["HKP",2]]},{"h":"Blutvolumen und Blutdruck","fl":{"s":[["Blutvolumen sinkt","z. B. Blutverlust, Flüssigkeitsmangel"],["Vorlast sinkt"],["Schlagvolumen sinkt"],["HZV und Blutdruck sinken"]]},"li":["Hämatokrit ↓ → Viskosität ↓ → Strömungswiderstand und TPR ↓ → Blutdruck ↓","Laut Unterricht hilft  Leber (Nährstoffe aufnehmen, Giftstoffe entfernen)","**Überhitzung:** mehr Hautdurchblutung zur Kühlung","**Schock:** lebenswichtige Organe mit geringer Ischämietoleranz haben Vorrang"]],"q":[["HK",6]]},{"h":"Ischämietoleranz","tb":[["Organ","Dauer ohne Blut","Folge"],["Gehirn","2–3 s","Ohnmacht"],["Gehirn","2–3 min","irreversible Schäden der Hirnrinde"],["Gehirn","8 min","irreversibler Hirntod"],["Herz","15–30 min","Herzinfarkt"],["Niere, Leber","2–3 h","Nieren- bzw. Leberversagen"],["Darm","6 h","Darminfarkt, Sepsis"],["Extremitäten","2–4 h / 6–8 h / 8–12 h","Nervenschäden / Muskelnekrosen / Hautnekrosen"]],"li":["**Kälte verlängert die Ischämietoleranz**, weil der Stoffwechsel langsamer läuft","Gehirn: sehr anspruchsvoll · Muskel: mittendrin · Herz: „Allesfresser“ (nutzt sogar Laktat). Mehr Kapillaren = mehr Spielraum"],"q":[["HK",6],["HK",5],["HKP",3]]},{"h":"Durchblutung in Ruhe und maximal","tb":[["Organ","Ruhe (l/min)","Maximum (l/min)","Steigerung"],["Skelettmuskel","0,75","18","24-fach"],["Haut","0,2","3,8","19-fach"],["Speicheldrüsen","0,02","0,25","12-fach"],["Verdauungssystem","0,7","5,5","8-fach"],["Leber","0,5","3,0","6-fach"],["Myokard","0,21","1,2","5-fach"],["Fettgewebe","0,8","3,0","4-fach"],["Gehirn","0,75","2,1","3-fach"],["Nieren","1,2","1,4","1,2-fach"]],"br":{"s":[["Skelettmuskel",24,"24×"],["Haut",19,"19×"],["Speicheldrüsen",12,"12×"],["Verdauung",8,"8×"],["Leber",6,"6×"],["Myokard",5,"5×"],["Fettgewebe",4,"4×"],["Gehirn",3,"3×"],["Nieren",1.2,"1,2×"]],"c":"Maximale Steigerung der Durchblutung"},"q":[["HK",7]]},{"h":"Wer bekommt wie viel vom HZV?","li":["In Ruhe ist der **Darm** mit ca. 30 % der größte „Verbraucher“","**Gehirn** 15 % – gemessen an seiner Größe sehr viel (hohe spezifische Durchblutung)","**Nieren** 20 % – nötig für die Blutwäsche","**Muskulatur** nur 15 % in Ruhe, unter Belastung bis zum **20-Fachen**","**Haut und Fettgewebe** ca. 20 % – lassen sich im Notfall gefahrlos drosseln (Zentralisation)","**Herz** braucht 5 % für sich selbst (Koronardurchblutung)"],"q":[["HK",7]]},{"h":"Spezifische Durchblutung (ml Blut pro Minute pro Gramm)","li":["Am höchsten: **Niere**, dann **Gehirn** und **Myokard**","Die Niere kann ihre ohnehin hohe Durchblutung kaum steigern","Stark steigern können: Speicheldrüsen, Myokard (Sport, Stress), Gehirn (Prüfung), Skelettmuskel (Training), Verdauung (Essen), Haut (Hitze)","Alle Maxima zusammen ergäben ein theoretisches HZV von 38 l/min – das geht nicht gleichzeitig. Wer hart trainiert, sollte nicht gerade essen oder überhitzen","Das Sportlerherz kann das HZV etwa **vervierfachen** – nur so ist die 20-fache Muskeldurchblutung möglich"],"m":"**Schock:** Der Sympathikus drosselt Haut, Fett und Verdauung zugunsten von Gehirn und Herz (**Zentralisation**) → Blässe, weniger Urin.","q":[["HK",8],["HKG",2]]}]},{"id":"mikrozirkulation","titel":"Gefäße, Mikrozirkulation und Ödem","bereich":"Herz und Kreislauf","kurz":"Hoch- und Niederdrucksystem, Gefäßwand, Kapillartypen, Flüssigkeitsräume, Starling, Ödeme","lern":[{"h":"Großer und kleiner Kreislauf","tb":[["","Körperkreislauf (groß)","Lungenkreislauf (klein)"],["Arterien","O₂-reich","O₂-arm"],["Venen","O₂-arm","O₂-reich"]],"li":["Beide zusammen = **Makrozirkulation**; die kleinsten Gefäße = **Mikrozirkulation**"],"q":[["HKG",3]]},{"h":"Hoch- und Niederdrucksystem","tb":[["","Hochdrucksystem („Niagarafälle“)","Niederdrucksystem („Mississippi-Becken“)"],["Gefäße","Aorta, Arterien","Kapillaren, Venen, Hohlvenen, Lunge"],["Druck","hoch, großes Druckgefälle: 120/80 mmHg","niedrig: zentraler Venendruck 3–8 mmHg, linker Vorhof 15–20 mmHg"],["Blutvolumen","**15 %**","**85 %**"]],"li":["Der zentrale Venendruck (ZVD) wird über einen zentralen Venenkatheter gemessen"],"q":[["HK",9],["HKG","3, 9"]]},{"h":"Die Gefäßwand","ly":{"s":[["Adventitia","Bindegewebe, Nerven, Vasa vasorum → Ernährung"],["Media","glatte Muskulatur → Engstellung und Erweiterung"],["Intima","Endothel + subendotheliales Bindegewebe → Durchblutungsregulation, Gerinnung"]],"c":"Von außen nach innen"},"li":["„Am meisten sexy ist die Intima“: das **Endothel** bildet z. B.",["Endothel-Produkte","**NO und Prostazyklin** → hemmen die Thrombozytenaggregation, erweitern Gefäße","**Heparan** und **Thrombomodulin** → hemmen die Gerinnung"]],"q":[["HK",9],["HKG","10–11"]]},{"h":"Die Endstrombahn","fl":{"s":[["Arteriole"],["Metarteriole","Anfangsteil noch mit glatter Muskulatur"],["Präkapillärer Sphinkter","regelt die Durchblutung der Kapillare, drosselt Druck und Geschwindigkeit"],["Kapillare","nur Endothel + durchlässige Basalmembran"],["Postkapilläre Venole","wieder dreischichtig, aber ohne Sphinkter"]]},"li":["Arteriovenöse Anastomosen können die Kapillaren umgehen","Durch die Kapillarwand gehen fettlösliche und kleine wasserlösliche Stoffe (Glukose, Ionen, kleine Proteine), Narkosegase, O₂ und CO₂","**Lymphgefäße** (nur Endothelschicht) leiten die filtrierte Flüssigkeit ab; sie sind meist kollabiert und öffnen sich, wenn der Gewebedruck steigt"],"q":[["HK","9, 11"],["HKG",12]]},{"h":"Kapillartypen","tb":[["Typ","Wo","Durchlässigkeit für wasserlösliche Stoffe"],["kontinuierlich, mit Tight Junctions","Gehirn, Rückenmark (Blut-Hirn-Schranke)","fast undurchlässig"],["kontinuierlich","Herz, Skelettmuskel, glatte Muskulatur","wenig durchlässig"],["gefenstert (fenestriert)","Magen-Darm, Nieren, Drüsen, Adergeflecht","gut durchlässig"],["diskontinuierlich (Sinusoide)","Leber, Milz, rotes Knochenmark","sehr gut durchlässig"]],"q":[["HKG",14]]},{"h":"Die Flüssigkeitsräume","li":["**60 %** des Körpergewichts sind Wasser: ⅔ **intrazellulär** (40 %), ⅓ **extrazellulär** (20 %)","**Extrazellulärraum** = Interstitium (zwischen den Zellen) + Plasma (+ Lymphe)","**Blutvolumen** ≈ **8 %** des Körpergewichts: 3 % Blutzellen (zählen zum Intrazellulärraum) + 5 % Plasma (Extrazellulärraum)","**3. Raum (third space):** Ergüsse in Gelenk („tanzende Patella“), Pleura, Herzbeutel, Bauch (Aszites). Er gehört zum Extrazellulärraum: nimmt er zu, nimmt der EZR zu – der IZR bleibt gleich"],"ly":{"s":[["Intrazellulärraum","40 % des Körpergewichts"],["Interstitium","15 %"],["Plasma","5 %"]],"c":"Verteilung des Körperwassers (gesamt 60 %)"},"q":[["HK",10],["HKG","14–15"]]},{"h":"Flüssigkeitsaustausch (Starling)","li":["Am Anfang der Kapillare drückt der Blutdruck (ca. **30 mmHg** gegen 5 mmHg im Gewebe) Flüssigkeit hinaus: ca. **20 l pro Tag**","Der Filtrationsdruck sinkt entlang der Kapillare","Plasmaeiweiße – v. a. **Albumin** aus der Leber – bleiben im Gefäß und erzeugen den **kolloidosmotischen (onkotischen) Druck** → er zieht Wasser zurück","Es wird immer etwas mehr filtriert als zurückgeholt; den Rest bringt die **Lymphe** zurück ins Venensystem"],"m":["**Netto-Filtrationsdruck = Filtrationsdruck − kolloidosmotischer Druck**","Nicht verwechseln: der **osmotische** Druck kommt von den kleinen gelösten Teilchen, v. a. **Na⁺** (140 mmol/l). Na⁺ geht durch das Endothel, deshalb ist der osmotische Druck in Plasma und Interstitium gleich. Albumin kann nicht durch – deshalb ist der kolloidosmotische Druck im Plasma höher."],"tc":[["Zeichen in der Starling-Gleichung","Bedeutung"],["Kf","Filtrationskoeffizient (Durchlässigkeit)"],["Pc − Pi","Druck in der Kapillare minus Gewebedruck"],["σ","Reflexionskoeffizient"],["πc − πi","onkotischer Druck im Plasma minus im Gewebe"]],"q":[["HK",11],["HKG",13]]},{"h":"Ödeme","li":["**Ödem** = Flüssigkeitszunahme im Interstitium"],"tb":[["Ursache","Beispiele"],["Kolloidosmotischer Druck ↓ (zu wenig Albumin)","Leberinsuffizienz, Mangelernährung (Eiweiß), Verbrennungen, Eiweißverlust über die Niere (nephrotisches Syndrom)"],["Filtrationsdruck ↑","Thrombose, venöse Stauung, Herzinsuffizienz – **nicht** bei arterieller Hypertonie (der Bayliss-Effekt schützt die Kapillaren)"],["Gefäße durchlässiger","z. B. Histamin (Allergie, Entzündung)"],["Lymphabfluss gestört","meist nach Operationen → Lymphdrainage durch Physios"]],"q":[["HK","11–12"],["HKG",13]]}]},{"id":"gefaessregulation","titel":"Regulation der Gefäßweite","bereich":"Herz und Kreislauf","kurz":"Vasomotorik, Bayliss-Effekt, NO, Nitroglycerin, Endothelin, Hypoxie, Euler-Liljestrand","lern":[{"h":"Vasomotorik","li":["**Vasokonstriktion** = aktive Kontraktion der glatten Gefäßmuskelzellen → Durchmesser kleiner","**Vasodilatation** = Erschlaffung → Durchmesser passiv größer","Am Ende läuft alles über **Ca²⁺** in der Muskelzelle: über Gap Junctions aus Nachbarzellen und/oder über Calciumkanäle von außen","Der Calciumkanal hat 5 Untereinheiten; bei einem Membranpotenzial von −40 bis −50 mV lässt er 10 Mio. Ca²⁺-Ionen pro Sekunde ein. Der L-Typ-Kanal der Gefäßmuskeln öffnet aber v. a. durch Anhängen eines Phosphats"],"tc":[["Wie der Kanal öffnet","Beispiel"],["ligandengesteuert","Noradrenalin, Hormone"],["spannungsabhängig","Depolarisation"],["mechanisch","Dehnung → Bayliss-Effekt"]],"q":[["HK","12–13"]]},{"h":"Lokal oder überregional, schnell oder langsam","li":["**Lokale** Mechanismen wirken **sofort**, aber nur, solange die Stoffe gebildet werden","Das **vegetative Nervensystem** regelt schnell, je nach Innervation in ganz verschiedenen Organen","**Langfristige**, überregionale Regulation läuft über **Hormone** im Blut – sie wirken überall, wo passende Rezeptoren sitzen"],"q":[["HK","12, 15"]]},{"h":"Bayliss-Effekt (myogene Autoregulation)","li":["Der Blutdruck schwankt ständig. Manche Organe – v. a. die **Niere** – brauchen einen **stabilen Perfusionsdruck** (ca. 50 mmHg)"],"fl":{"s":[["Perfusionsdruck steigt"],["Gefäßwand wird gedehnt"],["Mechanisch gesteuerte Ca²⁺-Kanäle öffnen"],["Zelle wird weniger negativ","viele spannungsabhängige Ca²⁺-Kanäle öffnen"],["Kontraktion → Gefäß wird enger","Durchblutung bleibt gleich"]]},"q":[["HK",15]]},{"h":"NO – das Gas aus dem Endothel","li":["**Furchgott** (Nobelpreis 1998): ACh **erweiterte** Arterienringe – aber nur, solange das Endothel da war. Er postulierte einen „endothelial derived relaxing factor“ (EDRF) – es ist **NO**","Histamin, Serotonin oder Bradykinin binden am Endothel → **eNOS**: Arginin → Citrullin + **NO**","NO diffundiert in die Muskelschicht → **Relaxation** (über cGMP)"],"tc":[["Wirkung von NO",""],["Vasodilatation","Gefäß wird weiter"],["hemmt die Thrombozytenaggregation","weniger Thrombosen"],["hemmt die Vermehrung glatter Muskelzellen","Schutz vor Arteriosklerose"]],"m":"**Nitroglycerin** (Nitrospray bei Angina pectoris) wird über die Mundschleimhaut aufgenommen und setzt in der Muskelzelle schnell NO frei → Vasodilatation. Es entsteht schnell eine **Nitrotoleranz**. Lebensgefährlich nach Viagra (starker Blutdruckabfall)!","q":[["HK","16–17"]]},{"h":"Endothelin-1 – der stärkste Vasokonstriktor","li":["1988 entdeckt; Peptid aus dem Endothel, bindet an **ETA-Rezeptoren** der Muskelzellen → öffnet Ca²⁺-Kanäle → **Vasokonstriktion**","Fördert auch die Zellvermehrung","Gegenregelung: über **ETB-Rezeptoren** am Endothel wird mehr NO frei"],"q":[["HK",17]]},{"h":"Hypoxie: Erweiterung – nur nicht in der Lunge","tb":[["","Gehirn, Herz, Niere","Lunge"],["Bei O₂-Mangel","**Vasodilatation** → mehr Blut, die gelieferte O₂-Menge bleibt erhalten","**Vasokonstriktion** (Euler-Liljestrand, hypoxische pulmonale Vasokonstriktion)"],["Mechanismus","Muskelzellen verlieren K⁺ → Hyperpolarisation → Ca²⁺-Kanäle schließen","schlecht belüftete Alveolen werden weniger durchblutet"],["Sinn","Organe mit geringer Ischämietoleranz schützen","nur belüftete Alveolen durchbluten → weniger **Shunt**"]],"q":[["HK","17–18"]]},{"h":"Kontraktion und Erschlaffung der glatten Muskelzelle","fl":{"s":[["Ca²⁺ steigt","L-Typ-Kanal oder sarkoplasmatisches Retikulum"],["Ca²⁺ bindet **Calmodulin**","statt Troponin"],["Kinase phosphoryliert die Myosin-Leichtketten"],["Kontraktion = Vasokonstriktion"]]},"tc":[["Verengen","Erweitern"],["Noradrenalin (α₁), Angiotensin II, Endothelin","NO, ANP (über cGMP), β₂-Aktivierung, Prostazyklin"]],"li":["Eine Phosphatase inaktiviert die Leichtketten → Relaxation = Vasodilatation"],"q":[["HK",29]]}]},{"id":"kreisla ypothalamus → Hypophysenhinterlappen"],["Chemorezeptoren","Aortenbogen, Karotisgabel (N. vagus)","pO₂, pCO₂, pH","Atem- und Kreislaufzentrum"]],"m":"**Henry-Gauer-Reflex:** schlechte Füllung des rechten Herzens (Volumenmangel) → mehr **ADH** aus der Hypophyse → die Niere spart Wasser.","q":[["EX5",14]]},{"h":"Langfristig: Hormone","tb":[["System","Wirkung","Mehr dazu"],["RAAS","Angiotensin II verengt Gefäße, Aldosteron hält Na⁺ und Wasser zurück → Volumen und Druck steigen","Lernseite „RAAS, ADH und Calciumhaushalt“"],["ADH","Wasserrückresorption im Sammelrohr, Vasokonstriktion","ebenda"],["Adrenalin/Noradrenalin","aus dem Nebennierenmark, wirken wie der Sympathikus","Lernseite „Vegetatives Nervensystem“"]],"q":[["HK",3],["EX5","9–13"]]}]},{"id":"vns","titel":"Vegetatives Nervensystem","bereich":"Vegetatives Nervensystem","kurz":"Sympathikus und Parasympathikus: Herkunft, Aufbau, Transmitter, Rezeptoren, Wirkungen, Auge","lern":[{"h":"Zwei Systeme aus der Evolution","tb":[["","Parasympathikus","Sympathikus"],["Spitzname","„Ruhenerv“, Homöostase","„fight or flight“"],["Alter","älter (ca. 2,5 Mrd. Jahre, „Urwürmer“ mit Fressschlauch)","jünger (ca. 500 Mio. Jahre, Kambrium: Jäger erzeugten Druck zur Flucht)"],["Transmitter","Acetylcholin (ACh)","Noradrenalin (Schweißdrüsen: ACh)"],["Wirkweise","sehr gezielt auf einzelne Organe in Brust, Bauch und Becken","innerviert auch die Extremitäten, aktiviert oft viele Organe gleichzeitig"]],"li":["Andere Namen: **autonomes** Nervensystem (nicht willentlich steuerbar), **viszerales** Nervensystem (glatte Muskulatur der Eingeweide, Gefäße und Drüsen)","Zentren: Hypothalamus, limbisches System, Hirnstamm und Rückenmark"],"q":[["HK","20–22"]]},{"h":"Was der Sympathikus macht","tb":[["Organ","Sympathikus","Parasympathikus"],["Auge","Pupille weit (Mydriasis), Fernakkommodation","Pupille eng (Miosis), Nahakkommodation"],["Mund","trocken","Speichel"],["Haut","Schweiß (über ACh)","–"],["Herz","HF, Kraft und HZV steigen","HF sinkt"],["Kreislauf","Zentralisation (Blut von außen nach innen)","–"],["Lunge","Bronchien weit","Bronchien eng"],["Magen-Darm","Peristaltik sinkt (Atonie)","Peristaltik, Sekretion ↑"],["Harnblase","M. detrusor erschlafft (Harn halten)","M. detrusor kontrahiert (Harn lassen)"],["Stoffwechsel","Glykogenolyse, weniger Insulin, Na⁺/K⁺-ATPase ↑ → Hypokaliämie","Insulinfreisetzung"]],"q":[["HK",21],["HK","32–33"],["HK","36–37"]]},{"h":"Aufbau: zwei Neurone","tb":[["","Sympathikus","Parasympathikus"],["1. Neuron","Seitenhorn des Rückenmarks **Th1–L2**","„drum herum“ (para = daneben): **Hirnstamm** und sakrales Rückenmark **S2–S4**"],["Umschaltung (Ganglion)","nahe am ZNS: **Grenzstrang** (paravertebral) oder vor der Wirbelsäule (prävertebral: Ganglion coeliacum, mesentericum)","nahe am oder **im Erfolgsorgan**"],["Fasern","präganglionär **kurz**, postganglionär **lang**","präganglionär **lang**, postganglionär **kurz**"]],"li":["Willkürmotorik: **eine** Synapse (Motoneuron → Muskel). Vegetativ: **zwei** Synapsen (Ganglion, Erfolgsorgan)","Der **N. vagus** (X) besteht aus Axonen erster parasympathischer Neurone aus dem Hirnstamm, die bis in den Bauchraum ziehen"],"q":[["HK","22, 26"]]},{"h":"Kranialer Parasympathikus","tb":[["Hirnnerv","Ganglion","Wirkung"],["III (oculomotorius)","Ganglion ciliare","Nahakkommodation (M. ciliaris), Miosis (M. sphincter pupillae)"],["VII (facialis)","Ganglion submandibulare, Ganglion pterygopalatinum","Speichel, Tränen"],["IX (glossopharyngeus)","Ganglion oticum","Ohrspeicheldrüse"],["X (vagus)","in den Organen","Herz, Bronchien, Magen-Darm"],["sakral S2–S4","in den Organen","Harnblase, Genitalorgane"]],"q":[["HK",22]]},{"h":"Transmitter","tc":[["","präganglionär","postganglionär"],["Sympathikus","ACh (Nikotinrezeptor)","Noradrenalin (Schweißdrüsen: ACh)"],["Parasympathikus","ACh (Nikotinrezeptor)","ACh (Muskarinrezeptor)"]],"li":["**Nebennierenmark:** wird vom Sympathikus innerviert und gibt **Adrenalin (80 %)** und **Noradrenalin (20 %)** ins Blut","**ACh** = Ester aus Essigsäure und Cholin. Die **Acetylcholinesterase** spaltet es (10.000 Moleküle pro Sekunde – das schnellste bekannte Enzym); Cholin wird wieder aufgenommen und recycelt"],"q":[["HK","26–27"],["HK",37]]},{"h":"Rezeptoren","tb":[["Rezeptor","Wo","Wirkung"],["α₁","glatte Muskulatur der Widerstandsgefäße, Hohlorgane, Schließmuskeln, M. dilatator pupillae","**Kontraktion** (Ca²⁺ ↑ über Calmodulin)"],["α₂","präsynaptisch an sympathischen Nervenenden (Autorezeptor)","hemmt die eigene Noradrenalin-Freisetzung"],["β₁","Herz","Erregungsleitung (dromotrop), Frequenz (chronotrop), Kraft (inotrop) ↑"],["β₂","Bronchien, tiefe Gefäße (Muskel), Darm, Blase u. a.","**Relaxation**"],["M₂ (ACh)","Herz","Gegenspieler von β₁: Frequenz, Leitung, Kraft ↓"],["M₃ (ACh)","glatte Muskulatur, Drüsen","Kontraktion (Signalweg wie α₁), Sekretion"],["Nikotin (ACh)","motorische Endplatte (muskulär), vegetative Ganglien (neuronal)","Na⁺-Kanal öffnet → Aktionspotenzial"]],"m":["**Noradrenalin:** α₁ > β₁ > β₂ – einer der stärksten Vasokonstriktoren (septischer Schock)","**Adrenalin:** β₂ > β₁ > α₁ – niedrig dosiert: diastolischer Druck ↓, Bronchien weit, weniger Histamin aus Mastzellen; hoch dosiert: HF, SV und systolischer Druck ↑"],"li":["α₁-Aktivierung der Widerstandsgefäße erhöht v. a. den **systolischen**, β₂-Erschlaffung der Muskelgefäße senkt den **diastolischen** Druck"],"q":[["HK","27, 31–32, 34, 36"]]},{"h":"Ionen an der Membran","tc":[["Ion","im Plasma"],["Na⁺","140 mmol/l"],["K⁺","4 mmol/l"],["Ca²⁺ (frei)","ca. 1 mmol/l"],["Cl⁻","116 mmol/l (Skript; Lehrbücher meist um 100)"]],"li":["Öffnet ein Kanal, fließen die Ionen ihrem Gradienten nach","**Depolarisation:** Innenseite wird weniger negativ (Einstrom positiver Ionen) · **Hyperpolarisation:** stärker negativ (Ausstrom positiver oder Einstrom negativer Ionen)","Die **Na⁺/K⁺-ATPase** pumpt unter ATP-Verbrauch 3 Na⁺ hinaus und 2 K⁺ hinein → Innenseite negativ (**Ruhemembranpotenzial**)"],"q":[["HK","28–29"]]},{"h":"Das Au
