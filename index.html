ge","tb":[["","Parasympathikus (M₃)","Sympathikus (α₁)"],["Pupille","M. sphincter pupillae (ringförmig) kontrahiert → **Miosis**","M. dilatator pupillae (längs) kontrahiert → **Mydriasis**"],["Linse","M. ciliaris kontrahiert → Zonulafasern locker → Linse rund → **Nahakkommodation**","M. ciliaris erschlafft → Zonulafasern gespannt → Linse flach → **Fernakkommodation**"],["Kammerwasser","fließt **besser** ab (gut beim Glaukom)","fließt schlechter ab"]],"m":"**Glaukom (grüner Star):** gestörter Kammerwasserabfluss erhöht den Augeninnendruck (Ursachen: Medikamente wie pupillenerweiternde Tropfen, Kortison, Anticholinergika, Verletzungen, Tumoren, Fehlbildungen). Erst Kopfschmerzen, rote Augen, Farbringe, später Gesichtsfeldausfälle. Kammerwasser entsteht in der hinteren Augenkammer und fließt über die Pupille zum Schlemm-Kanal ab.","q":[["HK","30, 32, 36"]]}]},{"id":"vns-medikamente","titel":"Medikamente am vegetativen Nervensystem","bereich":"Vegetatives Nervensystem","kurz":"Adrenalin, Betablocker, β₂-Mimetika, Cholinesterasehemmer, Atropin, Kampfstoffe – und Fallbeispiele","lern":[{"h":"Medikamente an den Adrenozeptoren","tb":[["Wirkstoff","Mechanismus","Einsatz"],["Adrenalin","β₂ > β₁ > α₁","Reanimation, anaphylaktischer Schock"],["Noradrenalin","α₁ > β₁ > β₂","septischer Schock"],["Xylometazolin, Oxymetazolin, Naphazolin, Phenylephrin","α-Agonisten: Nasenschleimhaut schwillt ab","Schnupfen, Sinusitis"],["Clonidin, Moxonidin","α₂-Agonisten: Blutdruck ↓, Sedierung","Hypertonie"],["Salbutamol, Fenoterol, Terbutalin (kurz); Formoterol, Salmeterol (12 h); Indacaterol, Vilanterol (24 h)","β₂-Agonisten: Bronchien weit, weniger Histamin","Asthma, COPD"],["Prazosin, Doxazosin","α₁-Blocker: Gefäße weit","M. Raynaud"],["Tamsulosin, Silodosin","α₁A-Blocker: Prostata entspannt","gutartige Prostatavergrößerung"],["Propranolol, Timolol, Carvedilol (unselektiv); Bisoprolol, Metoprolol, Atenolol, Nebivolol (β₁-selektiv)","Betablocker","Hypertonie, KHK, Herzinfarkt, Tachykardie, Herzinsuffizienz, Glaukom, Migräne, Tremor"]],"m":"**Betablocker** („-olol“) senken den Blutdruck nicht über die Gefäße, sondern über ein kleineres **HZV** (β₁), empfindlichere Barorezeptoren und eine Hemmung des RAAS.","q":[["HK","34–35"]]},{"h":"Medikamente an den ACh-Rezeptoren","tb":[["Wirkstoff","Mechanismus","Einsatz"],["Carbachol, Pilocarpin","M₃-Agonisten: Pupille eng, Kammerwasser fließt ab, mehr Speichel","Glaukom, Mundtrockenheit"],["Donepezil, Galantamin, Rivastigmin","Cholinesterasehemmer (ZNS)","Demenz"],["Neostigmin, Pyridostigmin","Cholinesterasehemmer (nicht ZNS-gängig)","Myasthenia gravis, Darmatonie nach OP, Aufheben von Muskelrelaxanzien"],["Physostigmin","Cholinesterasehemmer (ZNS-gängig)","zentrales anticholinerges Syndrom"],["Atropin","M₁–M₅-Antagonist","Bradykardie (2 mg → HF +40), Pupillenerweiterung"],["Ipratropium, Tiotropium (inhalativ)","M₃-Antagonisten in der Lunge","COPD"],["Butylscopolamin","M₃-Antagonist am Darm","Darmkrämpfe, Reizdarm"],["Tolterodin, Solifenacin, Oxybutynin","M₃-Antagonisten an der Blase","Reizblase"],["Biperiden","M₁-Antagonist","Parkinson"]],"q":[["HK","37–38"]]},{"h":"Vergiftungen","tb":[["","Zu viel ACh (Organophosphate: Sarin, Tabun, VX, Nowitschok)","Zu wenig ACh-Wirkung (Atropin)"],["Auge","enge Pupille, Nahakkommodation","weite Pupille, Fernakkommodation"],["Drüsen","Schwitzen, Speichel","trockener Mund, trockene warme Haut"],["Herz","Bradykardie","Tachykardie"],["Lunge","Bronchokonstriktion","Bronchien weit"],["Darm, Blase","Krämpfe, Einstuhlen, Einnässen","Atonie, Harnverhalt"],["Muskeln, ZNS","Krämpfe, Zwerchfelllähmung","erst Erregung, dann Bewusstlosigkeit"]],"li":["Organophosphate hemmen die Cholinesterase **irreversibel** – international geächtete Kampfstoffe"],"q":[["HK","37–38"]]},{"h":"Fallbeispiele: Was würdest du tun?","tb":[["Problem","Sympathikus …","Parasympathikus …"],["Bradykardie","steigern über β₁ (Adrenalin)","senken über M₂ (Atropin)"],["Tachykardie","senken: β₁ blockieren (Betablocker)","steigern über M₂"],["Bronchospasmus","steigern über β₂ (Adrenalin, β₂-Spray)","senken über M₃ (Atropin; als Spray, z. B. Ipratropium, damit es nur lokal wirkt)"],["Glaukom","hemmen (Betablocker-Augentropfen)","steigern (Pilocarpin: enge Pupille, lockere Zonulafasern, besserer Abfluss)"]],"m":"**Anaphylaxie:** Histamin → Bronchospasmus, Blutdruckabfall, Juckreiz, Bauchkrämpfe. Antihistaminika reichen bei schweren Verläufen nicht – dann **Adrenalin**.","q":[["HK","39–40"]]}]},{"id":"niere","titel":"Aufbau und Funktion der Niere","bereich":"Niere und Wasserhaushalt","kurz":"Lage, Aufgaben, Nephron, glomeruläre Filtration, Tubulus, Gegenstromprinzip, Diuretika","lern":[{"h":"Lage und Aufbau","li":["Zwei Nieren, je ca. **12 × 5 × 4 cm**, im **Retroperitoneum** neben der Wirbelsäule (BWK 12), direkt unter dem Zwerchfell","Die rechte Niere liegt etwas tiefer; ihr unterer Pol auf Höhe des Bauchnabels","Auf den oberen Polen sitzen die **Nebennieren** – sie gehören nicht zur Niere und haben eigene Aufgaben","**Rinde:** Glomeruli, proximale und distale Tubuli · **Mark:** Henle-Schleifen und Sammelrohre · dann Nierenkelche und Nierenbecken"],"q":[["EX5",1]]},{"h":"Aufgaben der Niere","tb":[["Aufgabe","Beispiele"],["Harn bilden, entgiften","Medikamente, Umweltgifte, Abfallprodukte: Harnstoff (Eiweiß), Harnsäure (Purine), Kreatinin (Muskel)"],["Regulation","Säure-Basen-Haushalt, Wasser- und Elektrolythaushalt, Blutdruck (langfristig: Blutvolumen, Angiotensin II), Calciumhaushalt, Gluconeogenese"],["Hormone","**Renin** (Blutdruck), **Erythropoietin** (Blutbildung), aktives **Vitamin D₃** (Calcium)"]],"q":[["EX5","1–2"]]},{"h":"Das Nephron","li":["Kleinste Funktionseinheit; ca. **1 Mio. Nephrone** pro Niere – mit 80 Jahren nur noch etwa ⅓. Deshalb sind Ältere anfälliger für Nierenversagen bei Flüssigkeitsmangel, und Medikamente müssen niedriger dosiert werden"],"fl":{"s":[["Glomerulus","Gefäßknäuel in der Bowman-Kapsel: Filtration"],["Proximaler Tubulus","60 % der Rückresorption, Sekretion"],["Henle-Schleife","Gegenstromprinzip"],["Distaler Tubulus","Ca²⁺ (Parathormon), Na⁺ (RAAS)"],["Sammelrohr","Wasser (ADH)"]]},"m":"**Zwei Kapillarsysteme hintereinander:** Die Arteriole bildet erst den Glomerulus und verlässt ihn wieder **als Arteriole** (nur Filtration, kein Stoffaustausch). Erst danach versorgt sie das Kapillarnetz entlang der Tubuli, das Energie für Resorption und Sekretion liefert.","q":[["EX5","2–3"],["EX5",5]]},{"h":"Glomeruläre Filtration","li":["Durch die Nieren fließen ca. **1500 l Blut pro Tag** – etwa 20 % des HZV bzw. das 300-Fache des Blutvolumens (im Skript steht „300-mal das HZV“)","Daraus filtrieren die Glomeruli **180 l Primärharn** pro Tag = **GFR 120 ml/min**","Filtration ist passiv (Druck); Resorption und Sekretion im Tubulus sind **aktiv** und verbrauchen Energie"],"m":"**Netto-Filtrationsdruck = hydrostatischer Druck − (kolloidosmotischer Druck + Gegendruck der Bowman-Kapsel)**","br":{"s":[["hydrostatischer Druck",55,"55 mmHg"],["kolloidosmotischer Druck",27.5,"25–30 mmHg"],["Gegendruck Bowman-Kapsel",15,"15 mmHg"],["effektiv",10,"≈ 10 mmHg"]],"c":"Druckbilanz am Glomerulus"},"q":[["EX5",3]]},{"h":"Was die Filtration beeinflusst","li":["Der hydrostatische Druck hängt vom arteriellen Druck und vom **Bayliss-Effekt** ab","**Weite zuführende** und **enge abführende** Arteriole erhöhen den Druck im Glomerulus","Das Endothel der zuführenden Arteriole bildet **Prostaglandin E₂** und **Prostazyklin** → Vasodilatation. Medikamente, die die Cyclooxygenase hemmen (z. B. Aspirin, NSAR), können die Nierendurchblutung verschlechtern","**Filter:** fenestriertes Endothel + doppelte Basalmembran + Ausläufer der **Podozyten**; nur kleine Teilchen (laut Skript bis 14 kDa, 4–20 nm) passieren; negative Ladung hält Anionen zurück","**Mesangiumzellen:** Stützzellen, bilden PGE₂, können phagozytieren"],"q":[["EX5",4]]},{"h":"Der Tubulus","tb":[["Abschnitt","Was passiert"],["Proximaler Tubulus","Rückresorption von Na⁺, Glukose, Bicarbonat, Aminosäuren …; Sekretion organischer An- und Kationen (Harnsäure, Medikamente, Schadstoffe)"],["Henle-Schleife","Gegenstromprinzip: hohe Osmolarität im Mark (NKCC2)"],["Distaler Tubulus","Ca²⁺-Rückresorption (Nebenschilddrüse); Mess- und Na⁺-Resorptionsort für das RAAS"],["Sammelrohr","Wasserrückresorption unter ADH aus der Neurohypophyse"]],"li":["Die Tubuluszellen haben eine Seite zum Lumen (**apikal**) und eine zum Blut (**basolateral**). Die basolaterale **Na⁺/K⁺-ATPase** treibt die Resorption an","**Na⁺ + Bicarbonat:** Na⁺/H⁺-Austauscher und Carboanhydrase (CO₂ + H₂O ⇌ H₂CO₃)","**SGLT2** holt Glukose mit Na⁺ zurück. **Gliflozine** („-flozin“) blockieren ihn → mehr Zucker im Urin, niedrigerer Blutzucker; auch Standard bei Herzinsuffizienz","**Sekretion:** OAT1 (organische Anionen), OCT2 (organische Kationen) – so werden Medikamente und Schadstoffe ausgeschieden, die den Filter nicht passieren"],"q":[["EX5","5–6"]]},{"h":"Das Gegenstromprinzip","fl":{"s":[["Aufsteigender Ast","NKCC2 pumpt Na⁺, K⁺, 2 Cl⁻ ins Gewebe; für Wasser **undurchlässig**"],["Nierenmark wird salzig","Osmolarität steigt von der Rinde zum Mark: 400 → 1200 mosmol/l"],["Absteigender Ast","sehr **wasserdurchlässig** → Wasser folgt dem osmotischen Sog ins Gewebe"],["Primärharn wird konzentriert","treibt wiederum den NKCC2 an"]],"loop":true},"li":["So entsteht im Mark mit wenig Energie eine hohe Osmolarität – Voraussetzung, dass das Sammelrohr Wasser zurückholen kann"],"m":"**Schleifendiuretika** (Furosemid, Torasemid) blockieren den NKCC2 → viel Urin. Gefahr: **Hypokaliämie** (K⁺ unter 3,5 mmol/l). Diuretika helfen bei Herzinsuffizienz mit Ödemen, anderen Ödemen, Niereninsuffizienz und Hypertonie.","q":[["EX5","5, 7–8"]]}]},{"id":"raas","titel":"RAAS, ADH und Calciumhaushalt","bereich":"Niere und Wasserhaushalt","kurz":"Renin-Angiotensin-Aldosteron-System, ACE-Hemmer und Sartane, ADH und Aquaporine, Parathormon und Vitamin D","lern":[{"h":"Renin-Angiotensin-Aldosteron-System","li":["Langfristige Blutdruckregulation über **Plasmavolumen** (Wasser, Natrium) und den Vasokonstriktor **Angiotensin II**","Eine Kaskade von Plasmafaktoren – ähnlich wie die Gerinnung"],"fl":{"s":[["Blutdruck oder Na⁺ im Urin sinkt","Sympathikus ↑ (β₁)"],["Polkissenzellen setzen **Renin** frei"],["Angiotensinogen → Angiotensin I","Angiotensinogen aus Leber und Fettgewebe"],["ACE → **Angiotensin II**","ACE aus dem Lungenendothel"],["Wirkungen","Gefäße eng, Aldosteron, ADH, Durst → Blutdruck steigt"]]},"q":[["EX5","9–11"]]},{"h":"Der juxtaglomeruläre Apparat","tb":[["Zellen","Wo","Aufgabe"],["Macula densa","Epithel des distalen Tubulus neben dem Glomerulus","misst die Na⁺-Konzentration im Tubulus"],["Extraglomeruläre Mesangiumzellen","neben der zuführenden Arteriole","Barorezeptoren für den Druck in der Arteriole"],["Polkissenzellen (juxtaglomeruläre Zellen)","Wand der zuführenden Arteriole","setzen **Renin** frei; tragen β₁-Rezeptoren"]],"q":[["EX5","9–10"]]},{"h":"Was Angiotensin II und Aldosteron tun","tb":[["Ziel","Wirkung"],["Gefäße","Vasokonstriktion"],["Gehirn / Neurohypophyse","ADH-Freisetzung, Durst, Salzappetit"],["Proximaler Tubulus","mehr Na⁺-Rückresorption"],["Nebennierenrinde","**Aldosteron**-Bildung"],["Nebennierenmark","Adrenalinfreisetzung"]],"li":["**Aldosteron** bindet im distalen Tubulus an den Mineralokortikoidrezeptor → mehr Na⁺/K⁺-Pumpen, mehr Na⁺-Kanäle (**ENaC**) und K⁺-Kanäle → Na⁺ wird zurückgeholt, **K⁺ ausgeschieden** → weniger Urin, mehr Plasmavolumen"],"q":[["EX5","10–12"]]},{"h":"Medikamente gegen das RAAS","tb":[["Gruppe","Erkennbar an","Wirkung"],["ACE-Hemmer","„-pril“ (Ramipril, Enalapril, Captopril, Lisinopril)","weniger Angiotensin II"],["Angiotensin-II-Rezeptorblocker","„-sartan“","blockieren den AT₁-Rezeptor"],["Aldosteronantagonisten","Spironolacton, Eplerenon","schwach harntreibend, aber **Kalium steigt**; bei Aszites (mit Schleifendiuretika) und Herzinsuffizienz (bremsen den bindegewebigen Umbau)"]],"q":[["EX5","10, 13"]]},{"h":"Wie die Niere ihre Filtration konstant hält","tb":[["Situation","Was passiert","GFR"],["Normal","–","normal"],["Blutdruck fällt","PGE₂ weitet die zuführende Arteriole, Angiotensin II verengt die abführende","bleibt gleich"],["+ NSAR","keine PGE₂-Erweiterung der zuführenden Arteriole","fällt"],["+ ACE-Hemmer oder Sartan","keine Angiotensin-II-Verengung der abführenden Arteriole","fällt"]],"m":"GFR steigt bei **Weitstellung der zuführenden** und **Engstellung der abführenden** Arteriole.","q":[["EX5","11–12"]]},{"h":"ADH und die Kontrolle der Osmolarität","fl":{"s":[["Osmolarität im Plasma steigt","meist Wassermangel"],["Osmorezeptoren im Hypothalamus","Durst und Salzappetit"],["ADH wird gebildet","im Hypothalamus, über Axone in den Hypophysenhinterlappen, dort ins Blut"],["ADH bindet am Sammelrohr","Vasopressin-Rezeptor → Vesikel mit **Aquaporin-2**"],["Aquaporine in die Membran","Wasser folgt dem salzigen Nierenmark → zurück ins Blut"]]},"li":["ADH (Adiuretin, Vasopressin) wirkt außerdem **vasokonstriktorisch**","Die Hypophyse: **Vorderlappen** (Adenohypophyse) und **Hinterlappen** (Neurohypophyse, Axonenden aus dem Hypothalamus)"],"tb":[["Störung","Ursache","Folge"],["Kein ADH (Diabetes insipidus)","Kopfverletzung, Hirn-OP, Entzündung, Tumor","viel Urin, großer Durst, Na⁺ steigt; Therapie: Desmopressin-Nasenspray"],["Zu viel ADH (SIADH)","Schlaganfall, Schädel-Hirn-Trauma, Meningitis, Pneumonie, Tumoren","wenig, sehr konzentrierter Urin; **Hyponatriämie**"]],"q":[["EX5","13–14"]]},{"h":"Calciumhaushalt","li":["**99 %** des Calciums steckt als Calciumphosphat in Knochen und Zähnen; nur 0,01 % liegt in den Zellen (v. a. im Retikulum)","Freies Ca²⁺ braucht man für Querbrückenzyklus, Aktionspotenzial, Gerinnung (Faktor IV), Zellteilung","Aufnahme im Darm, Einbau in den Knochen, Ausscheidung über die Niere"],"tb":[["Hormon","Woher","Wirkung"],["**Parathormon (PTH)**","Nebenschilddrüsen","Osteoklasten setzen Ca²⁺ und Phosphat frei; mit Vitamin D mehr Ca²⁺-Rückresorption in der Niere, **weniger Phosphat-Rückresorption**"],["**Vitamin D₃ (Calcitriol)**","Haut (Sonne), Leber, Niere","mehr Ca²⁺- und Phosphataufnahme aus dem Darm"],["**Calcitonin**","Schilddrüse","Gegenspieler, aber geringe Bedeutung (nach Schilddrüsen-OP kaum Folgen)"]],"m":["Nicht verwechseln: PTH setzt **mehr Phosphat aus dem Knochen** frei, aber die Niere holt **weniger Phosphat** zurück.","Vitamin D wirkt auch aufs Immunsystem: in einer Metaanalyse senkte regelmäßige Einnahme akute Atemwegsinfekte (Skript: Experten empfehlen 4000 IE täglich)."],"q":[["EX5","8–9"]]}]}],"fragensets":[{"id":"razzia1","titel":"Razzia 1","razzia":1,"kurz":"Aufwärmfragen, Immunsystem, Koagulation und Atemgastransport (mündliche Prüfung „Blut“)","fragen":[{"id":"r1-w1","nr":"W1","thema":"atemgase","f":"Aufwärmfrage: Welche zwei Atemgase gibt es?","a":[{"li":["**Sauerstoff (O₂)** und **Kohlendioxid (CO₂)**"]}],"q":[["R1W",1]]},{"id":"r1-w2","nr":"W2","thema":"chemie","f":"Aufwärmfrage: Was ist ein Elektrolyt?","a":[{"li":["**Ionen** = elektrisch geladene Teilchen","Wichtig in der Physiologie: Na⁺, K⁺, Ca²⁺ (Kationen) und Cl⁻ (Anion)"]}],"q":[["R1W",1],["BL",6]]},{"id":"r1-w3","nr":"W3","thema":"chemie","f":"Aufwärmfrage: Welches Elektrolyt dominiert im Blutplasma?","a":[{"li":["**Natrium (Na⁺)**, ca. 140 mmol/l","Deshalb hauptverantwortlich für den **osmotischen Druck**"]}],"q":[["R1W",1],["BL","6–7"]]},{"id":"r1-w4","nr":"W4","thema":"blut","f":"Aufwärmfrage: Was bedeutet pluripotente Stammzelle?","a":[{"li":["Lat. plures = mehrere, potens = in der Lage sein","Ausgangszelle im **Knochenmark**, aus der über Zwischenstufen („-blasten“) **alle Blutzellen** entstehen: Erythrozyten, Thrombozyten, Leukozyten (z. B. T-Killer- und T-Helferzellen, Makrophagen, dendritische Zellen, Mastzellen)"]}],"q":[["R1W",1],["BL",4]]},{"id":"r1-w5","nr":"W5","thema":"blut","f":"Aufwärmfrage: Wie viele Erythrozyten sind normalerweise in 1 µl Blut?","a":[{"li":["**4–5 Millionen** pro µl"]}],"q":[["R1W",1],["BL",2]],"korr":["Vorlage: „3,5–5 Mio. in 1 µm“ → Skript: **4–5 Mio. pro µl** (Mikroliter, nicht Mikrometer)."]},{"id":"r1-w6","nr":"W6","thema":"blut","f":"Aufwärmfrage: Wie viele Thrombozyten sind normalerweise in 1 µl Blut?","a":[{"li":["**150.000–300.000** pro µl (Skript Blut: bis 350.000)","Unter 150.000: Thrombozytopenie; schwere Blutungen unter 15.000–20.000"]}],"q":[["R1W",1],["GE",2],["GE",5]]},{"id":"r1-w7","nr":"W7","thema":"blut","f":"Aufwärmfrage: Wie viele Leukozyten sind normalerweise in 1 µl Blut?","a":[{"li":["**5.000–10.000** pro µl","Mehr bei Entzündungen (Leukozytose)"]}],"q":[["R1W",1],["BL","2–3"]]},{"id":"r1-w8","nr":"W8","thema":"blut","f":"Aufwärmfrage: Woher kommt der Name Granulozyt?","a":[{"li":["Lat. **granulum = Körnchen** – die Zellen haben reichlich Granula im Zytoplasma"]}],"q":[["R1W",1],["IM",6]]},{"id":"r1-w9","nr":"W9","thema":"blut","f":"Aufwärmfrage: Welche Leukozytensubgruppen sind im Blut?","a":[{"li":["Der Häufigkeit nach: **N**eutrophile Granulozyten, **L**ymphozyten, **M**onozyten, **E**osinophile, **B**asophile Granulozyten"]}],"q":[["R1W",1],["IM",7]]},{"id":"r1-w10","nr":"W10","thema":"blut","f":"Aufwärmfrage: Welche Leukozytensubgruppen sind nur im Gewebe?","a":[{"li":["**Makrophagen** (ausgewanderte Monozyten), **dendritische Zellen**, **Mastzellen**"]}],"q":[["R1W",1],["IM","6–7"]]},{"id":"r1-w11","nr":"W11","thema":"chemie","f":"Aufwärmfrage: Wie definiert sich der pH?","a":[{"li":["**pH = −log₁₀ [H⁺]** (negativer dekadischer Logarithmus der Wasserstoffionen-Konzentration)","Blut: 7,37–7,43 (leicht basisch)"]}],"q":[["R1W",1],["BL","7–8"]]},{"id":"r1-w12","nr":"W12","thema":"chemie","f":"Aufwärmfrage: Was bedeutet hydrophil, hydrophob, lipophil, lipophob?","a":[{"li":["**hydrophil:** wasserliebend (wasserlöslich)","**hydrophob:** wassermeidend (nicht wasserlöslich)","**lipophil:** fettlöslich","**lipophob:** fettabweisend"]}],"q":[["R1W",1]]},{"id":"r1-w13","nr":"W13","thema":"blut","f":"Aufwärmfrage: Woher haben Leukozyten ihren Namen?","a":[{"li":["Griech. **leukos = weiß** – nach der weißen Schicht im Blutröhrchen"]}],"q":[["R1W",1],["BL",3]]},{"id":"r1-w14","nr":"W14","thema":"blut","f":"Aufwärmfrage: Was ist der Hämatokrit?","a":[{"li":["**Anteil der Blutzellen am Gesamtvolumen** des Blutes","Normal etwa 42 %: Frauen 0,37–0,47, Männer 0,40–0,52"]}],"q":[["R1W",1],["BL",2]]},{"id":"r1-w15","nr":"W15","thema":"blut","f":"Aufwärmfrage: Welche Proteine findet man im Plasma?","a":[{"li":["**Albumin** (ca. 60 %) und **Globuline** (ca. 40 %, dazu gehören die Antikörper)","Außerdem z. B. Gerinnungsfaktoren, Komplementfaktoren"]}],"q":[["R1W",1],["BL",2]]},{"id":"r1-w16","nr":"W16","thema":"blut","f":"Aufwärmfrage: Nenne zwei Aufgaben des Organsystems Blut.","a":[{"li":["**Transport** (O₂, CO₂, Nährstoffe, Stoffwechselprodukte, Elektrolyte, Hormone)","**Gerinnung**","**Immunabwehr**","außerdem pH-Regulation, Wärmehaushalt, Flüssigkeitshaushalt"]}],"q":[["R1W",1],["BL",1]]},{"id":"r1-w17","nr":"W17","thema":"energie","f":"Aufwärmfrage: Welche Nährstoffe kann man unterscheiden?","a":[{"li":["**Energieliefernd:** Kohlenhydrate, **Fette**, Eiweiße","**Nicht energieliefernd:** Vitamine, Mineralstoffe, Ballaststoffe, Wasser"]}],"q":[["R1W",1],["GL",2]],"korr":["In der Vorlage fehlen die **Fette** bei den energieliefernden Nährstoffen – sie sind sogar der größte Energiespeicher."]},{"id":"r1-w18","nr":"W18","thema":"immunsystem","f":"Aufwärmfrage: Wie unterscheiden sich Monozyten von Makrophagen?","a":[{"li":["**Monozyten** werden im Knochenmark gebildet und schwimmen im **Blut** (größte Blutzellen)","**Makrophagen** = Monozyten, die per **Diapedese** ins **Gewebe** ausgewandert sind („große Fresser“)"]}],"q":[["R1W",1],["IM","6–7"]]},{"id":"r1-w19","nr":"W19","thema":"blut","f":"Aufwärmfrage: Nenne einen Zelltyp aus der pluripotenten Stammzelle.","a":[{"li":["z. B. **Mastzelle** – oder jede andere Blutzelle: Erythrozyt, Thrombozyt, Granulozyt, Lymphozyt, Monozyt"]}],"q":[["R1W",1],["BL",4]]},{"id":"r1-w20","nr":"W20","thema":"blut","f":"Aufwärmfrage: Was bedeutet basophil?","a":[{"li":["Granula, die sich mit **basischen Farbstoffen blau** anfärben lassen","Eosinophile färben sich rot, Neutrophile gar nicht"]}],"q":[["R1W",1],["IM",6]]},{"id":"r1-i1","nr":"I.1","thema":"immunsystem","f":"Wie sehen neutrophile Granulozyten aus? Welche 4 Fähigkeiten haben sie? Wie werden sie aktiviert?","a":[{"h":"Aussehen","li":["**Segmentierter Kern:** mit der Reifung immer mehr Segmente (2 = „hantelförmig“, 5 = „hypersegmentiert“)","**Granula** reichlich im Zytoplasma; in der Färbung **neutral** (färben sich weder rot noch blau)","**Größte Leukozytengruppe** im Blut"]},{"h":"4 Fähigkeiten","li":["1. **Phagozytose** (Lysosomen verschmelzen mit dem Phagosom)","2. **Reaktive Sauerstoffspezies** (Sauerstoffradikale) bilden → oxidativer Stress für den Erreger","3. **Degranulation:** zellschädliche Stoffe per Exozytose freisetzen","4. **NETose:** Kernmembran auflösen und mit der DNA Netze bilden, die Bakterien einfangen"]},{"h":"Aktivierung","li":["durch die Komplementfaktoren **C5a und C3b** und bei Kontakt mit **aktiviertem Endothel**"]}],"q":[["R1I",1],["IM","6, 14–16"]]},{"id":"r1-i2","nr":"I.2","thema":"immunsystem","f":"Wie unterscheiden sich PRRs von T-Zell-Rezeptoren hinsichtlich ihrer Entstehung und ihres Zielspektrums?","a":[{"tb":[["","PRR (pattern recognition receptor)","TCR (T-Zell-Rezeptor)"],["Immunsystem","angeboren","erworben"],["Entstehung","von Geburt an vorhanden, unveränderlich (dendritische Zellen, Makrophagen)","in jeder T-Zelle individuell durch **Rearrangement** der Genabschnitte zusammengebaut, im Thymus geprüft"],["Zielspektrum","**breit:** erkennt Molekülmuster ganzer Erregergruppen (**PAMPs**, z. B. Flagellin über TLR5)","**hochspezifisch:** ein einzelnes Antigen-Peptid, das auf einem **MHC-Molekül** präsentiert wird"]],"m":"Die Bindung des TCR an das MHC-II-Molekül mit Antigen der dendritischen Zelle ist **Signal 1** für die Aktivierung der T-Helferzelle."}],"q":[["R1I",1],["IM","11–12, 17–19"]],"korr":["Genauer: der TCR erkennt nicht das MHC-Molekül allein, sondern das **Antigen-Peptid im MHC-Molekül**."]},{"id":"r1-i3","nr":"I.3","thema":"immunsystem","f":"Über welche drei Wege kann das Komplementsystem aktiviert werden? Welche beiden Aufgaben hat C3b? Welche drei Wirkungen hat das Komplementsystem?","a":[{"h":"Drei Wege","tb":[["Weg","Auslöser"],["Klassisch","Antikörper am Bakterium binden **C1** → C1 spaltet C2 und C4 → **C4b2a = C3-Konvertase** spaltet C3"],["Alternativ","C3 zerfällt **spontan** in C3a und C3b; C3b legt sich ohne Antikörper auf das Bakterium"],["Lektin-Weg","spezielle **Zucker** (Lektine) auf der Bakterienmembran"]]},{"h":"C3b hat zwei Aufgaben","li":["1. **Opsonierung** („Würzen“): Makrophagen erkennen C3b und fressen das Bakterium","2. löst über C5 die Bildung des **MAC** (membrane attack complex) aus"]},{"h":"Drei Wirkungen","li":["1. **Opsonierung** → Phagozytose","2. **Zytolyse:** der MAC bohrt Poren in die Bakterienmembran → Wasser strömt ein → Zelltod","3. **Chemotaxis:** **C3a** lockt Makrophagen an (Rekrutierung)"],"m":"Prinzip **Kaskade**: wenig C1, mehr C2/C4, noch mehr C3 → Verstärkung. Genauso bei Gerinnung und RAAS."}],"q":[["R1I","1–2"],["IM","8–10"]]},{"id":"r1-i4","nr":"I.4","thema":"immunsystem","f":"Welche mechanischen und chemischen Barrieren haben a) die Haut, b) der Darm, c) die Lunge, d) die Augen? Hat das Mikrobiom auch eine Barrierefunktion?","a":[{"tb":[["Organ","Mechanisch","Chemisch"],["a) Haut","Epithel mit Tight Junctions","Fettsäuren, antimikrobielle Peptide"],["b) Darm","Epithel, Schleim","niedriger pH (Magensäure), Enzyme, antimikrobielle Peptide"],["c) Lunge","Schleim, Zilien (Flimmerepithel)","Surfactant, antimikrobielle Peptide"],["d) Augen","Tränenflüssigkeit spült","Lysozym in Tränen, antimikrobielle Peptide"]],"li":["**Antimikrobielle Peptide (AMP):** über 1000 „natürliche Antibiotika“ aus den Epithelzellen; stark positiv geladen, stoßen sich in der Erregermembran ab und reißen Lücken","Die Epithelzellen können Erreger auch erkennen und Chemokine bilden"]},{"h":"Mikrobiom","li":["**Ja:** die Normalflora (Haut, Gehörgang, Vagina, Nasen-Rachen-Raum, Darm) hemmt das Wachstum krankmachender Erreger und **besetzt ihre Bindungsstellen** auf den Schleimhäuten","Bildet außerdem Vitamine (Darm: Vitamin B und K)","Schädlich wird sie nur, wenn sie den Ort wechselt (z. B. Darmbakterien in der Bauchhöhle) oder bei Immunschwäche"],"m":"95 % der Erreger fangen Schleimhäute, Mikroflora und angeborenes Immunsystem ab."}],"q":[["R1I",2],["IM","4–5"]]},{"id":"r1-i5","nr":"I.5","thema":"immunsystem","f":"Erläutern Sie die drei Signale einer antigenpräsentierenden dendritischen Zelle.","a":[{"li":["Die dendritische Zelle patrouilliert im Gewebe. Ihre **PRRs** erkennen **PAMPs** von Erregern → ca. 1000 Gene werden aktiviert"],"fl":{"s":[["Signal 1: Antigenpräsentation","Erreger wird aufgenommen, zerstückelt, Bruchstücke auf **MHC II** präsentiert → bindet den TCR"],["Signal 2: Ko-Stimulation","Einbau von Rezeptoren in die Membran, an die T-Helferzellen binden"],["Signal 3: Zytokine","Botenstoffe für die T-Zelle"]]},"m":"Die dendritische Zelle ist der „Spion“: sie wandert in den Lymphknoten („Geheimdienstzentrale“) zur passenden T-Helferzelle. Nur Signal 1 + 2 + 3 zusammen aktivieren die T-Zelle."}],"q":[["R1I","2–3"],["IM","11–13"]]},{"id":"r1-i6","nr":"I.6","thema":"immun-erworben","f":"Erläutern Sie den Unterschied von MHC-I- zu MHC-II-Molekülen. Welche Rolle spielt der Thymus? Wie wirken T-Killerzellen?","a":[{"h":"MHC I und MHC II","tb":[["","MHC I","MHC II"],["Wo","**alle** kernhaltigen Körperzellen","nur **antigenpräsentierende Zellen** (dendritische Zellen, B-Zellen)"],["Was wird präsentiert","Peptide aus dem **Zellinneren** (zeigt, was in der Zelle passiert – auch Virus- oder Krebsproteine)","Teile **aufgenommener Erreger** (Fremdantigene)"],["Wer bindet","**T-Killerzellen** (CD8)","**T-Helferzellen** (CD4)"]],"li":["MHC = major histocompatibility complex, beim Menschen = HLA → verantwortlich für Abstoßungsreaktionen"]},{"h":"Thymus = „Schule der T-Zellen“","li":["**Positive Selektion:** T-Zellen, die nicht an MHC binden können, sterben (Apoptose)","**Negative Selektion:** T-Zellen, die stark an körpereigene Proteine binden, sterben → nur selbst-tolerante bleiben","Etwa **99 %** werden aussortiert; schwach selbst-reaktive werden zu regulatorischen T-Zellen"]},{"h":"T-Killerzellen","li":["Kontrollieren ständig die MHC-I-Moleküle der Körperzellen","Erkennen sie ein fremdes Peptid (Virusinfektion, Krebszelle) → setzen **Perforin** und **Granzym** frei → Löcher in der Zell**membran** → **Apoptose**"]}],"q":[["R1I",3],["IM","18–22"]],"korr":["„Schädigung der Zellwand durch Perforin“ → menschliche Zellen haben keine Zellwand, sondern eine **Zellmembran** (auch das Skript schreibt „Zellwand“)."]},{"id":"r1-i7","nr":"I.7","thema":"immun-erworben","f":"Welche drei unterschiedlichen Typen von T-Zellen kennen Sie? Welche Aufgaben haben T-Suppressorzellen?","a":[{"tb":[["T-Zelle","Aufgabe"],["**T-Helferzelle** (CD4)","erkennt Antigen auf MHC II, aktiviert mit Zytokinen B-Zellen und T-Killerzellen → gezielte Antwort"],["**T-Killerzelle** (CD8, zytotoxisch)","tötet infizierte oder entartete Zellen (MHC I) mit Perforin und Granzym"],["**T-Suppressor- bzw. regulatorische T-Zelle**","unterdrückt Immunantworten"]]},{"h":"Aufgaben der T-Suppressorzellen","li":["Schalten das Immunsystem **am Ende einer Infektion** wieder ab, damit keine körpereigenen Zellen zerstört werden","Verhindern, dass es überhaupt anläuft, wenn dendritische Zellen körpereigene Proteine präsentieren → Schutz vor **Autoimmunität** (auch nach dem Thymus sind knapp **5 %** der T-Zellen autoaggressiv)",["**Drei Wege:**","Zytokine (IL-10, TGF-β) hemmen die dendritische Zelle","… und die T-Helferzelle","Perforin/Granzym töten die autoreaktive T-Helferzelle"]]}],"q":[["R1I",3],["IM","22–23"]]},{"id":"r1-i8","nr":"I.8","thema":"immun-erworben","f":"Erläutern Sie die verschiedenen Antikörpertypen. Wie kann man eine frische Reinfektion erkennen? Welche drei Wirkungen haben Antikörper?","a":[{"h":"Antikörpertypen („MEGAD“)","tb":[["Typ","Form","Besonderheit"],["IgM","Pentamer (J-Kette), 10 Bindungsstellen","kommt **als erster** → zeigt frische Infektion; groß; aktiviert Komplement"],["IgE","Monomer","**Allergie:** auf Mastzellen, Vernetzung setzt Histamin frei"],["IgG","Monomer","kleiner, geht über die **Plazenta**; von Gedächtniszellen gebildet"],["IgA","Dimer (J-Kette)","v. a. in **Schleimhäuten** von Atem- und Verdauungstrakt"],["IgD","–","Entwicklung der B-Zellen"]],"li":["Aufbau: 2 schwere + 2 leichte Ketten, „Y“-Form; **Fab** bindet das Antigen, **Fc** dockt an Immunzellen oder C1 an"]},{"h":"Antikörperprofile","tc":[["Situation","IgM","IgG"],["frische Infektion","hoch","keins"],["ältere Erstinfektion","niedrig","hoch"],["**frische Reinfektion**","mittelhoch","**schnell und sehr hoch**"],["ältere Reinfektion","keins","sehr hoch"]]},{"h":"Drei Wirkungen","li":["1. **Neutralisation/Agglutination:** besetzen die Andockproteine von Viren, verklumpen Erreger → leichter zu fressen","2. **Opsonierung:** Fc bindet an Fcγ-Rezeptoren von Neutrophilen, Makrophagen, dendritischen Zellen, NK-Zellen","3. **Komplementaktivierung** (klassischer Weg über C1)"]}],"q":[["R1I","3–6"],["IM","25–27"]]},{"id":"r1-i9","nr":"I.9","thema":"allergie","f":"Nennen Sie drei besonders häufige inhalative Allergene. Wie kommt es zur allergischen Reaktion vom Soforttyp nach Coombs und Gell bei einer Pferdeallergie? Was löst die Histaminfreisetzung aus und welche Wirkungen hat Histamin?","a":[{"h":"Inhalative Allergene","li":["**Pollen** (Gräser, Bäume)","**Hausstaub** (Kot der Hausstaubmilbe)","**Tierepithelien** (Hunde-, Katzen-, Pferdehaare)"]},{"h":"Ablauf bei der Pferdeallergie (Typ I)","fl":{"s":[["Erstkontakt = Sensibilisierung","B-Zelle nimmt das Allergen auf und präsentiert es auf MHC II"],["T-Helferzelle aktiviert die B-Zelle","sie wird zur Plasmazelle und bildet **IgE**"],["IgE setzt sich mit Fc auf Mastzellen","in Schleimhaut von Atemwegen und Darm, in der Haut"],["Erneuter Kontakt mit Pferdehaar","das Allergen verbindet zwei benachbarte IgE (**Crosslinking**)"],["Mastzelle schüttet in Sekunden bis Minuten Histamin aus"]]}},{"h":"Wirkungen von Histamin","tb":[["Ort","Wirkung"],["Bronchien","Spasmus → Atemnot, Stridor (beim Pferd v. a. das)"],["Haut","juckende Quaddeln (Urtikaria)"],["Gefäße","Erweiterung → Kreislaufkollaps"],["Darm","Durchfall, Erbrechen, Bauchschmerzen"]],"m":"Ohne vorherige Sensibilisierung gibt es kein passendes IgE – also keine Allergie beim ersten Kontakt."}],"q":[["R1I",6],["IM","29–31"]],"korr":["In der Vorlage als Frage „4“ nummeriert – laut Fragenliste ist es **Frage 9**.","Schreibfehler: Coombs und **Gell**."]},{"id":"r1-k1","nr":"II.1","thema":"thrombose","f":"Was ist Antikoagulation? Nennen Sie vier endotheliale Substanzen mit antikoagulatorischer Wirkung und gehen Sie auf eine davon näher ein.","a":[{"li":["**Antikoagulation** = Hemmung der Gerinnung im Bereich **gesunder** Endothelzellen, damit der Thrombus nicht über die Verletzung hinaus das ganze Gefäß verschließt (Thrombose)"],"tb":[["Substanz","Wirkung"],["NO (Stickstoffmonoxid)","verhindert die Aktivierung ruhender Thrombozyten"],["PGI₂ (Prostazyklin)","verhindert die Aktivierung ruhender Thrombozyten"],["Heparansulfat","Co-Faktor für **Antithrombin III** → inaktiviert IIa, IXa, Xa, XIa, XIIa"],["TFPI (tissue factor pathway inhibitor)","hemmt den extrinsischen Weg (Gewebefaktor + VII)"],["Thrombomodulin","siehe unten"]]},{"h":"Beispiel Thrombomodulin","fl":{"s":[["Thrombomodulin bindet Thrombin (IIa)"],["aktiviert mit Protein S das Protein C"],["aktiviertes Protein C inaktiviert Va und VIIIa"]]}}],"q":[["R1K",1],["GE",13]],"korr":["„zusammen mit Protein 5“ → **Protein S**.","„Heparin-sulfat“ → **Heparansulfat** (heparinähnliches Molekül des Endothels)."]},{"id":"r1-k2","nr":"II.2","thema":"haemostase","f":"Was versteht man unter Thrombozytenaggregation? Wie wirken ASS und Clopidogrel? Wann werden sie eingesetzt?","a":[{"li":["**Thrombozytenaggregation** = Vernetzung aktivierter Thrombozyten über **Fibrinogen**, das an ihre Fibrinogenrezeptoren (GP IIb/IIIa) bindet → weißer Thrombus"]},{"tb":[["Wirkstoff","Wirkung","Dauer"],["**ASS** (Aspirin)","hemmt **irreversibel** die Cyclooxygenase (COX-1) im Thrombozyten → kein Thromboxan A₂","ganze Lebensdauer des Thrombozyten: **8–10 Tage**"],["**Clopidogrel** (Prasugrel)","blockiert **irreversibel** den **ADP-Rezeptor** → keine Aktivierung über ADP (Ticagrelor: reversibel)","Restwirkung ca. 7 Tage – vor geplanten Operationen beachten"],["GP-IIb/IIIa-Antagonisten","blockieren den Fibrinogenrezeptor","–"]],"m":"**Einsatz:** im **arteriellen** System – Vorbeugung und Therapie von Herzinfarkt (akutes Koronarsyndrom) und Schlaganfall."}],"q":[["R1K",1],["GE","6–8, 13"]]},{"id":"r1-k3","nr":"II.3","thema":"haemostase","f":"Was ist die häufigste angeborene Gerinnungsstörung? Erklären Sie, wie es dazu kommt.","a":[{"li":["**Von-Willebrand-Jürgens-Syndrom** – nicht die Hämophilie!","Der **von-Willebrand-Faktor (vWF)** fehlt ganz oder funktioniert nicht richtig","Ohne vWF können sich die Thrombozyten nicht an das freiliegende Kollagen heften → **Thrombozytenadhäsion** gestört → Blutungsneigung","**Symptome:** häufiges Nasenbluten, verstärkte Monatsblutungen, viele blaue Flecken, Nachblutungen; auffällig: spontane Gelenkeinblutung (**Hämarthros**)"],"m":"Der vWF wird vom Endothel gebildet und trägt im Blut auch Faktor VIII."}],"q":[["R1K",1],["GE","4–5"]]},{"id":"r1-k4","nr":"II.4","thema":"haemostase","f":"Wodurch kann die plasmatische Gerinnung prinzipiell aktiviert werden? Erläutern Sie am Beispiel der Hämophilie A die Grenzen der klassischen Gerinnungskaskade.","a":[{"h":"Aktivierung","li":["Gefäßverletzung legt den **Gewebefaktor (Faktor III)** frei – er sitzt auf Fibroblasten und glatten Muskelzellen unter dem Endothel","III bildet mit **VII** einen Komplex → aktiviert **X** → X spaltet **II** (Prothrombin → Thrombin)","Im Reagenzglas: Aktivierung von **XII** an negativ geladenen Oberflächen (Glas) → XI → IX → VIII (intrinsischer Weg)"]},{"h":"Das Problem mit dem Kaskadenmodell","li":["Hämophilie A = Mangel an **Faktor VIII**, der nur auf dem intrinsischen Weg liegt","Nach dem Modell müsste der extrinsische Weg allein reichen – die Patienten **bluten aber trotzdem**","Der extrinsische Weg liefert nur ca. **5 %** des Thrombins: nur einen „**Thrombinfunken**“","Erst der intrinsische Zweig (VIIIa/IXa = 50-mal effektiver) macht daraus ein „loderndes Fibrin-Feuer“"],"m":"Das Kaskadenmodell beschreibt gut das **Reagenzglas**. Den Körper beschreibt besser das **zellbasierte Modell**: die Faktoren reagieren auf Zelloberflächen, beide Wege sind verwoben (Thrombin aktiviert XI, VIII, V, XIII; VIIa aktiviert auch IX/XI – Josso-Schleife)."}],"q":[["R1K","1–3"],["GE","9–11"]]},{"id":"r1-k5","nr":"II.5","thema":"haemostase","f":"Beschreiben Sie die letzten Schritte der Fibrinbildung aus Fibrinogen. Wo findet dieser Prozess statt? Welche Rolle haben Faktor II und Faktor XIII?","a":[{"fl":{"s":[["Xa + Va spalten Prothrombin (II)","massive Thrombinbildung"],["Thrombin (IIa) spaltet Fibrinogen (I) → Fibrin (Ia)"],["Fibrinmoleküle lagern sich zu langen Fäden zusammen"],["Faktor XIIIa vernetzt die Fäden quer","„fibrinstabilisierender Faktor“"],["Erythrozyten verfangen sich → roter Thrombus"]]},"li":["**Wo:** auf der Oberfläche **aktivierter Thrombozyten** an der Verletzung – dort sitzt das Fibrinogen auf den Fibrinogenrezeptoren","**Faktor II (Thrombin):** Schlüsselenzym – spaltet Fibrinogen, aktiviert XIII, XI, VIII, V und Thrombozyten","**Faktor XIII:** macht aus losen Fäden ein **festes Netz**"]}],"q":[["R1K",3],["GE","9–11"]]},{"id":"r1-k6","nr":"II.6","thema":"thrombose","f":"Nennen Sie ein Medikament aus der Gruppe der Antikoagulantien. Beschreiben Sie seine Wirkung und Indikation.","a":[{"li":["**Antikoagulantien** blockieren gezielt Gerinnungsfaktoren (sekundäre Hämostase). **Indikation:** Vorbeugung und Therapie von Thrombosen im **venösen** System inkl. Lungenembolie"],"tb":[["Medikament","Wirkung","Besonderheit"],["**NOAK** (Rivaroxaban, Apixaban, Edoxaban)","hemmen direkt **Faktor Xa**","1 Tablette täglich, weniger spontane Blutungen, wenig Kontrolle nötig – aber teuer"],["**Heparin**","verstärkt **Antithrombin III** 1000-fach (hemmt Xa, IIa)","muss gespritzt werden; Gefahr **HIT II** (Antikörper gegen PF4, nach ca. 2 Wochen, ca. 5 %)"],["**Vitamin-K-Antagonisten** (Marcumar)","verhindern das Vitamin-K-Recycling → weniger Faktoren **II, VII, IX, X** („1972“)","aufwendige Kontrolle, Blutungsgefahr"],["Hirudin (Blutegel)","hemmt Thrombin","–"]]}],"q":[["R1K",4],["GE","14–15"]]},{"id":"r1-k7","nr":"II.7","thema":"haemostase","f":"Erläutern Sie die beiden Komponenten der primären Hämostase. Warum ist eine sekundäre Hämostase überhaupt notwendig?","a":[{"h":"1. Vaskuläre Blutstillung","li":["Innerhalb von Sekunden ziehen sich die glatten Muskelzellen um die Verletzung zusammen (wohl reflektorisch), ca. 60 s; unterstützt durch Serotonin und Thromboxan A₂ aus den Thrombozyten","Weniger Blutverlust, Blutstrom umgeleitet","Laminare Strömung: große Zellen fließen in der Mitte, **Thrombozyten am Rand** – direkt am „Ort des Geschehens“"]},{"h":"2. Thrombozytäre Blutstillung (weißer Thrombus)","fl":{"s":[["Adhäsion","Kollagen liegt frei; vWF bindet daran, Thrombozyten binden mit dem vWF-Rezeptor (GP Ib) und Kollagenrezeptor"],["Aktivierung","Formänderung mit langen Fortsätzen; Freisetzung von **ADP** und **Thromboxan A₂** → aktiviert weitere Thrombozyten (positive Rückkopplung), verstärkt die Vasokonstriktion"],["Aggregation","Fibrinogen bindet an GP IIb/IIIa und vernetzt die Thrombozyten → **weißer Thrombus** (noch ohne Erythrozyten)"]]}},{"h":"Warum sekundäre Hämostase?","m":"Der weiße Thrombus ist **instabil** und würde sich lösen. Erst das **Fibrinnetz** der sekundären Hämostase macht ihn zum festen **roten Thrombus**."}],"q":[["R1K","4–5"],["GE","3–6"]]},{"id":"r1-k8","nr":"II.8","thema":"thrombose","f":"Warum sind bei einer Lungenembolie die D-Dimere erhöht? Wie kommen sie zustande? Welche Therapie gibt es bei einem Herz-Kreislauf-Stillstand durch eine Lungenembolie?","a":[{"li":["**D-Dimere** sind **Spaltprodukte von Fibrin**","Der Körper versucht, das Gerinnsel aufzulösen (**Fibrinolyse**): Endothel bildet tPA → Plasminogen → **Plasmin** → spaltet die Fibrinfäden → D-Dimere im Blut","Erhöhte D-Dimere zeigen also: irgendwo läuft **Gerinnung und gleichzeitig Fibrinolyse**","Bei der Lungenembolie reicht die körpereigene Fibrinolyse nicht, um die Lungenstrombahn wieder zu öffnen"],"m":"**Therapie:** Reanimation und **Fibrinolytika** (Lyse, z. B. Streptokinase, Urokinase) → mehr Plasmin. Achtung: Blutungsgefahr steigt erheblich."}],"q":[["R1K",5],["GE","12, 15–16"]]},{"id":"r1-k9","nr":"II.9","thema":"thrombose","f":"Welche Gefahren drohen bei gleichzeitiger Einnahme von ASS und Ibuprofen?","a":[{"li":["**ASS** hemmt die COX-1 der Thrombozyten **irreversibel** (8–10 Tage)","**Ibuprofen** (NSAR) hemmt sie nur **reversibel** (ca. 24–48 h)","Nimmt man beides, besetzt Ibuprofen einen Teil der COX-Moleküle – ASS kommt dort nicht mehr dran. Wenn Ibuprofen abgebaut ist, arbeiten diese Thrombozyten wieder","Für den Herzschutz müssen aber **über 95 %** der COX-1 gehemmt sein → die Hemmung reicht nicht → Gefahr eines **Thrombus** (Herzinfarkt, Schlaganfall)"],"m":"**ASS eine halbe Stunde vor oder frühestens 8 h nach Ibuprofen** nehmen."}],"q":[["R1K","5–6"],["GE",8]],"korr":["Deine Notiz „nochmal nachschauen im Skript“: bestätigt – Skript S. 8 nennt genau ½ h vorher oder ≥ 8 h danach."]},{"id":"r1-k10","nr":"II.10","thema":"thrombose","f":"Erläutern Sie den unterschiedlichen Pathomechanismus inkl. Risikofaktoren eines arteriellen und eines venösen thrombotischen Gefäßverschlusses.","a":[{"tb":[["","Arteriell","Venös"],["Strömung","schnell, hohe Scherkräfte","langsam, Stase (z. B. lange Reisen, Immobilisation)"],["Hauptproblem","**Thrombozyten**: Plaque (Arteriosklerose) bricht auf → Thrombozyten lagern sich an → Verschluss","**plasmatische Gerinnung**: Faktoren lagern sich bei langsamem Fluss zusammen → Fibringerinnsel auch ohne Verletzung"],["Virchow-Trias im Vordergrund","veränderte **Gefäßwand**","veränderter **Blutfluss** und veränderte **Blutzusammensetzung** (Thrombophilie)"],["Risikofaktoren","Bluthochdruck, Rauchen, Fettstoffwechselstörung (LDL), Diabetes mellitus","Immobilisation, Flüssigkeitsmangel, Tumoren, angeborene Defekte (Faktor-V-Leiden, APC-Resistenz, Protein-C/S-Mangel)"],["Folge","Herzinfarkt (> 90 % durch Thrombose auf Arteriosklerose), Schlaganfall","tiefe Venenthrombose → Lungenembolie"],["Medikamente","**Thrombozytenaggregationshemmer** (ASS, Clopidogrel); beim akuten Koronarsyndrom zusätzlich Antikoagulantien","**Antikoagulantien** (Heparin, NOAK, Marcumar)"]],"m":"Arteriell → Thrombozytenaggregationshemmer. Venös → Antikoagulantien."}],"q":[["R1K",6],["GE","6–7, 12–13"]]},{"id":"r1-a1","nr":"III.1","thema":"atemgase","f":"Was besagt die allgemeine Gasgleichung? Wie berechnet sich der Sauerstoffpartialdruck? (Luftdruck auf Meereshöhe 760 mmHg, Wasserdampfdruck bei 20 °C 18 mmHg)","a":[{"h":"Allgemeine Gasgleichung","m":"**p · V ÷ T = konstant**","li":["Erhitzt man ein Gas bei gleichem Druck, dehnt es sich aus; im geschlossenen Behälter steigt stattdessen der Druck","Bei gleicher Temperatur: Kompression → kleineres Volumen, höherer Druck"]},{"h":"Sauerstoffpartialdruck","li":["Luft ist ein Gasgemisch; jedes Gas hat einen **Partialdruck** entsprechend seinem Anteil","Vorher den **Wasserdampfdruck** abziehen"],"tc":[["Schritt","Rechnung"],["trockene Luft","760 − 18 = **742 mmHg**"],["O₂ (21 %)","0,21 × 742 ≈ **156 mmHg**"],["N₂ (78 %)","0,78 × 742 ≈ 579 mmHg"],["CO₂ (0,04 %)","≈ 0,3 mmHg"]],"m":"Einheit: mmHg = Torr (nach Torricelli). 1 bar = 100.000 Pa ≈ 760 mmHg."}],"q":[["R1A",1],["AG","2, 4"]],"korr":["Die Rechnung fehlte in der Vorlage. Bei Frage III.8 steht stattdessen „90 × 7,42 = 667,8 mmHg“ – das ist falsch: der O₂-Partialdruck ist **21 % von 742 mmHg ≈ 156 mmHg**."]},{"id":"r1-a2","nr":"III.2","thema":"atemgase","f":"Zeichnen Sie die Sauerstoffbindungskurve. Was ist „positive cooperativity“ und wie zeigt sie sich auf der Kurve?","abb":[{"h":"Sauerstoffbindungskurve (nachgezeichnet)","tc":[["pO₂ (mmHg)","Sättigung normal","Rechtsverschiebung (Bohr)"],["20","≈ 35 %","≈ 25 %"],["27","≈ 50 % (P50)","≈ 40 %"],["40","≈ 75 %","≈ 65 %"],["60","≈ 90 %","≈ 85 %"],["75","≈ 94 %","≈ 90 %"],["100","≈ 97 %","≈ 96 %"]],"li":["Werte ungefähr aus der Kurve im Skript (S. 12) abgelesen"]}],"a":[{"li":["**Zeichnung:** x-Achse pO₂ (0–100 mmHg), y-Achse O₂-Sättigung (0–100 %); **S-förmige (sigmoidale)** Kurve","**Positive Kooperativität:** bindet O₂ an eine der 4 Hämgruppen, ändert sich die Form (Konformation) des Hämoglobins → die übrigen Hämgruppen binden O₂ **leichter**; mit jedem weiteren O₂ steigt die Affinität noch mehr","**Auf der Kurve:** flacher Beginn, dann **steiler Anstieg (20–60 %)**, dann **Plateau ab ca. 90 %**"],"m":"Häm = zweiwertiges Eisen (Fe²⁺) im Hämoglobin."}],"q":[["R1A",1],["AG","8–9"]]},{"id":"r1-a3","nr":"III.3","thema":"atemgase","f":"Was besagt der Begriff Sauerstoffsättigung? Bei welcher Sättigung und welchem pO₂ geht der steile Anstieg in die Plateauphase über? Welchen Effekt hat in dieser Phase Sauerstoffgabe?","abb":[{"h":"Sauerstoffbindungskurve (nachgezeichnet)","tc":[["pO₂ (mmHg)","Sättigung normal","Rechtsverschiebung (Bohr)"],["20","≈ 35 %","≈ 25 %"],["27","≈ 50 % (P50)","≈ 40 %"],["40","≈ 75 %","≈ 65 %"],["60","≈ 90 %","≈ 85 %"],["75","≈ 94 %","≈ 90 %"],["100","≈ 97 %","≈ 96 %"]],"li":["Werte ungefähr aus der Kurve im Skript (S. 12) abgelesen"]}],"a":[{"li":["**Sauerstoffsättigung (SpO₂)** = Anteil der Hämoglobinmoleküle (in %), die mit O₂ besetzt sind","Übergang ins Plateau bei etwa **90 % Sättigung** und einem **pO₂ von etwa 60 mmHg**","Im Plateau sind fast alle Hb-Moleküle besetzt → **zusätzlicher Sauerstoff erhöht die Sättigung kaum noch**"]}],"q":[["R1A","1–2"],["AG","8–9, 12"]],"korr":["Ergänzt: der pO₂ am Übergang (ca. **60 mmHg**, abgelesen aus der Kurve im Skript) fehlte in der Vorlage."]},{"id":"r1-a4","nr":"III.4","thema":"atemgase","f":"Was ist der Haldane-Effekt? Wieso ist er beim Gasaustausch in der Lunge vorteilhaft?","a":[{"li":["**Haldane-Effekt:** bindet O₂ an Hämoglobin, sinkt dessen **Affinität zu CO₂** → CO₂ wird leichter abgegeben","In der Lunge ist viel O₂ → das Hb nimmt O₂ auf und gibt dadurch **zusätzlich CO₂ ab** (die CO₂-Bindungskurve wird flacher)"],"m":"**Vorteil:** je mehr O₂ in der Lunge aufgenommen wird, desto mehr CO₂ kann gleichzeitig abgegeben werden. Gegenstück zum Bohr-Effekt im Gewebe."}],"q":[["R1A",2],["AG","8, 11–12"]]},{"id":"r1-a5","nr":"III.5","thema":"atemgase","f":"Welche Faktoren im arbeitenden Muskel beeinflussen die Sauerstoffaffinität des Hämoglobins? In welche Richtung verschiebt sich die Bindungskurve?","abb":[{"h":"Sauerstoffbindungskurve (nachgezeichnet)","tc":[["pO₂ (mmHg)","Sättigung normal","Rechtsverschiebung (Bohr)"],["20","≈ 35 %","≈ 25 %"],["27","≈ 50 % (P50)","≈ 40 %"],["40","≈ 75 %","≈ 65 %"],["60","≈ 90 %","≈ 85 %"],["75","≈ 94 %","≈ 90 %"],["100","≈ 97 %","≈ 96 %"]],"li":["Werte ungefähr aus der Kurve im Skript (S. 12) abgelesen"]}],"a":[{"li":["Im arbeitenden Muskel entstehen **CO₂** und **H⁺** (pH sinkt), es wird **wärmer**, und **2,3-DPG** (aus einem Seitenweg der Glykolyse) wirkt ebenfalls","Sie senken die O₂-Affinität des Hb (**Bohr-Effekt**) → **Rechtsverschiebung**: für dieselbe Sättigung braucht es einen höheren pO₂","Folge: das Hb gibt im Muskel **mehr O₂ ab** – die angelieferte O₂-Menge steigt"],"tc":[["Linksverschiebung (Affinität ↑)","Rechtsverschiebung (Affinität ↓)"],["akute Alkalose, pCO₂ ↓, Temperatur ↓, wenig 2,3-DPG, CO-Hb, Met-Hb","akute Azidose, pCO₂ ↑, Temperatur ↑, viel 2,3-DPG"]]}],"q":[["R1A",3],["AG","9–12"]]},{"id":"r1-a6","nr":"III.6","thema":"atemgase","f":"Welche vier biochemischen Möglichkeiten gibt es für den Transport von Kohlendioxid im Blut?","a":[{"tb":[["Weg","Anteil","Wie"],["1. physikalisch gelöst","ca. 10 %","geht direkt aus dem Gewebe durch die Kapillarwand ins Plasma"],["2. Bicarbonat im Plasma","gering","CO₂ + H₂O → H₂CO₃ → HCO₃⁻ + H⁺ – ohne Enzym nur **langsam**"],["3. Bicarbonat aus dem Erythrozyten","Hauptweg (Bicarbonat gesamt ca. 70 %)","**Carboanhydrase** im Erythrozyten macht es **sehr schnell**; H⁺ bindet am Hb (Bohr), HCO₃⁻ geht im Austausch gegen Cl⁻ ins Plasma"],["4. Carbaminohämoglobin","ca. 20 %","CO₂ direkt an Hämoglobin gebunden"]]}],"q":[["R1A",3],["AG","5, 7–8"]]},{"id":"r1-a7","nr":"III.7","thema":"atemgase","f":"Welche Unterschiede finden sich im pO₂ und pCO₂ in der Ausatemluft verglichen zur Alveolarluft? Wie kommen sie zustande? Wo ist im Blutkreislauf der pCO₂ am niedrigsten und wo am höchsten?","a":[{"tc":[["","Einatemluft","Ausatemluft","Alveolarluft"],["pO₂ (mmHg)","156","115","100"],["pCO₂ (mmHg)","0,3","33","40"]],"li":["In der **Alveole** ist der pO₂ noch niedriger und der pCO₂ höher als in der Ausatemluft","Grund: **Totraum** – von 500 ml Atemzug erreichen nur ca. 350 ml die Alveolen; die 150 ml aus Nase, Rachen, Luftröhre und Bronchien nehmen nicht am Gasaustausch teil und mischen sich beim Ausatmen mit der Alveolarluft"]},{"h":"pCO₂ im Blutkreislauf","li":["**Am niedrigsten:** im **arteriellen** Blut, das die Lunge verlässt (ca. 40 mmHg, gleich der Alveolarluft)","**Am höchsten:** im **venösen** Blut aus stoffwechselaktivem Gewebe, z. B. arbeitender Muskel (gemischt-venös ca. 46 mmHg)"]}],"q":[["R1A",3],["AG",3]],"korr":["„Im Blutkreislauf ist der pCO₂ in der Ausatemluft am geringsten und in der Alveolarluft am höchsten“ beantwortet die Frage nicht – gefragt ist das **Blut**: niedrigster Wert arteriell, höchster venös aus dem Gewebe (Werte aus Lehrbüchern, nicht im Skript)."]},{"id":"r1-a8","nr":"III.8","thema":"atemgase","f":"Was versteht man unter Sauerstoffaffinität? Was ist der Bohr-Effekt, wodurch wird er ausgelöst, und welchem pO₂ entspricht eine Sättigung von 90 % bei aktivem Bohr-Effekt?","abb":[{"h":"Sauerstoffbindungskurve (nachgezeichnet)","tc":[["pO₂ (mmHg)","Sättigung normal","Rechtsverschiebung (Bohr)"],["20","≈ 35 %","≈ 25 %"],["27","≈ 50 % (P50)","≈ 40 %"],["40","≈ 75 %","≈ 65 %"],["60","≈ 90 %","≈ 85 %"],["75","≈ 94 %","≈ 90 %"],["100","≈ 97 %","≈ 96 %"]],"li":["Werte ungefähr aus der Kurve im Skript (S. 12) abgelesen"]}],"a":[{"li":["**Sauerstoffaffinität** = Bestreben des Hämoglobins, sich mit O₂ zu verbinden","**Bohr-Effekt** (Christian Bohr, 1904): **CO₂ und H⁺** (und 2,3-DPG) senken die O₂-Affinität → O₂ wird im Gewebe leichter abgegeben","Mechanismus: H⁺ bzw. CO₂ binden an Aminosäuren des Hb → Ladung und Wasserstoffbrücken ändern sich → Hb wird in der **T-Form** (geringe Affinität) statt der R-Form stabilisiert","Gereinigtes Hb (ohne Erythrozyt) hat eine höhere Affinität – im Erythrozyten senkt **2,3-DPG** sie"],"m":"**90 % Sättigung:** normal bei ca. **60 mmHg**; bei aktivem Bohr-Effekt (Rechtsverschiebung) braucht es einen **höheren pO₂** – laut Kurve im Skript etwa **75 mmHg**."}],"q":[["R1A","3–4"],["AG","9–12"]],"korr":["„90 × 7,42 (760 − 18) = 667,8 mmHg“ ist keine sinnvolle Rechnung (das wären 90 % von 742 mmHg). Der Wert wird aus der **Bindungskurve abgelesen**: rechtsverschoben etwa 75 mmHg statt 60 mmHg."]}]},{"id":"razzia2","titel":"Razzia 2","razzia":2,"kurz":"Energiestoffwechsel, Leistungsphysiologie, Muskelkontraktion und Muskelkater","fragen":[{"id":"r2-1","nr":"I","thema":"energie","f":"Warm-up: Benenne die Stoffwechselwege des Energiestoffwechsels (Kohlenhydrate, Fette, Eiweiße) – Fachwörter, keine Formeln.","a":[{"h":"Drei Schritte der Energiegewinnung","tb":[["Schritt","Was passiert","Wo","Energie"],["1. Verdauung","Aufspaltung durch Speichel, Magensäure, Galle und Pankreassaft","Mund, Magen, Zwölffingerdarm","keine"],["2. Umwandlung in Acetylgruppen","Kohlenhydrate: **Glykolyse**, Fette: **β-Oxidation** → Acetyl-CoA","Glykolyse im Zytosol, β-Oxidation in den Mitochondrien","geringe Menge"],["3. Citratzyklus und Atmungskette","Acetyl-CoA wird im **Citratzyklus** zu CO₂ abgebaut; die Elektronen aus NADH+H⁺ und FADH₂ gehen in der **Atmungskette** auf O₂ über, dabei entsteht Wasser","Mitochondrium","aerob **32 ATP**, anaerob nur **2 ATP** je Glukose"]]},{"h":"Citratzyklus","li":["Im **Mitochondrium**, **8 Schritte** in 2 Teilen","**Teil 1:** Acetyl-CoA wird auf das Trägermolekül Oxalacetat übertragen und zu 2 CO₂ umgewandelt","**Teil 2:** Oxalacetat wird wieder regeneriert"],"fl":{"s":[["Acetyl-CoA + Oxalacetat"],["Abbau, 2 CO₂ werden frei"],["Oxalacetat regeneriert"]],"loop":true}},{"h":"Die Fachwörter","tc":[["Fachwort","Bedeutung"],["Glykolyse","Glukose → Pyruvat"],["Glykogenese","Glukose → Glykogen (Speicher füllen)"],["Glykogenolyse","Glykogen → Glukose"],["Gluconeogenese","Glukose neu bilden aus Aminosäuren (und Laktat), kostet Energie"],["Lipogenese","Glukose und Fettsäuren → Fettspeicher"],["Lipolyse","Fettspeicher abbauen"],["β-Oxidation","Fettsäuren → Acetyl-CoA"],["Ketonkörperbildung","bei Glukosemangel in der Leber aus Acetyl-CoA"]],"q":[["MT1",10],["MT2",1]]},{"h":"Aufgaben der Nährstoffe","tb":[["Nährstoff","Aufgaben"],["Kohlenhydrate","Energiequelle · AB0-/D-Blutgruppen · Rückgrat der DNA · Schleime · Knorpel"],["Fette","größter Energiespeicher · Lipogenese (Fettzellen können sich 1000-fach vergrößern) · Biomembranen · Steroidhormone"],["Proteine","Aktin und Myosin · Hämoglobin · Antikörper · Na⁺/K⁺-ATPase · Hormone"]],"li":["**Gesättigte Fettsäuren** (alle C-Atome mit H besetzt): bei Raumtemperatur fest – Butter, Schmalz","**Ungesättigte Fettsäuren** (H-Atome fehlen → Doppelbindung): flüssig – Fisch, Oliven, Avocado, Nüsse"],"q":[["MT1","8–9"]]},{"h":"Gehirn, Fasten, Überschuss","li":["**Gehirn:** nur Glukose (und Ketonkörper) – Fettsäuren passieren die Blut-Hirn-Schranke nicht → bei Unterzucker droht Bewusstlosigkeit","**Fasten:** Lipolyse, Glykogenolyse und Gluconeogenese halten den Glukosevorrat","**Überschuss:** Glukose füllt erst die Glykogenspeicher (Glykogenese), dann die Fettspeicher (Lipogenese); überschüssige Aminosäuren → Harnstoff im Urin"],"q":[["MT1",10]]}],"q":[["R2",1],["MT1",7]],"korr":["„Anaerobe Glykolyse: 2 ADP“ → **2 ATP** (Muskel und Training 1, S. 15: pro mol Glukose nur 2 mol ATP).","„Umwandlung in Acetylgruppen im Zytosol der Mitochondrien“ → Glykolyse im **Zytosol**, β-Oxidation und Bildung von Acetyl-CoA in den **Mitochondrien** (Teil 1, S. 13–14).","Schreibfehler: „Rückgrad der DANN“ → Rückgrat der **DNA**, „Coencym“ → Coenzym, „Citrazyklus“ → Citratzyklus.","„Ungesättigte FS: fehlt H⁺“ → es fehlen **H-Atome**, keine H⁺-Ionen; dadurch entsteht die Doppelbindung."]},{"id":"r2-2","nr":"II.1","thema":"energie","f":"Wofür benötigt der Organismus Energie? Was sind Vor- und Nachteile des ATP-, des Glykogen- und des Fettspeichers?","a":[{"h":"Wofür Energie?","li":["**Mechanische Arbeit:** Muskelkontraktion (Skelett-, glatte und Herzmuskulatur)","**Transport** von Molekülen durch die Zellmembran, z. B. Na⁺/K⁺-ATPase","**Synthese** von Makromolekülen, z. B. Hämoglobin, Proteine im rER","**Katabolismus** = Abbau von Nährstoffen, Energie wird frei · **Anabolismus** = Aufbau (z. B. Proteinsynthese), verbraucht ATP"],"m":"„-ase“ = Enzym, das sein Substrat abbaut: Lipase baut Fett ab, ATPase spaltet ATP."},{"h":"Die drei Speicher","tb":[["Speicher","Vorteil","Nachteil"],["ATP","sofort verfügbar, maximale Leistung","winzig: nach etwa **6 s** verbraucht"],["Glykogen (⅓ Leber, ⅔ Muskel)","schnell mobilisierbar, mit und ohne O₂ nutzbar → mittlere bis hohe Intensität","bindet Wasser (1 g Glykogen ≈ 2,7 g Wasser) → schwer, wenig Energie pro Gramm, begrenzt"],["Fett","riesiger, leichter Speicher (wasserfrei, mehr als doppelte Energiedichte)","nur langsam und nur mit O₂ verwertbar → nicht für hohe Intensität"]]},{"h":"Größe der Speicher","br":{"s":[["Triglyceride (11 kg)",420000,"420.000 kJ"],["Protein",100000,"100.000 kJ"],["Glykogen",2500,"2.500 kJ"],["Blutglukose",170,"170 kJ"]],"c":"Energiespeicher eines 70 kg schweren Menschen"},"li":["ATP-Umsatz: in Ruhe etwa **40 kg ATP pro Tag**, bei 2 h Dauerlauf 60 kg – ATP muss ständig neu gebildet werden"],"q":[["MT1",4]]}],"q":[["R2",2],["MT1","3–5"]],"korr":["ATP-Vorrat „1–2 Sekunden“ → laut Skript ist ATP nach etwa **6 s** verbraucht (Teil 1, S. 3–4: der Sprinter hat 5–6 s ATP).","Katabolismus und Anabolismus sind in der Vorlage (und im Skript S. 5) vermischt. Katabolismus = Abbau mit Energiegewinn, Anabolismus = Aufbau mit Energieverbrauch."]},{"id":"r2-3","nr":"II.2","thema":"energie","f":"Welche aeroben und welche anaeroben Stoffwechselwege zur Energiegewinnung kennen Sie? Was sind Vor- und Nachteile?","a":[{"h":"Überblick","tb":[["Weg","Woher","Vorteil","Nachteil"],["Anaerob-**alaktazid**","ATP und **Kreatinphosphat**","sofort, maximale Leistung","sehr klein: ATP ~6 s, mit Kreatinphosphat bis knapp 1 min"],["Anaerob-**laktazid** (anaerobe Glykolyse)","Glukose → Pyruvat → **Laktat**","schneller als aerob, überbrückt den Start","nur **2 ATP** je Glukose; H⁺ fallen an → Übersäuerung, Schmerz"],["**Aerobe Glykolyse**","Glukose → Acetyl-CoA → Citratzyklus → Atmungskette","**32 ATP** je Glukose, kein Laktat","braucht O₂ und Anlaufzeit, liefert langsamer"],["**β-Oxidation**","Fettsäuren → Acetyl-CoA (Carnitin bringt sie ins Mitochondrium)","fast unbegrenzter Vorrat → Stunden Ausdauer","geringste Energieflussrate, viel O₂ nötig → nur geringere Intensität"]]},{"h":"Zeitlicher Ablauf unter Belastung","fl":{"s":[["ATP","reicht etwa 6 s"],["Kreatinphosphat","regeneriert ATP, bis knapp 1 min"],["Anaerobe Glykolyse","überbrückt, begrenzt durch H⁺ und Schmerz"],["Aerobe Glykolyse","liefert ab 1–2 min reichlich Energie"],["Fettsäureoxidation","läuft nach knapp 60 min voll an"]]},"q":[["MT1",3]]},{"h":"Wichtige Details","li":["Glykolyse im **Zytoplasma**: verbraucht 2 ATP, bildet 4 → netto **2 ATP** + 2 NADH+H⁺","β-Oxidation: **4 Schritte** im Mitochondrium; liefert FADH₂ und NADH+H⁺, bildet aber **selbst kein ATP**","Laktat ist das **Anion** der Milchsäure – gebildet wird Laktat, nicht Milchsäure","Bei O₂-Mangel steht die Atmungskette still → NADH+H⁺ staut sich → Citratzyklus, β-Oxidation und Glykolyse werden gehemmt"],"q":[["MT1","13–15"]]},{"m":"Hohe Intensität geht nur kurz, hohe Ausdauer nur bei geringerer Intensität – deshalb läuft der Sprinter nicht so lange und der Marathonläufer nicht so schnell."}],"q":[["R2",3],["MT1",3],["MT1","13–15"]],"korr":["Alaktazide Dauer „5–15 s“ → Skript: ATP ~6 s, mit Kreatinphosphat bis knapp 1 min (Teil 1, S. 3). Viele Lehrbücher nennen kürzere Zeiten – im Zweifel die Skriptwerte lernen.","Fettspeicher „bei 75 kg“ → Skript: bei **70 kg** Körpergewicht 11 kg Triglyceride = 420.000 kJ (Teil 1, S. 14).","„FADH“ → **FADH₂**."]},{"id":"r2-4","nr":"II.3","thema":"muskelkater","f":"Was ist das physiologische Korrelat von Muskelermüdung und Muskelschmerzen? Warum ist die Milchsäuretheorie sicher falsch?","a":[{"h":"Muskelermüdung","li":["Mit zunehmender Anstrengung häufen sich im Muskel **Protonen (H⁺), Laktat und extrazelluläres ATP** an","Rezeptoren an afferenten Nervenendigungen messen sie (**ASIC** für H⁺, **TRPV1**, **P2X** für ATP) und melden frequenzkodiert ans ZNS","**Nur die Kombination** löst eine Empfindung aus (Tabelle)","Die Empfindung entsteht **im Gehirn**, nicht im Muskel → Schutzfunktion vor Überlastung","Dazu im Muskel: Energiemangel (ATP, Kreatinphosphat, Glykogen sinken), Übersäuerung hemmt Enzyme (z. B. Phosphofruktokinase) und die Ca²⁺-Freisetzung"],"tc":[["H⁺","ATP","Laktat","Empfindung"],["erhöht","–","–","keine"],["–","erhöht","–","keine"],["–","–","erhöht","keine"],["mäßig","mäßig","mäßig","**Ermüdung**"],["hoch","hoch","hoch","**Schmerz**"]],"q":[["MTG","19–20"],["MT1",14]]},{"h":"Muskelschmerz (Muskelkater, DOMS)","fl":{"s":[["Exzentrische (bremsende) Belastung"],["Mikrotraumen","Z-Streifen verbreitert oder aufgelöst, Membran geschädigt, Ca²⁺ strömt ein"],["Entzündung (Tag 1–3)","Makrophagen und Neutrophile räumen ab, Ödem, Gewebedruck steigt"],["Mediatoren","Bradykinin, Prostaglandin E₂, K⁺ sensibilisieren die Schmerzfasern"],["Schmerz","Höhepunkt nach 24–72 h, erholt nach 5–7 Tagen"]]},"q":[["MTG",20],["MTG",24]]},{"h":"Warum die Milchsäuretheorie falsch ist","li":["**Zeitlich passt es nicht:** Laktat ist kurz nach der Belastung wieder verwertet (Herz, Leber, Cori-Zyklus), Muskelkater kommt erst nach 24–72 h","**Es entsteht keine Milchsäure:** gebildet wird **Laktat** (das Anion). Laktat + H⁺ = Milchsäure","**Die H⁺ stammen aus der ATP-Spaltung** bei den Querbrückenzyklen, nicht aus Milchsäure","**Muskelkater ist eine kleine Verletzung mit Entzündung**, kein „Säurekater“"],"q":[["MT1","15–16"],["MTG",19]]},{"h":"Pufferung","li":["**Bicarbonatpuffer:** H⁺ + HCO₃⁻ → H₂CO₃ → H₂O + **CO₂**, das CO₂ wird abgeatmet"],"m":"Laktat ≠ Milchsäure. Nicht Laktat säuert den Muskel an, sondern freie H⁺."}],"q":[["R2",4],["MTG","19–20"],["MTG",24],["MT1",15]],"korr":["„24–73 h“ → **24–72 h** (Grafiken S. 24).","Ergänzt nach Skript: Ermüdung entsteht erst durch die **Kombination** von H⁺, Laktat und ATP und wird im Gehirn empfunden (Grafiken S. 19–20).","Der Bicarbonatpuffer wirkt nicht nur „in der aeroben Energiegewinnung“, sondern immer, wenn H⁺ anfallen.","Formeln richtig geschrieben: H₂CO₃, H₂O, CO₂ (statt H²CO³, CO²)."]},{"id":"r2-5","nr":"II.4","thema":"training","f":"Wie entsteht die periphere Insulinresistenz und warum kann man mit Sport dem Auftreten eines Diabetes mellitus Typ 2 vorbeugen?","a":[{"h":"Hintergrund","li":["Die **Skelettmuskulatur** nimmt etwa **85 %** der aufgenommenen Glukose auf","**Typ 2** (bei uns ~90 %): Insulin ist anfangs sogar **erhöht**, wirkt aber nicht (Insulinresistenz)","**Typ 1**: autoimmune Zerstörung der β-Zellen → kein Insulin"]},{"h":"Entstehung","fl":{"s":[["Zu viele Triglyceride","Adipositas, viszerales Bauchfett, viele freie Fettsäuren"],["Fett in Muskel- und Leberzellen","wird durch β-Oxidation nicht genug abgebaut"],["DAG und Ceramide entstehen","Fett-Zwischenprodukte, aktivieren z. B. Proteinkinase C"],["Insulinsignal blockiert","Insulin bindet, aber der Rezeptor „wirkt“ nicht"],["Weniger GLUT4 in der Membran","Glukose bleibt im Blut, Blutzucker steigt"],["Pankreas schüttet mehr Insulin aus","und erschöpft sich auf Dauer"]]},"li":["Hoher Blutzucker bindet an Oberflächenproteine des Endothels und schädigt die Gefäßwände"]},{"h":"Warum Sport vorbeugt","li":["Muskelarbeit verbraucht ATP → AMP steigt → **AMPK** wird aktiviert","AMPK steigert die **β-Oxidation** → die Fett-Zwischenprodukte werden abgebaut → **Ursache beseitigt**, Insulin wirkt wieder","Muskelarbeit bringt GLUT4 auch **ohne Insulin** in die Membran → der Muskel nimmt Glukose direkt auf","Intensives Training → **HIF** → mehr Glykolyse-Enzyme und mehr Glukosetransporter","Mehr Mitochondrien (+50–100 % nach etwa 6 Wochen) und weniger Fettmasse"],"m":"Sport umgeht die Insulinresistenz (AMPK statt Insulin) und beseitigt ihre Ursache (Fettabbau durch β-Oxidation)."}],"q":[["R2",5],["MT2","8–10"]],"korr":["Ergänzt nach Skript: die Fett-Zwischenprodukte heißen **DAG und Ceramide** (Teil 2, S. 10).","Die Wirkdauer „24 bis 48 Stunden nach dem Training“ steht nicht in den Unterlagen – deshalb weggelassen."]},{"id":"r2-6","nr":"II.5","thema":"training","f":"Wie berechnet sich der Hämatokrit? Wie verändern sich beide Komponenten beim Höhentraining?","a":[{"h":"Formel","m":["**Hämatokrit = Erythrozytenvolumen ÷ Blutvolumen**","Blutvolumen = Erythrozytenvolumen + Plasmavolumen"],"li":["Beispiel: 36 ml/kg Erythrozyten und 54 ml/kg Plasma → 36 ÷ 90 = **40 %**"]},{"h":"Höhentraining","tb":[["Phase","Erythrozytenvolumen","Plasmavolumen","Hämatokrit"],["Akut (Stunden bis Tage)","gleich","sinkt (Flüssigkeitsverlust und -verschiebung)","steigt"],["Langfristig (Wochen)","steigt (EPO → Blutbildung)","normalisiert sich","bleibt erhöht"]],"fl":{"s":[["Weniger O₂ in der Höhe","pO₂ sinkt"],["Niere schüttet EPO aus"],["Mehr Erythrozyten aus dem Knochenmark"],["Hämatokrit steigt","mehr O₂-Transportkapazität"]]},"li":["Nachteil: mit steigendem Hämatokrit **steigt die Viskosität** → Gefahr von „Verstopfungen“ in kleinen Kapillaren","Es gibt Hinweise, dass EPO das Wachstum von Tumorzellen anregt"],"q":[["MT2",7]]},{"h":"Ausdauertraining ohne Höhe","li":["Plasmavolumen steigt etwas stärker als das Erythrozytenvolumen → Hämatokrit sinkt leicht („**Sportleranämie**“), dafür bessere Durchblutung in den Kapillaren","Direkt nach dem Wettkampf ist der Hämatokrit durch den Flüssigkeitsverlust erhöht (Sport: 1–2 l pro Stunde)"],"tc":[["Gruppe","Blut (ml/kg)","Erythrozyten (ml/kg)","Plasma (ml/kg)","Hk (%)"],["Untrainiert","77","30","47","45,0"],["Leichtathletik","105","40","65","43,4"],["Radrennsport","107","46","61","47,2"],["Triathlon","107","40","67","43,2"]],"m":"Die Hk-Werte der Tabelle sind im Venenblut gemessen. Aus den ml/kg-Werten gerechnet kommt etwas weniger heraus (30 ÷ 77 ≈ 39 %). In einer Rechenaufgabe immer mit der Formel rechnen.","q":[["MTG",15],["MT2","6–7"]]}],"q":[["R2",5],["MTG",15],["MT2","6–7"]],"korr":["Hinweis zum Skript (Teil 2, S. 7): Dort steht, mit steigendem Hämatokrit „sinkt“ die Viskosität. Richtig ist: sie **steigt** – deshalb die Gefahr von Verstopfungen."]},{"id":"r2-7","nr":"II.6a","thema":"energie","f":"Abbildung (Howley 1995): Aus welchen Nährstoffen bezogen die Probanden zu Beginn des Experiments ihre Energie?","abb":[{"h":"Abbildung (nachgezeichnet)","li":["Spiroergometrie auf dem Laufband, Steigung 0–12,5 %. Gemessen: O₂-Aufnahme (V'O₂) und RQ (RER).","Beschriftung im Original: „High value due to buffering of lactic acid“"],"tc":[["Steigung","V'O₂ (l/min, ca.)","RQ (ca.)"],["0 %","2,3","0,88"],["2,5 %","2,6","0,90"],["5 %","2,9","0,95"],["7,5 %","3,2","1,03"],["10 %","3,5","1,10"],["12,5 %","3,5","1,20"]]}],"a":[{"li":["Zu Beginn liegt der **RQ bei etwa 0,88** → **Mischstoffwechsel** aus Kohlenhydraten und Fetten","RQ 0,7 = reine Fettverbrennung, RQ 1,0 = reine Kohlenhydratverbrennung","0,88 liegt näher an 1,0 → etwa **60 % Kohlenhydrate und 40 % Fett**"],"tc":[["Nährstoff","Rechnung","RQ"],["Fett (Palmitat)","16 CO₂ ÷ 23 O₂","0,7"],["Kohlenhydrat (Glukose)","6 CO₂ ÷ 6 O₂","1,0"]],"m":"RQ = abgegebenes CO₂ ÷ aufgenommenes O₂ (V'CO₂ ÷ V'O₂). Fettverbrennung braucht mehr O₂."}],"q":[["R2",6],["MT1",2],["MT1",12]]},{"id":"r2-8","nr":"II.6b","thema":"energie","f":"Der RQ ist, ausgehend von der Verbrennung der Nährstoffe, maximal 1. Wie kommt es, dass hier Werte bis 1,2 erreicht werden? Argumentieren Sie von der Definition des RQ aus.","abb":[{"h":"Abbildung (nachgezeichnet)","li":["Spiroergometrie auf dem Laufband, Steigung 0–12,5 %. Gemessen: O₂-Aufnahme (V'O₂) und RQ (RER).","Beschriftung im Original: „High value due to buffering of lactic acid“"],"tc":[["Steigung","V'O₂ (l/min, ca.)","RQ (ca.)"],["0 %","2,3","0,88"],["2,5 %","2,6","0,90"],["5 %","2,9","0,95"],["7,5 %","3,2","1,03"],["10 %","3,5","1,10"],["12,5 %","3,5","1,20"]]}],"a":[{"li":["**Definition:** RQ = V'CO₂ ÷ V'O₂. Bei reiner Verbrennung höchstens 1,0 (Glukose: 6 CO₂ auf 6 O₂)","Wird **mehr CO₂ abgeatmet, als der Stoffwechsel bildet**, steigt der Quotient über 1"]},{"h":"Woher das zusätzliche CO₂ kommt","fl":{"s":[["Belastung über der anaeroben (Laktat-)Schwelle"],["Anaerobe Glykolyse liefert zusätzlich Energie","Laktat und H⁺ fallen an"],["Bicarbonat puffert die H⁺","H⁺ + HCO₃⁻ → H₂CO₃ → H₂O + CO₂"],["Zusätzliches „nicht-metabolisches“ CO₂","dazu atmet man verstärkt ab (Hyperventilation)"],["V'CO₂ steigt stärker als V'O₂","RQ über 1, hier bis 1,2"]]}},{"li":["Genau genommen misst man am Mund die **RER** (respiratory exchange ratio). Sie zeigt den Gasaustausch, nicht nur die Verbrennung in der Zelle"],"m":"RQ über 1 heißt nicht „mehr als 100 % Kohlenhydrate“, sondern: zusätzliches CO₂ aus der Pufferung."}],"q":[["R2",6],["MT1",2],["MT1",15]],"korr":["Über der Schwelle läuft die aerobe Energiegewinnung **weiter** – die anaerobe Glykolyse kommt **dazu** (Vorlage: „schaltet um“).","Die Begründung ist jetzt direkt aus der Definition (CO₂ ÷ O₂) abgeleitet, wie in der Frage verlangt."]},{"id":"r2-9","nr":"III.1","thema":"muskel","f":"Erläutern Sie den Begriff „motorische Endplatte“ und in diesem Zusammenhang die Pathophysiologie der Myasthenia gravis. Welches Therapieprinzip wird angewendet?","a":[{"h":"Motorische Endplatte","li":["Neuromuskuläre Synapse: Verbindung zwischen **Motoneuron** und **Muskelfaser**, Überträgerstoff **Acetylcholin (ACh)**"],"fl":{"s":[["Aktionspotenzial im Motoneuron"],["ACh wird in den synaptischen Spalt freigesetzt"],["ACh bindet an ACh-Rezeptoren","auf dem Sarkolemm (postsynaptische Membran)"],["Kationenkanal öffnet sich","Aktionspotenzial in der Muskelfaser"],["Ca²⁺ aus dem sarkoplasmatischen Retikulum","Kontraktion"]]}},{"li":["Danach: ACh-Esterase spaltet ACh, bzw. ACh wird ins Nervenende zurückgepumpt (Reuptake, verbraucht Energie)"]},{"h":"Myasthenia gravis","li":["„Schwere Muskelschwäche“: **Autoimmunerkrankung** der motorischen Endplatte",["**Antikörper gegen ACh-Rezeptoren** (Typ-II-Reaktion nach Coombs und Gell):","Rezeptoren blockiert – ACh kann nicht andocken","Rezeptoren abgebaut bzw. ins Zellinnere aufgenommen","Komplement zerstört die postsynaptischen Falten"],"Folge: weniger Rezeptoren → weniger Ca²⁺-Freisetzung → weniger Kontraktion → weniger Kraft"]},{"h":"Therapie","tb":[["Prinzip","Wie","Beispiel"],["Symptomatisch","ACh-Esterase hemmen → mehr und länger ACh im Spalt gleicht die geringere Rezeptorzahl aus","Pyridostigmin"],["Immunsuppressiv (ursächlich)","Entzündung und Antikörperbildung bremsen","Kortison, Azathioprin"],["Akut","Antikörper aus dem Blut entfernen bzw. abfangen","Plasmapherese, Immunglobuline i. v."]]}],"q":[["R2",7],["MT2","11–12"]]},{"id":"r2-10","nr":"III.2","thema":"muskel","f":"Definieren Sie den Begriff „motorische Einheit“. Geben Sie die anatomische Lokalisation der jeweiligen Komponenten an.","a":[{"m":"Motorische Einheit = ein **α-Motoneuron** + **alle Muskelfasern**, die es innerviert. Feuert das Motoneuron, kontrahieren alle seine Fasern gleichzeitig."},{"h":"Lage der Komponenten","tb":[["Komponente","Lage"],["Zellkörper des α-Motoneurons","Vorderhorn der grauen Substanz des Rückenmarks; für Kopf und Hals: motorische Hirnnervenkerne im Hirnstamm"],["Axon","verlässt das Rückenmark über die Vorderwurzel (Radix anterior), läuft im peripheren Nerv zum Muskel"],["Motorische Endplatte","zwischen der Endaufzweigung des Axons und dem Sarkolemm der Muskelfaser"],["Muskelfasern","im Skelettmuskel, mosaikartig verteilt (nicht alle nebeneinander)"]]},{"li":["Ein Motoneuron versorgt mit seinen Ästen **bis zu 100 Muskelfasern** (Skript); jede Faser hat nur **ein** Motoneuron","Ein Muskel hat viele motorische Einheiten mit verschiedenen Fasertypen","**Kleine Motoneurone** (schon bei geringem Reiz): v. a. Typ-I-Fasern, fein dosierte Bewegungen · **große Motoneurone** (starker Reiz): mehr Fasern, v. a. Typ II, hohe Kraft"],"q":[["MT2","11–12"]]}],"q":[["R2",7],["MT2","10–12"]],"korr":["Hinweis: Das Skript nennt „bis zu 100“ Fasern pro Motoneuron. In großen Beinmuskeln sind es laut Lehrbüchern weit über 1000, in Augenmuskeln nur wenige."]},{"id":"r2-11","nr":"III.3","thema":"muskel","f":"Erläutern Sie die Abläufe des Querbrückenzyklus.","a":[{"li":["Aktin (dünn) und Myosin (dick) gleiten ineinander → das Sarkomer verkürzt sich (um etwa 0,4 µm)","Antrieb: **ATP** · Steuerung: **Ca²⁺**"]},{"h":"Die Schritte","fl":{"s":[["Ca²⁺ wird frei","aus dem sarkoplasmatischen Retikulum, bindet an **Troponin**"],["Bindungsstellen werden frei","Troponin verschiebt **Tropomyosin** vom Aktin"],["Bindung","der gespannte Myosinkopf (90°) bindet an Aktin"],["Kraftschlag","Phosphat und ADP gehen ab, der Kopf kippt von 90° auf 45° und zieht das Aktin mit"],["Lösen","neues ATP bindet → der Kopf löst sich vom Aktin"],["Spannen","Myosin-ATPase spaltet ATP → Kopf wieder auf 90° vorgespannt"]],"loop":true}},{"h":"Was ATP verbraucht","li":["1. ATP-Spaltung zum Vorspannen des Kopfes","2. Zurückpumpen von Ca²⁺ ins sarkoplasmatische Retikulum","3. an der Endplatte: Wiederaufnahme von ACh","Ist das Ca²⁺ weg, deckt Tropomyosin das Aktin wieder ab → Erschlaffung","Jeder Kopf macht etwa **5 Kraftschläge pro Sekunde**; die Köpfe arbeiten zeitversetzt"],"m":"**Totenstarre:** kein ATP mehr → der Myosinkopf kann sich nicht vom Aktin lösen. Beginn nach 1–2 h an den Lidern, voll nach 6–12 h, löst sich nach 24–48 h."}],"q":[["R2",7],["MT2","3–5"]],"korr":["„Myosinkopf kippt durch Energieverlust“ → genauer: die beim Vorspannen gespeicherte Energie wird beim Kraftschlag frei."]},{"id":"r2-12","nr":"III.4","thema":"muskel","f":"Stellen Sie den Zusammenhang von Kraft und Kontraktionsgeschwindigkeit dar (Zeichnung) und erläutern Sie den Einfluss eines Geschwindigkeits- bzw. Krafttrainings.","a":[{"h":"Kraft-Geschwindigkeits-Relation (Hill-Kurve)","li":["**Je schneller die Kontraktion, desto weniger Kraft** – und umgekehrt (inverser Zusammenhang, Hyperbel)","Hill-Gleichung: **(F + a) · (v + b) = konstant**","Höchste Geschwindigkeit ohne Last (v max); bei maximaler Last ist v = 0 → **isometrische** Maximalkraft","**Exzentrisch** (Muskel wird unter Spannung gedehnt, bremst) ist sogar **mehr** Kraft möglich als isometrisch","Leistung **P = F · v** – eine Übung geht mit hohem Gewicht oder mit schneller Bewegung",["**So zeichnest du sie:**","x-Achse Kraft (Last), y-Achse Geschwindigkeit","Kurve fällt von v max (Last 0) erst steil, dann flacher bis F max (v = 0)","exzentrisch läuft sie unter der x-Achse weiter (mehr Kraft als F max)"]],"br":{"s":[["exzentrisch",90,"≈ 90 %"],["isometrisch",80,"≈ 80 %"],["konzentrisch",60,"≈ 60 %"]],"c":"Anteil der Maximalkraft je Kontraktionsform laut Skript. 100 % nur bei Todesangst oder unter Drogen."},"q":[["MT2","13–14"]]},{"h":"Einfluss des Trainings","tb":[["Training","Was sich verbessert","Wo sich die Kurve verschiebt"],["Krafttraining (hohe Last)","Maximalkraft: mehr kontraktile Proteine (Hypertrophie über mTOR, v. a. Typ-II-Fasern), mehr rekrutierte motorische Einheiten","am Kraft-Ende nach außen: mehr Kraft bei langsamer Bewegung"],["Geschwindigkeits- bzw. Schnellkrafttraining (geringe Last, schnell)","Kontraktionsgeschwindigkeit: schnellere Rekrutierung, höhere Impulsfrequenz","am Geschwindigkeits-Ende nach oben: schneller bei leichter Last"]],"li":["Beides ist trainierbar, der inverse Zusammenhang bleibt","Krafttraining macht auch bei mittleren und hohen Lasten schneller, weil dieselbe Last einen kleineren Teil der Maximalkraft ausmacht"],"q":[["MT2",8],["MT2",12]]}],"q":[["R2",8],["MT2","13–14"]],"korr":["„F und V = konstant“ → die Hill-Gleichung lautet **(F + a) · (v + b) = konstant**.","Ergänzt: der Einfluss von Kraft- und Geschwindigkeitstraining war in der Vorlage kaum ausgeführt.","Hinweis zum Skript (Teil 2, S. 14): exzentrisch heißt dort „Verkürzung des Muskels gegen Widerstand“. Richtig ist **Verlängerung** unter Spannung (bremsend), so wie in den Grafiken S. 20."]},{"id":"r2-13","nr":"III.5","thema":"muskelkater","f":"Was spricht physiologisch gesehen für einen Saunabesuch zur Vorbeugung von Muskelkater nach schwerem exzentrischem Krafttraining?","a":[{"h":"Wirkungen von Wärme","li":["**Durchblutung ↑** (Vasodilatation) → Entzündungsstoffe und Abbauprodukte werden schneller abtransportiert, O₂ und Aminosäuren kommen schneller an","**Stoffwechsel ↑** → mehr Energie für die Proteinsynthese bei der Reparatur","**Übersäuerung erholt sich** schneller","Muskeltonus sinkt, Schmerzlinderung (u. a. durch Endorphine)"],"q":[["MTG",29]]},{"h":"Was die Studien sagen","li":["Metaanalyse (J Rehabil Med 2022, 59 Studien): **in den ersten 48 h** linderte **Wärme** (Wärmekissen) den Schmerz am besten, **nach 48 h** eher **Kälte**","Länger dauernde Wärme (Wärmeauflagen über Stunden) war kurzen Eisanwendungen überlegen","Einschränkung: die Studien sind oft klein und schlecht verblindet"],"m":"Muskelkater ist keine Muskelverletzung: Bei Zerrung oder Faserriss gilt **PECH** (Pause, Eis, Compression, Hochlagern) – Kälte vermindert Einblutung und Schwellung.","q":[["MTG","22–25"],["MTG",27]]}],"q":[["R2",9],["MTG",29],["MTG","22–25"]],"korr":["Die Erklärung über die Muskelspindeln steht nicht in den Unterlagen; ersetzt durch die Wärmewirkungen aus dem Skript (Grafiken S. 29).","Ergänzt: Studienlage und Abgrenzung zur Muskelverletzung (PECH)."]},{"id":"r2-14","nr":"III.6a","thema":"training","f":"Studie (J Strength Cond Res 2010): Viermal pro Woche isometrisches Quadrizepstraining. Welche Beobachtungen wurden gemacht?","abb":[{"h":"Abbildung (nachgezeichnet)","li":["Relative Änderung des Muskelquerschnitts während 2 Monaten Training und 3 Monaten Pause"],"br":{"s":[["Vorher",0,"0 %"],["1 Monat",1,"≈ +1 %"],["2 Monate",4,"≈ +4 %"],["Trainingsende",6,"≈ +6 %"],["1 Monat Pause",1,"≈ +1 %"],["2 Monate Pause",0,"≈ 0 %"],["3 Monate Pause",0,"≈ 0 %"]],"c":"Werte aus der Abbildung abgelesen (ungefähr)"}}],"a":[{"li":["Während des Trainings steigt der Muskelquerschnitt stetig (nach 1 und nach 2 Monaten)","**Maximum direkt am Trainingsende**, etwa +6 %","Nach dem Trainingsstopp **schneller Rückgang**: nach 1 Monat ist der Zuwachs größtenteils weg","Nach 2–3 Monaten **kein messbarer Zuwachs** mehr – wieder auf dem Ausgangswert"]}],"q":[["R2","9–10"]]},{"id":"r2-15","nr":"III.6b","thema":"training","f":"Welche physiologischen Veränderungen auf Ebene der Muskelfasern liegen den Beobachtungen zugrunde?","abb":[{"h":"Abbildung (nachgezeichnet)","li":["Relative Änderung des Muskelquerschnitts während 2 Monaten Training und 3 Monaten Pause"],"br":{"s":[["Vorher",0,"0 %"],["1 Monat",1,"≈ +1 %"],["2 Monate",4,"≈ +4 %"],["Trainingsende",6,"≈ +6 %"],["1 Monat Pause",1,"≈ +1 %"],["2 Monate Pause",0,"≈ 0 %"],["3 Monate Pause",0,"≈ 0 %"]],"c":"Werte aus der Abbildung abgelesen (ungefähr)"}}],"a":[{"tb":[["Phase","Was in der Faser passiert"],["   app.appendChild(el('header', { class: 'top' },

    el('nav', { class: 'tabs' }, TABS.map(function (t) {

    }))));

}
function zurueck(href, text) { return el('a', { class: 'zurueck', href: href, text: '← ' + text }); }

function alleText() {

  var mitFragen = D.themen.filter(function (t) { return t.fragen.length; });

function vSet(titel, sub, fragen, offenId, back) {
  shell('razzia', 'set', [
